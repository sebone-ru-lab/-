性の可動域制限が強く疑われる","関節包短縮による制限が強く疑われる","筋力低下や疼痛抑制が疑われる","関節面変形による制限が強く疑われる"],"a":2,"e":"正解は『筋力低下や疼痛抑制が疑われる』である。他動ROMが保たれていれば関節構造上は動かせるため、筋出力低下、疼痛、神経障害などが自動運動を制限している可能性がある。","t":""},{"n":308,"c":6,"s":"ROM測定の再現性を高める方法として適切なのはどれか。","o":["測定ごとに運動速度を速くする","測定ごとに終末負荷を強くする","測定ごとに検査者を変更する","同じ体位と同じ骨指標を用いる"],"a":3,"e":"正解は『同じ体位と同じ骨指標を用いる』である。体位、固定方法、骨指標、測定手順を標準化すると、測定者内および測定者間のばらつきを抑えられる。","t":""},{"n":309,"c":6,"s":"傾斜計を用いた関節可動域測定の特徴はどれか。","o":["重力方向を基準に傾斜角を測れる","関節内圧を基準に硬さを測れる","筋収縮量を基準に筋力を測れる","皮膚温度を基準に炎症を測れる"],"a":0,"e":"正解は『重力方向を基準に傾斜角を測れる』である。傾斜計は重力に対する身体部位の傾きを測定し、脊柱や四肢の角度評価に利用される。","t":""},{"n":310,"c":6,"s":"疼痛を伴うROM測定の記録として適切なのはどれか。","o":["疼痛強度と測定後の休息時間を記録する","疼痛出現角度と運動終末角度を記録する","疼痛消失角度と測定側の筋力値を記録する","疼痛部位と非測定側の可動域値を記録する"],"a":1,"e":"正解は『疼痛出現角度と運動終末角度を記録する』である。疼痛が出現した角度と運動が停止した角度を分けて記録すると、症状の刺激性と機械的制限を把握しやすい。","t":""},{"n":311,"c":6,"s":"MMT3の判定基準として適切なのはどれか。","o":["重力除去位で全可動域を動かせる","抗重力位で一部可動域を動かせる","抗重力位で全可動域を動かせる","抗重力位で強い抵抗に耐えられる"],"a":2,"e":"正解は『抗重力位で全可動域を動かせる』である。MMT3は重力に抗して全可動域を動かせるが、検査者による追加抵抗には耐えられない段階である。","t":""},{"n":312,"c":6,"s":"MMT2の判定基準として適切なのはどれか。","o":["筋収縮を触知するが関節運動はない","抗重力位で全可動域を動かせる","抗重力位で中等度抵抗に耐えられる","重力除去位で全可動域を動かせる"],"a":3,"e":"正解は『重力除去位で全可動域を動かせる』である。MMT2では重力の影響を除いた肢位で全可動域を動かせるが、重力に抗した全可動域運動はできない。","t":""},{"n":313,"c":6,"s":"MMT4の判定基準として適切なのはどれか。","o":["抗重力位で全可動域を動かし中等度抵抗に耐える","抗重力位で全可動域を動かし追加抵抗には耐えない","抗重力位で全可動域を動かし最大抵抗に耐える","重力除去位で全可動域を動かし抵抗は加えない"],"a":0,"e":"正解は『抗重力位で全可動域を動かし中等度抵抗に耐える』である。MMT4は抗重力位で全可動域を動かし、検査者の中等度の抵抗にも保持できる段階である。Danielsでは「強い〜中等度の抵抗に抗して保持できるが、最大抵抗では崩れる」段階とされる。","t":"【解説補足】"},{"n":314,"c":6,"s":"MMT1の判定基準として適切なのはどれか。","o":["関節運動はあるが全可動域には達しない","筋収縮は触知できるが関節運動はない","重力除去位で全可動域を動かせる","抗重力位で全可動域を動かせる"],"a":1,"e":"正解は『筋収縮は触知できるが関節運動はない』である。MMT1では筋収縮を視認または触知できるが、関節運動を生じさせるだけの筋力はない。","t":""},{"n":315,"c":6,"s":"MMT0の判定基準として適切なのはどれか。","o":["筋収縮は触知できるが運動はない","重力除去位で一部だけ運動できる","筋収縮を視認も触知もできない","抗重力位で一部だけ運動できる"],"a":2,"e":"正解は『筋収縮を視認も触知もできない』である。MMT0は観察と触診のいずれでも対象筋の収縮を確認できない状態を示す。","t":""},{"n":316,"c":6,"s":"MMTにおけるブレイクテストの実施方法はどれか。","o":["関節を反復させて疲労回数を調べる","関節を他動で動かして終末感を調べる","筋を電気刺激して収縮速度を調べる","検査肢位を保たせ抵抗で保持を崩す"],"a":3,"e":"正解は『検査肢位を保たせ抵抗で保持を崩す』である。ブレイクテストでは所定の肢位を保持させ、徐々に抵抗を加えて保持能力を判定する。","t":""},{"n":317,"c":6,"s":"MMTで代償運動を抑える操作として適切なのはどれか。","o":["近位部を固定して代償運動を抑える","遠位部を固定して関節運動を止める","抵抗を急に加えて反射収縮を促す","疼痛を超えて最大抵抗を加える"],"a":0,"e":"正解は『近位部を固定して代償運動を抑える』である。近位部を安定させることで、隣接筋や体幹による代償を減らし、対象筋の筋力を評価しやすくなる。","t":""},{"n":318,"c":6,"s":"MMTの測定尺度としての性質はどれか。","o":["各段階の差が等しい比例尺度として扱える","各段階の差が等しくない順序尺度である","筋力を連続値で示す間隔尺度として扱える","筋力を絶対値で示す比率尺度として扱える"],"a":1,"e":"正解は『各段階の差が等しくない順序尺度である』である。MMTは筋力を順序づけて表すが、例えば2と3の差が3と4の差に等しいとは限らない。","t":""},{"n":319,"c":6,"s":"疼痛がある状態でMMTを行った場合に生じやすい影響はどれか。","o":["筋出力が疼痛によって過大に表れる","関節可動域が疼痛によって広く表れる","筋出力が疼痛抑制によって低く表れる","代償運動が疼痛によって少なく表れる"],"a":2,"e":"正解は『筋出力が疼痛抑制によって低く表れる』である。疼痛は随意収縮を抑制することがあり、測定値が筋そのものの能力より低くなる可能性がある。","t":""},{"n":320,"c":6,"s":"強い筋群をMMTで評価する際の限界はどれか。","o":["弱い筋では収縮の有無を確認しにくい","疼痛例では筋力が常に正常に表れる","麻痺例では関節運動を確認しにくい","強い筋では筋力差を判別しにくくなる"],"a":3,"e":"正解は『強い筋では筋力差を判別しにくくなる』である。MMTは高い筋力領域で天井効果が生じやすく、微細な筋力差には徒手筋力計などの定量的評価が有用である。","t":""},{"n":321,"c":6,"s":"Lachmanテストが主に評価する組織はどれか。","o":["前十字靱帯の前方不安定性","後十字靱帯の後方不安定性","内側側副靱帯の内側不安定性","外側側副靱帯の外側不安定性"],"a":0,"e":"正解は『前十字靱帯の前方不安定性』である。Lachmanテストは膝関節を軽度屈曲位として脛骨の前方移動量と終末感を評価する。","t":""},{"n":322,"c":6,"s":"膝関節の後方引き出しテストが主に評価する損傷はどれか。","o":["前十字靱帯の損傷","後十字靱帯の損傷","内側半月板の損傷","外側半月板の損傷"],"a":1,"e":"正解は『後十字靱帯の損傷』である。脛骨を大腿骨に対して後方へ押し、後方移動の増大や終末感の変化を確認する。","t":""},{"n":323,"c":6,"s":"McMurrayテストが主に評価する病変はどれか。","o":["膝蓋腱の損傷","側副靱帯の損傷","半月板の損傷","腸脛靱帯の障害"],"a":2,"e":"正解は『半月板の損傷』である。膝関節の屈伸に回旋と内外反を組み合わせ、関節裂隙の疼痛やクリックを確認する。","t":""},{"n":324,"c":6,"s":"Thompsonテストが主に評価する損傷はどれか。","o":["膝蓋腱断裂の有無","大腿四頭筋腱断裂の有無","前距腓靱帯断裂の有無","アキレス腱断裂の有無"],"a":3,"e":"正解は『アキレス腱断裂の有無』である。腹臥位で下腿三頭筋を把持しても足関節底屈が生じない場合、アキレス腱断裂が疑われる。","t":""},{"n":325,"c":6,"s":"Finkelsteinテストが主に用いられる病態はどれか。","o":["ドケルバン病の疼痛誘発","手根管症候群の疼痛誘発","肘部管症候群の疼痛誘発","母指CM関節症の疼痛誘発"],"a":0,"e":"正解は『ドケルバン病の疼痛誘発』である。母指側手関節に負荷を加え、第1背側区画を通る長母指外転筋腱と短母指伸筋腱付近の疼痛を確認する。一般的な手技は、母指を握り込ませて手関節を尺屈させる方法（厳密にはEichhoff法）である。","t":"【解説補足】手技の具体化。"},{"n":326,"c":6,"s":"Phalenテストが主に誘発する神経症状はどれか。","o":["橈骨神経障害による症状","正中神経障害による症状","尺骨神経障害による症状","腋窩神経障害による症状"],"a":1,"e":"正解は『正中神経障害による症状』である。手関節を屈曲位に保持して手根管内の圧を高め、正中神経領域のしびれや疼痛を誘発する。","t":""},{"n":327,"c":6,"s":"Spurlingテストで確認する症状はどれか。","o":["胸郭出口部の血管症状","肩峰下部の衝突症状","頸椎神経根の放散症状","肘関節部の靱帯症状"],"a":2,"e":"正解は『頸椎神経根の放散症状』である。頸椎の伸展、側屈、軸圧によって椎間孔を狭め、上肢への放散痛やしびれの再現を確認する。","t":""},{"n":328,"c":6,"s":"下肢伸展挙上テストで主に機械的刺激が加わる神経系はどれか。","o":["大腿神経と上位腰神経根の神経系","閉鎖神経と中位腰神経根の神経系","上殿神経と仙腸関節部の神経系","坐骨神経と腰仙部神経根の神経系"],"a":3,"e":"正解は『坐骨神経と腰仙部神経根の神経系』である。膝伸展位で股関節を屈曲すると坐骨神経系が緊張し、腰仙部神経根症状や神経の機械的過敏性を評価できる。","t":""},{"n":329,"c":6,"s":"FABERテストの主な評価対象はどれか。","o":["股関節と仙腸関節周囲の症状","膝関節と近位脛腓関節の症状","足関節と遠位脛腓関節の症状","肩関節と肩鎖関節周囲の症状"],"a":0,"e":"正解は『股関節と仙腸関節周囲の症状』である。股関節を屈曲、外転、外旋位にして疼痛や可動性を調べ、疼痛部位から股関節または仙腸関節周囲の関与を検討する。","t":""},{"n":330,"c":6,"s":"膝関節外反ストレステストで主に評価する組織はどれか。","o":["外側側副靱帯の不安定性","内側側副靱帯の不安定性","前十字靱帯の不安定性","後十字靱帯の不安定性"],"a":1,"e":"正解は『内側側副靱帯の不安定性』である。膝関節に外反力を加えて内側関節裂隙の開大や疼痛を確認し、内側側副靱帯の状態を評価する。膝軽度屈曲位（約30°）で行うとMCLを分離評価しやすく、伸展0°位でも陽性なら十字靱帯等の合併損傷を疑う。","t":"【解説補足】検査肢位。"},{"n":331,"c":6,"s":"骨盤前傾の増大と関連する脊柱アライメントはどれか。","o":["頸椎前弯の減少","胸椎後弯の減少","腰椎前弯の増大","腰椎前弯の減少"],"a":2,"e":"正解は『腰椎前弯の増大』である。骨盤前傾は腰仙部の伸展方向の配列と関連し、一般に腰椎前弯を増大させる。","t":""},{"n":332,"c":6,"s":"Q角の測定に用いる3つの骨指標はどれか。","o":["上前腸骨棘、膝蓋骨中心、腓骨頭中央","大腿骨頭中心、膝蓋骨中心、脛骨内果","坐骨結節中央、膝蓋骨中心、腓骨外果","上前腸骨棘、膝蓋骨中心、脛骨粗面"],"a":3,"e":"正解は『上前腸骨棘、膝蓋骨中心、脛骨粗面』である。上前腸骨棘と膝蓋骨中心を結ぶ線、および膝蓋骨中心と脛骨粗面を結ぶ線がなす角を測定する。","t":""},{"n":333,"c":6,"s":"外反膝の前額面アライメントとして適切なのはどれか。","o":["両膝が近づき両内果が離れる配列","両膝が離れて両内果が近づく配列","両膝と両内果がともに離れる配列","両膝と両内果がともに重なる配列"],"a":0,"e":"正解は『両膝が近づき両内果が離れる配列』である。外反膝では膝が内側へ偏位するため、膝を接近させると左右の内果間に距離が生じる。","t":""},{"n":334,"c":6,"s":"内反膝の前額面アライメントとして適切なのはどれか。","o":["両膝が接して両足関節が離れる","両足関節が接して両膝が離れる","両膝と両足関節がともに接する","片側膝だけが前方へ移動する"],"a":1,"e":"正解は『両足関節が接して両膝が離れる』である。内反膝では膝が外側へ偏位するため、内果を接触させた立位で左右の膝の間に距離が生じる。","t":""},{"n":335,"c":6,"s":"扁平足にみられる代表的なアライメント所見はどれか。","o":["外側縦アーチ高の明らかな増大","横アーチ高だけの明らかな増大","内側縦アーチ高の明らかな低下","足趾伸展角度だけの明らかな増大"],"a":2,"e":"正解は『内側縦アーチ高の明らかな低下』である。扁平足では荷重時を中心に内側縦アーチが低下し、後足部外反などを伴うことがある。","t":""},{"n":336,"c":6,"s":"翼状肩甲の観察所見として適切なのはどれか。","o":["肩峰が下方へ大きく偏位する","鎖骨が後方へ大きく偏位する","上腕骨頭が前方へ大きく偏位する","肩甲骨内側縁が後方へ浮き上がる"],"a":3,"e":"正解は『肩甲骨内側縁が後方へ浮き上がる』である。翼状肩甲では肩甲骨が胸郭から離れ、特に内側縁や下角の突出として観察される。","t":""},{"n":337,"c":6,"s":"前方頭位を側面から観察した際の所見はどれか。","o":["外耳孔が肩峰より前方に位置する","外耳孔が肩峰より後方に位置する","肩峰が大転子より後方に位置する","肩峰が大転子より内側に位置する"],"a":0,"e":"正解は『外耳孔が肩峰より前方に位置する』である。前方頭位では頭部が体幹に対して前方へ変位し、側面観察で外耳孔が肩峰より前方に位置する。","t":""},{"n":338,"c":6,"s":"下肢の構造的脚長を測定する方法はどれか。","o":["臍から外果までを測定する","上前腸骨棘から内果までを測定する","大転子から膝関節裂隙までを測定する","坐骨結節から腓骨頭までを測定する"],"a":1,"e":"正解は『上前腸骨棘から内果までを測定する』である。上前腸骨棘から内果までの距離は、骨性の下肢長差をみる代表的な測定法である。","t":""},{"n":339,"c":6,"s":"骨盤傾斜の影響を含む見かけ上の脚長を測定する方法はどれか。","o":["大転子中央から外果中央までの距離","上前腸骨棘から内果中央までの距離","臍中央から内果中央までの距離","膝蓋骨中心から内果中央までの距離"],"a":2,"e":"正解は『臍中央から内果中央までの距離』である。臍から内果までの見かけ上の脚長には、骨盤の側方傾斜や下肢の位置関係による影響が含まれる。","t":""},{"n":340,"c":6,"s":"骨盤傾斜を前額面で観察する際の指標はどれか。","o":["矢状面での肩峰前後位置の左右差","水平面での膝蓋骨回旋量の左右差","矢状面での外耳孔位置の左右差","前額面での腸骨稜高さの左右差"],"a":3,"e":"正解は『前額面での腸骨稜高さの左右差』である。左右の腸骨稜や上前腸骨棘の高さを比較することで、骨盤の側方傾斜を評価できる。","t":""},{"n":341,"c":6,"s":"数値評価尺度による疼痛評価の方法はどれか。","o":["数字を選んで疼痛強度を示す方法","線上に印を付け疼痛強度を示す方法","表情図を選んで疼痛強度を示す方法","形容語を選んで疼痛強度を示す方法"],"a":0,"e":"正解は『数字を選んで疼痛強度を示す方法』である。数値評価尺度では一般に0を痛みなし、10を想像できる最大の痛みとして、患者が強度に対応する数字を選ぶ。","t":""},{"n":342,"c":6,"s":"視覚的アナログ尺度による疼痛評価の方法はどれか。","o":["複数の表情図から強度を選択する","一本の直線上に強度を印で示す","複数の数字から強度を選択する","複数の形容語から強度を選択する"],"a":1,"e":"正解は『一本の直線上に強度を印で示す』である。視覚的アナログ尺度では、両端に疼痛強度の基準を示した直線上へ患者が印を付け、その位置を測定する。","t":""},{"n":343,"c":6,"s":"疼痛評価でボディチャートを用いる主な目的はどれか。","o":["疼痛強度の時間変化を数値化する","疼痛行動の頻度を回数で記録する","疼痛部位と広がりを図上に記録する","疼痛閾値を圧力刺激で測定する"],"a":2,"e":"正解は『疼痛部位と広がりを図上に記録する』である。ボディチャートは疼痛やしびれの位置、分布、放散範囲を身体図上に示す方法である。","t":""},{"n":344,"c":6,"s":"神経障害性疼痛を示唆する疼痛表現はどれか。","o":["重だるく局所に限られる痛み","運動時だけ関節に生じる痛み","圧迫時だけ筋腹に生じる痛み","灼けるような電撃性の痛み"],"a":3,"e":"正解は『灼けるような電撃性の痛み』である。神経障害性疼痛では灼熱痛、電撃痛、しびれを伴う痛みなどの表現がみられやすい。","t":""},{"n":345,"c":6,"s":"機械的な侵害受容性疼痛を示唆する特徴はどれか。","o":["荷重や動作で増悪し安静で軽減する","軽い接触だけで広範囲に激痛が出る","神経走行に沿って電撃痛が放散する","組織治癒後も刺激なく痛みが続く"],"a":0,"e":"正解は『荷重や動作で増悪し安静で軽減する』である。侵害受容性疼痛は損傷組織への機械的負荷と対応して変化することが多く、動作や荷重との関係を確認することが重要である。","t":""},{"n":346,"c":6,"s":"中枢性感作を示唆する疼痛所見はどれか。","o":["痛みが損傷部位だけに限局している","痛みが組織所見に比して広く過敏である","痛みが荷重時だけ一定して出現する","痛みが局所冷却だけで長時間消失する"],"a":1,"e":"正解は『痛みが組織所見に比して広く過敏である』である。中枢性感作では組織損傷の程度と釣り合わない強い疼痛、広範な過敏性、アロディニアなどがみられることがある。","t":""},{"n":347,"c":6,"s":"アロディニアの定義として適切なのはどれか。","o":["痛み刺激への反応が低下する状態","痛み刺激への反応が遅延する状態","非侵害刺激で痛みが生じる状態","無刺激でも筋力が低下する状態"],"a":2,"e":"正解は『非侵害刺激で痛みが生じる状態』である。衣服の接触や軽い触刺激など、通常は痛みを生じない刺激によって痛みが誘発される。","t":""},{"n":348,"c":6,"s":"痛覚過敏の定義として適切なのはどれか。","o":["痛み刺激に対する感覚が消失する","非侵害刺激でしびれだけが生じる","痛み刺激への反応開始が遅くなる","痛み刺激への反応が過度に強くなる"],"a":3,"e":"正解は『痛み刺激への反応が過度に強くなる』である。痛覚過敏では、本来痛みを生じる刺激に対する疼痛反応が通常より増強する。","t":""},{"n":349,"c":6,"s":"疼痛日誌を使用する主な目的はどれか。","o":["痛みと活動や時間帯の関係を捉える","痛みの原因組織を画像なしで確定する","痛みの神経伝導速度を自宅で測定する","痛みの閾値を毎回同じ値に固定する"],"a":0,"e":"正解は『痛みと活動や時間帯の関係を捉える』である。疼痛強度、活動内容、服薬、睡眠、時間帯などを継続して記録すると、症状の変動要因を把握しやすい。","t":""},{"n":350,"c":6,"s":"運動器疼痛の問診で迅速な医学的評価を要する所見はどれか。","o":["階段昇降で増える片側膝痛","排尿障害を伴う両下肢症状","長時間座位で増える殿部痛","把持動作で増える手関節痛"],"a":1,"e":"正解は『排尿障害を伴う両下肢症状』である。排尿障害に両下肢症状や会陰部感覚障害を伴う場合は馬尾障害が疑われ、迅速な医学的評価が必要となる。","t":""},{"n":351,"c":7,"s":"静的ストレッチングの基本的な実施方法はどれか。","o":["一定姿勢で筋をゆっくり伸ばして保持する","反動を使って可動域を繰り返し往復させる","筋力発揮を高速で繰り返して休息する","関節を固定して強い抵抗を加え続ける"],"a":0,"e":"正解は『一定姿勢で筋をゆっくり伸ばして保持する』である。静的ストレッチングでは、反動を用いずに筋を緩徐に伸張し、その肢位を一定時間保持する。","t":""},{"n":352,"c":7,"s":"動的ストレッチングの特徴として適切なのはどれか。","o":["最終域で姿勢を一定時間保持する","反動だけで限界域まで強く伸ばす","動作に合わせて筋を能動的に伸ばす","外力だけで関節を静止させて伸ばす"],"a":2,"e":"正解は『動作に合わせて筋を能動的に伸ばす』である。動的ストレッチングは、制御された反復運動によって筋や関節を運動に必要な可動域へ導く方法である。","t":""},{"n":353,"c":7,"s":"PNFストレッチングのホールド・リラックス法に該当する手順はどれか。","o":["拮抗筋を等張性収縮させてから休ませる","対象筋を等尺性収縮させてから伸ばす","対象筋を短縮性収縮させてから休ませる","拮抗筋を伸張性収縮させてから縮める"],"a":1,"e":"正解は『対象筋を等尺性収縮させてから伸ばす』である。ホールド・リラックス法では、伸張する筋を等尺性収縮させ、弛緩後に他動的な伸張を加える。","t":""},{"n":354,"c":7,"s":"バリスティックストレッチングの特徴はどれか。","o":["呼吸に合わせて静止姿勢を保つ","自重による低負荷を長時間持続する","他動運動で中間域を緩徐に往復する","反動を用いて伸張運動を反復する"],"a":3,"e":"正解は『反動を用いて伸張運動を反復する』である。バリスティックストレッチングは、弾みや反動を利用して筋を反復的に伸張する方法であり、実施には十分な制御が必要である。","t":""},{"n":355,"c":7,"s":"ストレッチング強度を設定する際の原則として適切なのはどれか。","o":["鋭い疼痛が出る強度まで高める","軽い伸張感を得る範囲にとどめる","しびれが出る強度まで維持する","筋けいれんが出る範囲まで続ける"],"a":1,"e":"正解は『軽い伸張感を得る範囲にとどめる』である。ストレッチングは疼痛やしびれを誘発しない範囲で行い、組織へ過大な負荷を加えないようにする。","t":""},{"n":356,"c":7,"s":"主動作筋を収縮させて拮抗筋の緊張を抑える方法が利用する機序はどれか。","o":["相反抑制を利用する方法","自原抑制を利用する方法","伸張反射を利用する方法","交差性反射を利用する方法"],"a":0,"e":"正解は『相反抑制を利用する方法』である。主動作筋の収縮に伴って拮抗筋の活動が抑制されるため、拮抗筋を伸張しやすくなる。","t":""},{"n":357,"c":7,"s":"関節拘縮に対する持続的ストレッチングの負荷方法として適切なのはどれか。","o":["高負荷を短時間加える方法","高速度を短時間加える方法","最大負荷を反復して加える方法","低負荷を長時間加える方法"],"a":3,"e":"正解は『低負荷を長時間加える方法』である。低負荷で持続的な伸張は、組織損傷を避けながら軟部組織の伸張性改善を図る方法である。","t":""},{"n":358,"c":7,"s":"遅発性筋痛に対するストレッチングの予防効果について適切なのはどれか。","o":["運動前の伸張で発症を防ぎやすい","運動直後の伸張で症状を消しやすい","伸張だけでは予防効果が乏しい","強い伸張ほど予防効果が高まりやすい"],"a":2,"e":"正解は『伸張だけでは予防効果が乏しい』である。運動前後のストレッチングだけで遅発性筋痛を有意に予防できるとは限らず、過度な伸張は組織への負荷となる。","t":""},{"n":359,"c":7,"s":"等尺性筋収縮の特徴はどれか。","o":["筋長をほぼ変えずに張力を発揮する","筋長を短くしながら張力を発揮する","筋長を長くしながら張力を発揮する","関節を動かしながら角速度を維持する"],"a":0,"e":"正解は『筋長をほぼ変えずに張力を発揮する』である。等尺性収縮では関節運動をほとんど伴わず、筋が張力を発揮する。","t":""},{"n":360,"c":7,"s":"短縮性筋収縮が生じている状態はどれか。","o":["外力に抗して筋長が変化しない","外力に従って筋長が長くなる","外力を受けて筋活動が低下する","外力に勝って筋長が短くなる"],"a":3,"e":"正解は『外力に勝って筋長が短くなる』である。短縮性収縮では、筋張力が外力を上回ることで筋が短くなり、関節運動が生じる。","t":""},{"n":361,"c":7,"s":"伸張性筋収縮の特徴はどれか。","o":["筋が短縮しながら外力を上回る","筋長を保ちながら外力に抗し続ける","筋が伸張しながら外力を制動する","筋活動を止めながら外力に従い続ける"],"a":2,"e":"正解は『筋が伸張しながら外力を制動する』である。伸張性収縮では筋が活動を保ったまま長くなり、重力や外部負荷による運動を制動する。","t":""},{"n":362,"c":7,"s":"漸増抵抗運動の基本原則はどれか。","o":["負荷を一定にして回数だけ減らす","適応に応じて負荷を段階的に増す","疲労に応じて運動頻度だけ増やす","疼痛に関係なく最大負荷を維持する"],"a":1,"e":"正解は『適応に応じて負荷を段階的に増す』である。筋力の向上に応じて負荷を調整し、過負荷を段階的に与えることで継続的な適応を促す。","t":""},{"n":363,"c":7,"s":"筋力評価で用いる1RMの定義はどれか。","o":["正しい方法で1分間反復できる最大回数","正しい方法で1秒間に発揮できる最大速度","正しい方法で1日に実施できる最大運動量","正しい方法で1回挙上できる最大負荷"],"a":3,"e":"正解は『正しい方法で1回挙上できる最大負荷』である。1RMは、定められた運動を適切な方法で1回だけ完遂できる最大の負荷を表す。","t":""},{"n":364,"c":7,"s":"開放性運動連鎖に該当する特徴はどれか。","o":["末端部が空間内を自由に動く運動","末端部が床面に固定されたままの運動","複数関節が同時に荷重を受ける運動","体幹が支持面上で移動し続ける運動"],"a":0,"e":"正解は『末端部が空間内を自由に動く運動』である。開放性運動連鎖では四肢の遠位部が固定されず、膝伸展運動など特定の筋群を選択的に訓練しやすい。","t":""},{"n":365,"c":7,"s":"閉鎖性運動連鎖に該当する運動はどれか。","o":["足部が空中で膝だけを伸ばす運動","足部を床につけて立ち上がる運動","下腿を台から垂らして曲げる運動","足関節を無荷重で背屈させる運動"],"a":1,"e":"正解は『足部を床につけて立ち上がる運動』である。閉鎖性運動連鎖では遠位部が支持面に固定され、複数関節と複数筋群が協調して活動する。","t":""},{"n":366,"c":7,"s":"筋力トレーニングにおける特異性の原則はどれか。","o":["低負荷の訓練ほど高速動作へ転移しやすい","単関節の訓練ほど複合動作へ転移しやすい","訓練した動作や速度に適応が生じやすい","運動様式が違っても適応は同一になりやすい"],"a":2,"e":"正解は『訓練した動作や速度に適応が生じやすい』である。筋力増強の効果は、訓練した筋群、関節角度、収縮様式および運動速度に特異的に現れやすい。","t":""},{"n":367,"c":7,"s":"筋パワーの説明として適切なのはどれか。","o":["大きな力を長時間保つ能力を指す","一定の力を繰り返し保つ能力を指す","力と速度の積で表され、単位時間あたりの仕事を発揮する能力を指す","関節位置を静止して保つ能力を指す"],"a":2,"e":"正解は『力と速度の積で表され、単位時間あたりの仕事を発揮する能力を指す』である。筋パワーは力と運動速度の双方に関係し、素早い立ち上がりや跳躍などに重要である。（パワー＝力×速度。「力を短時間で立ち上げる能力」は力の立ち上がり速度＝RFDである。）","t":"【要修正】原文「力を短時間で発揮する能力」はRFDに近く、パワーの定義として不正確。"},{"n":368,"c":7,"s":"トレーニングにおける可逆性の原則を示すのはどれか。","o":["休止しても訓練効果は変化しにくい","休止すると訓練効果は低下し得る","休止すると訓練効果は高まりやすい","休止すると筋持久力だけが高まりやすい"],"a":1,"e":"正解は『休止すると訓練効果は低下し得る』である。獲得した筋力や持久力は、訓練を中断して活動量が減少すると徐々に失われる可能性がある。","t":""},{"n":369,"c":7,"s":"フレンケル体操の基本的な実施方法はどれか。","o":["視覚で下肢運動を確認しながら反復する","閉眼で最大筋力を確認しながら反復する","温熱下で関節運動を確認しながら反復する","免荷下で筋伸張を確認しながら反復する"],"a":0,"e":"正解は『視覚で下肢運動を確認しながら反復する』である。フレンケル体操では視覚的な確認と反復練習を利用し、感覚性運動失調における運動の正確性向上を図る。","t":""},{"n":370,"c":7,"s":"運動学習における結果の知識に該当する情報はどれか。","o":["運動中の関節運動の形を伝える情報","運動中の身体の使い方を伝える情報","運動前に目標となる動作を示す情報","運動後に目標の達成結果を伝える情報"],"a":3,"e":"正解は『運動後に目標の達成結果を伝える情報』である。結果の知識は、目標までの距離や所要時間など、運動によって得られた成果に関するフィードバックである。","t":""},{"n":371,"c":7,"s":"運動学習におけるランダム練習の方法はどれか。","o":["同じ課題だけを一定の順序で反復する","複数課題を不規則な順序で練習する","一つの課題を休息なしで繰り返し行う","複数課題を難易度の順だけで練習する"],"a":1,"e":"正解は『複数課題を不規則な順序で練習する』である。ランダム練習では異なる課題を予測しにくい順序で行い、課題ごとに運動計画を再構成する。","t":""},{"n":372,"c":7,"s":"運動学習で用いる漸減的フィードバックの特徴はどれか。","o":["毎試行で外的情報を段階的に増やし続ける","課題中の外的情報を最初から遮断し続ける","誤差の有無にかかわらず情報量を固定する","学習に伴って外的情報を徐々に減らす"],"a":3,"e":"正解は『学習に伴って外的情報を徐々に減らす』である。外的フィードバックへの依存を減らし、本人の内在的フィードバックを用いた修正を促す方法である。","t":""},{"n":373,"c":7,"s":"バランス訓練で姿勢制御能力を高める課題はどれか。","o":["支持面を不安定にして姿勢制御を促す","支持面を固定して筋力発揮だけを促す","視覚を増やして代償動作だけを促す","上肢を固定して関節可動域だけを促す"],"a":0,"e":"正解は『支持面を不安定にして姿勢制御を促す』である。不安定な支持面では体性感覚情報や筋活動の調整が求められ、課題の難易度が上昇する。","t":""},{"n":374,"c":7,"s":"二重課題訓練に該当する方法はどれか。","o":["一つの運動課題を左右交互に行う練習","一つの運動課題を速度別に行う練習","運動課題と認知課題を同時に行う練習","運動課題を休息の前後に分けて行う練習"],"a":2,"e":"正解は『運動課題と認知課題を同時に行う練習』である。歩行しながら計算する場合など、二つの課題へ同時に注意を配分する能力を訓練する。","t":""},{"n":375,"c":7,"s":"課題指向型訓練の特徴として適切なのはどれか。","o":["筋力だけを生活動作と切り離して高める練習","感覚だけを生活動作と切り離して刺激する練習","速度だけを生活動作と切り離して変える練習","目標となる生活動作そのものを行う練習"],"a":3,"e":"正解は『目標となる生活動作そのものを行う練習』である。課題指向型訓練では、患者にとって意味のある具体的な動作を反復し、その遂行能力の向上を図る。","t":""},{"n":376,"c":7,"s":"表在温熱療法によって一般に生じる局所反応はどれか。","o":["皮膚血管を収縮させ血流を減らす","組織代謝を抑制して酸素需要を減らす","皮膚血管を拡張させ血流を増やす","末梢神経伝導を遅らせ痛覚を高める"],"a":2,"e":"正解は『皮膚血管を拡張させ血流を増やす』である。表在温熱療法は局所温度を上昇させ、血管拡張、血流増加および軟部組織の伸張性向上をもたらす。","t":""},{"n":377,"c":7,"s":"表在温熱療法の適用を避けるべき局所状態はどれか。","o":["慢性期の筋緊張がみられる部位","活動性の出血がみられる部位","瘢痕性の軟部組織が硬い部位","慢性期の関節可動性が低い部位"],"a":1,"e":"正解は『活動性の出血がみられる部位』である。温熱による血管拡張と血流増加は出血を助長する可能性があるため、止血が確認されていない部位には適用しない。","t":""},{"n":378,"c":7,"s":"パラフィン浴の特徴として適切なのはどれか。","o":["凹凸の多い手指を均一に温める方法","大きな体幹部を水中で均一に冷やす方法","広い背部を乾いた空気で均一に冷やす方法","下肢全体を高周波で深部まで温める方法"],"a":0,"e":"正解は『凹凸の多い手指を均一に温める方法』である。溶解したパラフィンが複雑な形状へ密着するため、手指などの小関節へ表在温熱を加える際に適している。","t":""},{"n":379,"c":7,"s":"寒冷療法による一般的な局所反応はどれか。","o":["皮膚血流と神経伝導速度を低下させる","皮膚血流と組織代謝量を増加させる","筋紡錘と痛覚受容器の活動を高める","局所温度と酸素需要量を増加させる"],"a":0,"e":"正解は『皮膚血流と神経伝導速度を低下させる』である。局所冷却は血管収縮や神経伝導速度の低下をもたらし、疼痛や急性期の腫脹を抑える目的で用いられる。","t":""},{"n":380,"c":7,"s":"クライオキネティクスの基本的な考え方はどれか。","o":["組織温度を上げてから安静を保つ","筋力を低下させてから固定を続ける","疼痛を軽減した時間内に運動を行う","感覚を消失させて最大負荷を加える"],"a":2,"e":"正解は『疼痛を軽減した時間内に運動を行う』である。寒冷による鎮痛を利用して安全な範囲で運動を行い、機能回復を促す方法である。","t":""},{"n":381,"c":7,"s":"交代浴の実施方法はどれか。","o":["温水だけに患部を一定時間繰り返し浸す方法","冷水だけに患部を一定時間繰り返し浸す方法","常温水だけに患部を一定時間繰り返し浸す方法","温水と冷水に患部を交互に浸す方法"],"a":3,"e":"正解は『温水と冷水に患部を交互に浸す方法』である。交代浴は温水浴と冷水浴を交互に行う方法で、末梢部の循環や浮腫への介入として用いられる。","t":""},{"n":382,"c":7,"s":"感覚障害がある部位に寒冷療法を行う際の対応はどれか。","o":["皮膚温が高ければ冷却時間を大幅に延ばす","皮膚状態と末梢循環を頻回に確認する","筋疲労があれば低温の氷を直接当て続ける","浮腫があれば冷却中の圧迫を強め続ける"],"a":1,"e":"正解は『皮膚状態と末梢循環を頻回に確認する』である。感覚障害があると過度な冷却を本人が認識できないため、皮膚色や循環状態を観察して凍傷などを防ぐ。","t":""},{"n":383,"c":7,"s":"経皮的電気神経刺激であるTENSの主な目的はどれか。","o":["関節可動域の機械的拡大を目的とする","腱の伸張性の持続的増大を目的とする","電気刺激による疼痛緩和を目的とする","骨配列の静的な矯正保持を目的とする"],"a":2,"e":"正解は『電気刺激による疼痛緩和を目的とする』である。TENSは皮膚上の電極から知覚神経を刺激し、疼痛の調節を図る電気療法である。","t":""},{"n":384,"c":7,"s":"神経筋電気刺激であるNMESの基本的な作用はどれか。","o":["運動神経を刺激して筋収縮を起こす","知覚神経を刺激して温度感覚を高める","骨組織を刺激して関節配列を変える","腱組織を刺激して伸張性を高める"],"a":0,"e":"正解は『運動神経を刺激して筋収縮を起こす』である。NMESは電気刺激によって運動神経を興奮させ、筋力増強や筋萎縮予防に利用できる筋収縮を誘発する。","t":""},{"n":385,"c":7,"s":"機能的電気刺激であるFESの特徴はどれか。","o":["安静時だけに筋収縮を持続させる刺激","動作の時相に合わせ機能を補う刺激","疼痛閾値を測る目的だけで行う刺激","関節を固定する目的だけで行う刺激"],"a":1,"e":"正解は『動作の時相に合わせ機能を補う刺激』である。FESは歩行の遊脚期に足関節背屈筋を刺激する場合など、目的動作に合わせて筋収縮を誘発する。","t":""},{"n":386,"c":7,"s":"干渉電流療法の電流の用い方はどれか。","o":["低周波直流を一方向に流す方法","温熱用超音波を同時に照射する方法","高電圧直流を一点へ集中させる方法","中周波電流を組織内で交差させる方法"],"a":3,"e":"正解は『中周波電流を組織内で交差させる方法』である。周波数がわずかに異なる中周波電流を交差させ、その差に相当するうなりを治療に利用する。","t":""},{"n":387,"c":7,"s":"NMESで効率的に筋収縮を得るための電極配置はどれか。","o":["腱付着部だけに置くと収縮を得やすい","骨突出部の直上に置くと収縮を得やすい","皮下脂肪が厚い所に置くと収縮を得やすい","運動点付近に置くと収縮を得やすい"],"a":3,"e":"正解は『運動点付近に置くと収縮を得やすい』である。運動点は比較的少ない電流強度で筋収縮を誘発しやすい部位であり、電極配置の目安となる。","t":""},{"n":388,"c":7,"s":"完全脱神経筋を直接刺激する場合のパルス条件として適切なのはどれか。","o":["短いパルス幅で高頻度刺激を用いる","長いパルス幅で低頻度刺激を用いる","短いパルス幅で感覚閾値だけを狙う","長い休止時間で刺激出力を停止する"],"a":1,"e":"正解は『長いパルス幅で低頻度刺激を用いる』である。完全脱神経筋では運動神経を介した短いパルスに反応しにくいため、筋線維を直接興奮させる長いパルス幅が必要となる。","t":""},{"n":389,"c":7,"s":"植込み型電子機器を使用する患者への電気刺激で必要な対応はどれか。","o":["刺激強度を上げてから適否を判断する","電極を十分に濡らして適否を判断する","機器と刺激部位を確認して適否を判断する","電極面積を広げてから適否を判断する"],"a":2,"e":"正解は『機器と刺激部位を確認して適否を判断する』である。植込み型電子機器との電磁干渉には機種や電流経路が関係するため、機器の指示書や医師の判断を確認する必要がある。","t":""},{"n":390,"c":7,"s":"感覚レベルで行う通常型TENSの刺激強度はどれか。","o":["感覚閾値を超え運動閾値未満に設定する","運動閾値を超え強い筋収縮まで設定する","痛覚閾値を超え耐えられる最大に設定する","感覚閾値未満で知覚しない強度に設定する"],"a":0,"e":"正解は『感覚閾値を超え運動閾値未満に設定する』である。通常型TENSでは、明確だが不快でない感覚が得られ、目に見える筋収縮を生じない強度を用いる。","t":""},{"n":391,"c":7,"s":"電荷平衡型の二相性波形がもつ特徴はどれか。","o":["一方向の電荷だけが組織に残りやすい","正負の電荷が相殺され偏りが少ない","刺激中の周波数が常にゼロになりやすい","筋収縮が電極位置と無関係になりやすい"],"a":1,"e":"正解は『正負の電荷が相殺され偏りが少ない』である。電荷平衡型の二相性波形では正相と負相の電荷が均衡し、皮膚に残る正味の電荷を抑えられる。","t":""},{"n":392,"c":7,"s":"NMESにおけるランプ時間の役割はどれか。","o":["刺激周波数を完全にゼロにする時間","電極面積を段階的に小さくする時間","刺激強度を徐々に増減させる時間","皮膚抵抗を瞬時に最大へ上げる時間"],"a":2,"e":"正解は『刺激強度を徐々に増減させる時間』である。ランプ時間を設定すると筋収縮の開始と終了が滑らかになり、急激な収縮による不快感を軽減できる。","t":""},{"n":393,"c":7,"s":"治療用超音波で結合剤を使用する主な目的はどれか。","o":["音響エネルギーを皮膚へ伝えやすくする","皮膚を乾燥させて摩擦抵抗を増加させる","超音波を空気中へ反射させやすくする","振動子を皮膚から離して出力を弱める"],"a":0,"e":"正解は『音響エネルギーを皮膚へ伝えやすくする』である。空気は超音波を反射しやすいため、ジェルなどで振動子と皮膚の間の空気を除いて音響エネルギーを伝達する。","t":""},{"n":394,"c":7,"s":"治療用超音波における3 MHzの特徴はどれか。","o":["1 MHzより深部まで到達しやすい","1 MHzより骨内だけに集中しやすい","1 MHzより空気中を伝わりやすい","1 MHzより浅部で吸収されやすい"],"a":3,"e":"正解は『1 MHzより浅部で吸収されやすい』である。3 MHzの超音波は1 MHzより組織内で速く吸収されるため、比較的浅い軟部組織の加温に用いられる。","t":""},{"n":395,"c":7,"s":"同じピーク強度で比較したパルス超音波の特徴はどれか。","o":["連続モードより平均出力が高くなる","連続モードより深部到達が増えやすい","連続モードより平均加熱を抑えやすい","連続モードより結合剤が不要になる"],"a":2,"e":"正解は『連続モードより平均加熱を抑えやすい』である。パルス超音波には出力の休止時間があるため、同じピーク強度の連続モードより時間平均強度が低くなる。","t":""},{"n":396,"c":7,"s":"下垂足に対して短下肢装具を使用する主な目的はどれか。","o":["立脚期の膝伸展を直接固定する","遊脚期の股関節屈曲を直接補助する","立脚期の体幹側屈を直接制御する","遊脚期の足部クリアランスを確保する"],"a":3,"e":"正解は『遊脚期の足部クリアランスを確保する』である。短下肢装具は足関節の過度な底屈を制御し、下垂足によるつまずきの軽減に役立つ。","t":""},{"n":397,"c":7,"s":"長下肢装具であるKAFOが主に支持する関節はどれか。","o":["足関節だけの運動を制御する","膝関節と足関節の運動を制御する","股関節だけの運動を制御する","体幹と頸部の運動を制御する"],"a":1,"e":"正解は『膝関節と足関節の運動を制御する』である。KAFOは大腿部から足部までを覆い、膝関節と足関節を含む下肢の支持やアライメント調整に用いる。","t":""},{"n":398,"c":7,"s":"装具による三点支持の原理を示す力の加え方はどれか。","o":["中央の力と反対向きの二つの力で制御する","中央の力と同じ向きの二つの力で制御する","一つの力だけを関節中心に加えて制御する","全周を同じ圧力で締め付け続けて制御する"],"a":0,"e":"正解は『中央の力と反対向きの二つの力で制御する』である。三点支持では一つの矯正力に対して、その両側へ反対方向の二つの対抗力を加えて関節や体節を制御する。","t":""},{"n":399,"c":7,"s":"テーピングを安全に実施するため、貼付前に行う対応はどれか。","o":["貼付前に皮膚状態と感覚を確認する","貼付前に皮膚を強くこすって発赤させる","貼付後の末梢循環の確認を省略する","貼付後にしびれが出ても圧迫を続ける"],"a":0,"e":"正解は『貼付前に皮膚状態と感覚を確認する』である。皮膚障害、感覚障害およびテープへの過敏反応の既往を確認し、貼付後も皮膚色や末梢循環を観察する。","t":""},{"n":400,"c":7,"s":"非伸縮性テープを足関節へ使用する主な目的はどれか。","o":["関節可動域を全方向へ拡大する","過度な関節運動を機械的に制限する","筋力を長期間にわたり恒久的に高める","骨折部を完全固定して骨癒合を促進する"],"a":1,"e":"正解は『過度な関節運動を機械的に制限する』である。非伸縮性テープは足関節捻挫などで問題となる方向の運動を制限し、関節の支持を補助する。","t":""},{"n":401,"c":8,"s":"後方アプローチによるTHA後に、脱臼リスクが高まる複合肢位はどれか。","o":["股関節の伸展・内転・外旋","股関節の屈曲・外転・外旋","股関節の屈曲・内転・内旋","股関節の伸展・外転・内旋"],"a":2,"e":"正解は『股関節の屈曲・内転・内旋』である。後方アプローチでは、この複合肢位が後方脱臼を招きやすい。予防肢位は進入法で異なるため、AAOSの解説のとおり個別指示を確認する。","t":""},{"n":402,"c":8,"s":"THA後の脱臼予防指導を設定する方法として適切なのはどれか。","o":["手術進入法と術者指示に合わせて設定する","年齢と性別だけに基づいて一律に設定する","疼痛の有無だけに基づいて毎日設定する","術後日数だけに基づいて全例同じに設定する"],"a":0,"e":"正解は『手術進入法と術者指示に合わせて設定する』である。脱臼しやすい方向や制限期間は、進入法、軟部組織修復、患者因子によって異なる。一律の肢位制限を全例へ適用する方法は適切でない。","t":""},{"n":403,"c":8,"s":"片側THA後にT字杖を使用する場合の基本的な操作はどれか。","o":["手術側の手で持ち、手術側下肢と同時に出す","手術側の手で持ち、非手術側下肢と同時に出す","非手術側の手で持ち、非手術側下肢と同時に出す","非手術側の手で持ち、手術側下肢と同時に出す"],"a":3,"e":"正解は『非手術側の手で持ち、手術側下肢と同時に出す』である。反対側で杖を使用すると、手術側股関節に必要な外転筋力と関節反力を軽減できる。杖と手術側下肢を同時に前へ出すのが基本である。","t":""},{"n":404,"c":8,"s":"THA後の荷重を進める際の判断として適切なのはどれか。","o":["疼痛がなければ固定法を問わず直ちに全荷重とする","固定法と骨質を踏まえた術者指示に従って進める","歩容が安定すれば画像所見を待たず直ちに全荷重とする","筋力が回復すれば創部状態を問わず全荷重とする"],"a":1,"e":"正解は『固定法と骨質を踏まえた術者指示に従って進める』である。荷重条件はセメント使用の有無、骨質、術中骨折、再置換などの影響を受ける。疼痛や歩容だけで荷重制限を変更してはならない。","t":""},{"n":405,"c":8,"s":"THA後に人工股関節の脱臼を疑う所見はどれか。","o":["突然の強い股関節痛と下肢変形が生じる","歩行後の軽い殿部疲労が休息で軽くなる","起床時の軽いこわばりが運動で軽くなる","創周囲の軽い感覚低下が徐々に軽くなる"],"a":0,"e":"正解は『突然の強い股関節痛と下肢変形が生じる』である。脱臼では急激な疼痛、下肢の短縮や回旋変形、荷重不能などが生じ得る。無理に整復や歩行を行わず、直ちに医学的評価へつなげる。","t":""},{"n":406,"c":8,"s":"THA後の運動中に肺血栓塞栓症を疑うべき所見はどれか。","o":["運動後に生じる大腿前面の軽い筋痛","朝に軽くなる手術側の限局した浮腫","突然の呼吸困難と胸痛を伴う頻脈","休息で軽くなる創周囲のつっぱり感"],"a":2,"e":"正解は『突然の呼吸困難と胸痛を伴う頻脈』である。肺血栓塞栓症では呼吸困難、胸痛、頻脈、酸素飽和度低下などが急に現れることがある。運動を中止し、緊急の医学的対応を求める。","t":""},{"n":407,"c":8,"s":"THA後に深部静脈血栓症を疑う下肢所見はどれか。","o":["両側足趾に同程度の冷感がみられる","片側下腿に急な腫脹と熱感がみられる","手術側殿部に運動後の疲労感がある","非手術側大腿に一時的な張りがある"],"a":1,"e":"正解は『片側下腿に急な腫脹と熱感がみられる』である。深部静脈血栓症では片側性の腫脹、熱感、疼痛などが手掛かりとなる。所見だけで確定せず、運動を中止して速やかに報告する。","t":""},{"n":408,"c":8,"s":"THA後早期の転倒予防として適切なのはどれか。","o":["自宅内では早期に歩行補助具を外して慣らす","階段では手すりを使わず手術側を鍛える","夜間は照明を減らして睡眠環境を優先する","移動能力に合う補助具と住環境調整を行う"],"a":3,"e":"正解は『移動能力に合う補助具と住環境調整を行う』である。転倒は脱臼や人工関節周囲骨折につながるため、歩行能力に応じた補助具を選択する。段差、敷物、夜間照明などの環境因子も確認する。","t":""},{"n":409,"c":8,"s":"THA後の長期的な身体活動として一般に適するのはどれか。","o":["繰り返す跳躍運動を中心に段階的に再開する","低衝撃の有酸素運動を中心に段階的に再開する","急な方向転換運動を中心に段階的に再開する","深いしゃがみ込み運動を中心に段階的に再開する"],"a":1,"e":"正解は『低衝撃の有酸素運動を中心に段階的に再開する』である。歩行、水中運動、自転車などは全身持久力を高めながら人工関節への衝撃を抑えやすい。高衝撃活動の可否は術者と個別に検討する。","t":""},{"n":410,"c":8,"s":"THA後に手術部位感染を疑う変化はどれか。","o":["運動直後だけ増える殿部筋の軽い疲労感","起床直後だけ生じる股関節周囲のこわばり","冷却直後だけ生じる創周囲皮膚の冷感","創部排液と発赤増悪を伴って続く発熱"],"a":3,"e":"正解は『創部排液と発赤増悪を伴って続く発熱』である。感染では排液、発赤、熱感、安静時痛、発熱などが増悪する。疑わしい場合は創部への処置や運動を独断で継続せず、速やかに報告する。","t":""},{"n":411,"c":8,"s":"合併症のない初回TKA後におけるCPMの使用として適切なのはどれか。","o":["合併症のない初回例ではルーチンに使用しない","膝伸展筋力増強のため全例に連続使用する","静脈血栓予防のため夜間も連続使用する","退院後の歩行改善のため長期間使用する"],"a":0,"e":"正解は『合併症のない初回例ではルーチンに使用しない』である。TKA理学療法管理ガイドラインでは、初回かつ合併症のないTKAへのCPMのルーチン使用は推奨されていない。関節運動は自動、自動介助、他動運動を患者の状態に応じて行う。","t":"【修正】「一律に使用しない」→「ルーチンに使用しない」（絶対禁忌ではない）。解説中のガイドライン名は原典が特定できない（参考：APTA CPG, Jette 2020）。"},{"n":412,"c":8,"s":"TKA後にNMESを使用する主な目的はどれか。","o":["皮膚感覚の低下だけを得る目的で用いる","膝関節の他動屈曲だけを得る目的で用いる","大腿四頭筋の筋力改善を得る目的で用いる","創部癒着の機械的剥離を得る目的で用いる"],"a":2,"e":"正解は『大腿四頭筋の筋力改善を得る目的で用いる』である。TKA後は関節腫脹や疼痛による大腿四頭筋の活動抑制が生じやすい。NMESは随意収縮と組み合わせ、筋力や歩行機能の改善に用いる。","t":""},{"n":413,"c":8,"s":"TKA後に膝屈曲拘縮の予防を目的として下肢を支持する方法はどれか。","o":["膝窩の真下へ枕を置き屈曲位を保つ","大腿の真下へ枕を置き屈曲位を保つ","足趾の真下へ枕を置き底屈位を保つ","踵の下へ支持を置き膝窩を浮かせる"],"a":3,"e":"正解は『踵の下へ支持を置き膝窩を浮かせる』である。踵を支持して膝窩を浮かせると、膝伸展方向の持続的な位置づけが可能になる。膝窩へ枕を入れ続けると屈曲拘縮を助長することがある。","t":""},{"n":414,"c":8,"s":"TKA後に寒冷療法を実施する方法として適切なのはどれか。","o":["冷却材を創部皮膚に直接当てて使用する","布を介し皮膚状態を確認して使用する","感覚低下部ほど長時間連続して使用する","末梢循環不良部ほど圧迫を強めて使用する"],"a":1,"e":"正解は『布を介し皮膚状態を確認して使用する』である。寒冷療法は術後早期の疼痛や腫脹の管理に利用できるが、凍傷や皮膚障害への注意が必要である。感覚障害や循環障害がある部位では特に慎重に適用する。","t":""},{"n":415,"c":8,"s":"TKA後の理学療法を開始する時期として推奨されるのはどれか。","o":["原則全抜糸後に開始し退院後に評価する","原則術後1週に開始し階段のみ評価する","原則24時間以内に開始し退院前に評価する","原則屈曲120度後に開始し歩行を評価する"],"a":2,"e":"正解は『原則24時間以内に開始し退院前に評価する』である。全身状態が安定していれば早期離床を進め、移乗、歩行、補助具使用などを退院前に確認する。開始時には循環動態、疼痛、創部、神経血管所見を評価する。","t":""},{"n":416,"c":8,"s":"TKA後の膝関節可動域運動として適切なのはどれか。","o":["他動・自動介助・自動運動を組み合わせて行う","他動運動だけで自動運動を長期間避けて行う","自動運動だけで他動運動を全面的に避けて行う","筋力運動だけで関節運動を長期間全面的に避ける"],"a":0,"e":"正解は『他動・自動介助・自動運動を組み合わせて行う』である。可動域運動は膝伸展と屈曲の回復を図り、移乗や歩行などの機能改善につなげる。疼痛、腫脹、創部反応に応じて運動量を調整する。","t":""},{"n":417,"c":8,"s":"TKA後早期に大腿四頭筋の収縮が低下する主な機序はどれか。","o":["腓腹筋の過活動による足関節拘縮","中殿筋の短縮による股関節拘縮","関節腫脹に伴う大腿四頭筋抑制","前脛骨筋の疲労による足趾拘縮"],"a":2,"e":"正解は『関節腫脹に伴う大腿四頭筋抑制』である。関節腫脹や疼痛は関節原性筋抑制を生じさせ、大腿四頭筋の随意収縮を低下させる。腫脹管理、筋収縮練習、NMESなどを組み合わせて対応する。","t":""},{"n":418,"c":8,"s":"TKA後の運動機能練習に含める内容として適切なのはどれか。","o":["歩行・バランス・動作対称性を含めて行う","膝屈曲角度の練習だけに限定して行う","大腿四頭筋の収縮だけに限定して行う","ベッド上の下肢挙上だけに限定して行う"],"a":0,"e":"正解は『歩行・バランス・動作対称性を含めて行う』である。TKA後は可動域や筋力だけでなく、歩行、バランス、移乗、動作の対称性も回復させる必要がある。機能課題は安全性と患者目標に合わせて進める。","t":""},{"n":419,"c":8,"s":"TKA後の筋力増強運動を進行する方法として適切なのはどれか。","o":["疼痛と腫脹に関係なく最大負荷から開始する","創治癒を待たず反動動作を中心に開始する","筋力評価を省略し一律負荷で開始する","生理反応と耐容性をみて高負荷へ進める"],"a":3,"e":"正解は『生理反応と耐容性をみて高負荷へ進める』である。筋力増強には十分な負荷が必要だが、疼痛、腫脹、疲労、動作品質を確認して漸増する。負荷後に症状が持続的に悪化する場合は運動量を調整する。","t":""},{"n":420,"c":8,"s":"TKA後の治療効果を評価する方法として適切なのはどれか。","o":["主観評価だけを用い歩行課題を省略する","患者報告尺度と実動作検査を併用する","画像評価だけを用い生活機能を省略する","関節角度だけを用い移動能力を省略する"],"a":1,"e":"正解は『患者報告尺度と実動作検査を併用する』である。疼痛や生活機能に関する患者報告尺度と、立ち上がりや歩行などの実動作検査は異なる側面を評価する。可動域や筋力も含めて経時的に記録する。","t":""},{"n":421,"c":8,"s":"骨接合術後に荷重を進めるための判断として適切なのはどれか。","o":["疼痛が消えれば画像確認前に全荷重へ進める","固定性・骨癒合所見・術者指示で進める","筋力が戻れば骨折型を問わず全荷重へ進める","創が閉じれば骨質を問わず全荷重へ進める"],"a":1,"e":"正解は『固定性・骨癒合所見・術者指示で進める』である。荷重時期は骨折型、固定性、骨質、軟部組織、画像上の癒合経過によって異なる。AO Surgery Referenceでも骨癒合確認後の段階的荷重が示されている。","t":""},{"n":422,"c":8,"s":"骨接合術で安定した固定を得る意義として適切なのはどれか。","o":["骨折部へ最大圧を加えることだけが主な目的となる","すべての外固定と経過観察を永久に省くことが主な目的となる","軟部組織を守り早期運動を促すことが主な目的となる","画像による経過確認を省くことだけが主な目的となる"],"a":2,"e":"正解は『軟部組織を守り早期運動を促すことが主な目的となる』である。十分な固定性は骨折部の安定を保ちながら、隣接関節の拘縮や筋萎縮を予防する運動を可能にする。ただし、安定固定は無制限な荷重を意味しない。","t":""},{"n":423,"c":8,"s":"下腿骨折の骨接合術後にコンパートメント症候群を疑う所見はどれか。","o":["疼痛の不釣り合いな増悪と他動伸張痛を認める","挙上で軽快する軽い浮腫と皮膚冷感を認める","運動後に限る筋疲労と軽い圧痛を認める","朝に軽快する関節こわばりと筋張りを認める"],"a":0,"e":"正解は『疼痛の不釣り合いな増悪と他動伸張痛を認める』である。コンパートメント症候群では強い疼痛や筋の他動伸張痛が早期から現れ、感覚・運動障害が進行することがある。末梢動脈の脈拍が触れても否定できず、緊急対応を要する。","t":""},{"n":424,"c":8,"s":"骨接合術後に患肢の神経血管状態を確認する方法はどれか。","o":["発汗量・体幹温度・食欲・睡眠を左右で比較する","呼吸数・胸郭運動・咳嗽・発声を左右で比較する","握力・肩可動域・頸部運動・姿勢を左右で比較する","皮膚色・温度・感覚・運動・脈を左右で比較する"],"a":3,"e":"正解は『皮膚色・温度・感覚・運動・脈を左右で比較する』である。骨折、腫脹、固定材料、包帯などによる神経障害や循環障害を早期に捉えるために確認する。急な変化や左右差は速やかに報告する。","t":""},{"n":425,"c":8,"s":"橈骨遠位端骨折の骨接合術後早期に行う運動として適切なのはどれか。","o":["手指・肘・肩を動かし浮腫と拘縮を予防する","手指・肘・肩を固定し骨萎縮だけを予防する","手指・肘・肩を冷却し筋力低下だけを予防する","手指・肘・肩を圧迫し知覚低下だけを予防する"],"a":0,"e":"正解は『手指・肘・肩を動かし浮腫と拘縮を予防する』である。手関節に運動制限があっても、許可された手指、肘、肩の運動は早期から行う。挙上や手指運動は浮腫管理にも役立つ。","t":""},{"n":426,"c":8,"s":"骨接合術後に手術部位感染を疑う変化はどれか。","o":["運動直後の筋疲労が休息で軽くなる","挙上後の末梢浮腫が時間とともに減る","創周囲の発赤が減って疼痛も軽くなる","創周囲の発赤が広がり排液が増加する"],"a":3,"e":"正解は『創周囲の発赤が広がり排液が増加する』である。感染では発赤、熱感、排液、疼痛、発熱などが増悪する。深部感染は骨癒合や固定材料へ影響するため、早期の医学的評価が必要である。","t":""},{"n":427,"c":8,"s":"骨接合術後に遷延癒合を疑う経過はどれか。","o":["骨折部痛が減り仮骨形成が進んでいる","骨折部痛が続き画像上の癒合が乏しい","荷重能力が増し画像上の癒合が進んでいる","腫脹が減り関節可動域が改善している"],"a":1,"e":"正解は『骨折部痛が続き画像上の癒合が乏しい』である。遷延癒合では期待される時期を過ぎても骨折部痛が続き、画像上の骨癒合進行が乏しい。独断で荷重を増やさず、術者と負荷条件を再検討する。","t":""},{"n":428,"c":8,"s":"骨接合術後の患肢浮腫を管理する方法として適切なのはどれか。","o":["患肢を下垂し強い圧迫を持続して行う","患肢を加温し感覚低下部へ直接当てて行う","患肢を挙上し末梢循環を確認しながら行う","患肢を固定し手指足趾の運動を避けて行う"],"a":2,"e":"正解は『患肢を挙上し末梢循環を確認しながら行う』である。挙上と許可された末梢関節運動は静脈・リンパ還流を促し、浮腫軽減に役立つ。圧迫を用いる場合も創部、感覚、循環状態を確認する。","t":""},{"n":429,"c":8,"s":"距骨骨折の骨接合術後に荷重を開始する考え方として適切なのはどれか。","o":["疼痛があれば画像所見に関係なく開始する","腫脹があれば骨癒合に関係なく開始する","骨癒合を確認し段階的な荷重として開始する","関節拘縮があれば術者指示を超えて早期に開始する"],"a":2,"e":"正解は『骨癒合を確認し段階的な荷重として開始する』である。距骨骨折では骨癒合に加えて無腐性壊死のリスクにも注意する。早期から足関節運動が許可されても、それは直ちに全荷重が許可されることを意味しない。","t":""},{"n":430,"c":8,"s":"骨接合に用いた内固定材料の抜去に関する考え方はどれか。","o":["症状がなくても全例で早期に抜去する","刺激症状などを踏まえ個別に検討する","骨癒合前でも可動域低下だけで抜去する","画像評価なしでも本人希望だけで抜去する"],"a":1,"e":"正解は『刺激症状などを踏まえ個別に検討する』である。内固定材料は全例で抜去するものではなく、軟部組織刺激、感染、年齢、部位などを考慮する。抜去時期には骨癒合の確認が必要である。","t":""},{"n":431,"c":8,"s":"腱板修復術後の早期理学療法で優先する目標はどれか。","o":["修復腱へ高負荷を加え最大筋力を得る","肩関節を反復挙上し筋持久力を得る","終末域を強制し左右同等の関節可動域を得る","修復部を保護し許可範囲の可動性を得る"],"a":3,"e":"正解は『修復部を保護し許可範囲の可動性を得る』である。早期は腱骨移行部の治癒を保護しながら、許可された範囲で拘縮を予防する。ASSET（American Society of Shoulder and Elbow Therapists）の腱板修復術後コンセンサス声明（2016）も段階的な可動域運動と筋力強化を基本としている。","t":"【表記修正】「共識」（中国語）を修正。"},{"n":432,"c":8,"s":"腱板修復術後の他動肩関節運動の特徴はどれか。","o":["他者や反対側上肢で動かし修復筋の収縮を抑える","修復筋を自力で収縮させて上肢を反復挙上する","外部抵抗を十分に加えて修復筋の筋力を高める","体幹反動を繰り返し使って肩を終末域へ押し込む"],"a":0,"e":"正解は『他者や反対側上肢で動かし修復筋の収縮を抑える』である。他動運動は修復した腱板筋の能動的収縮を抑えながら可動性を維持するために用いる。許可角度や開始時期は修復条件に従う。","t":""},{"n":433,"c":8,"s":"腱板修復術後の運動開始時期と負荷を決める要因はどれか。","o":["年齢・性別・利き手・職業だけを基準に決める","術後日数・体温・睡眠・食欲だけを基準に決める","疼痛・疲労・不安・希望だけを基準に決める","断裂範囲・組織質・固定法・術者指示で決める"],"a":3,"e":"正解は『断裂範囲・組織質・固定法・術者指示で決める』である。大断裂、組織質不良、再修復などでは、運動や負荷の進行を慎重にする場合がある。術後日数だけで一律に進める方法は修復条件を反映しない。","t":""},{"n":434,"c":8,"s":"腱板修復術後に外転枕付き装具を使用する目的はどれか。","o":["上腕骨頭を支持し修復腱への張力を抑える","肘関節を屈曲し上腕二頭筋を最大強化する","肩関節を内転し修復腱への張力を高める","前腕を回内し手関節伸筋を最大強化する"],"a":0,"e":"正解は『上腕骨頭を支持し修復腱への張力を抑える』である。肩を一定の外転位で支持すると、修復した腱板への過度な張力を軽減しやすい。装具の角度や装着期間は術式と術者指示に従う。","t":""},{"n":435,"c":8,"s":"腱板修復術後に肩運動が制限されている時期の運動として適切なのはどれか。","o":["肩の抵抗運動と反復挙上を早期から行う","肩の強制伸張と終末域運動を早期から行う","手指・手関節・肘の許可運動を早期から行う","肩の投球動作と懸垂運動を早期から行う"],"a":2,"e":"正解は『手指・手関節・肘の許可運動を早期から行う』である。肩を保護する時期にも、末梢関節の浮腫、拘縮、廃用を予防する必要がある。肘運動は併施術式による制限の有無を確認する。","t":""},{"n":436,"c":8,"s":"腱板修復術後に肩関節の抵抗運動を開始する方法はどれか。","o":["疼痛が消えた当日から最大抵抗で開始する","腱治癒と運動制御を確認して段階的に開始する","他動可動域開始と同時に高反復で開始する","装具装着中から終末域の最大抵抗運動を開始する"],"a":1,"e":"正解は『腱治癒と運動制御を確認して段階的に開始する』である。抵抗運動は修復腱へ負荷を加えるため、治癒段階と術者の許可を確認する。代償運動や運動後の症状をみながら負荷を漸増する。","t":""},{"n":437,"c":8,"s":"腱板修復術後の肩甲帯運動として適切なのはどれか。","o":["肩甲帯を完全固定して胸郭運動も避ける","修復部に過負荷をかけず肩甲帯を整える","上腕を強く牽引して肩甲骨を反復下制する","終末域挙上を強制して肩甲骨を反復固定する"],"a":1,"e":"正解は『修復部に過負荷をかけず肩甲帯を整える』である。肩甲骨の位置や運動制御は、その後の上肢挙上や腱板機能に関係する。上腕骨の能動運動を伴わない方法などを選び、修復部への負荷を管理する。","t":""},{"n":438,"c":8,"s":"腱板修復術後に再損傷を疑って報告すべき変化はどれか。","o":["運動後に軽い疲労が出て休息で戻る","手指に軽いこわばりが出て運動で戻る","装具周囲に軽い圧迫感が出て調整で戻る","肩の急な激痛と筋力低下が出て持続する"],"a":3,"e":"正解は『肩の急な激痛と筋力低下が出て持続する』である。外傷や過負荷後の急激な疼痛、挙上能力低下、筋力低下は修復部の障害を疑う所見となる。負荷を中止し、術者による評価へつなげる。","t":""},{"n":439,"c":8,"s":"腱板修復術に上腕二頭筋腱固定術が併施された場合に確認する制限はどれか。","o":["抵抗下の肘屈曲と前腕回外の開始を確認する","抵抗下の手関節伸展と前腕回内の開始を確認する","抵抗下の肩甲骨内転と胸郭伸展の開始を確認する","抵抗下の手指屈曲と母指対立の開始を確認する"],"a":0,"e":"正解は『抵抗下の肘屈曲と前腕回外の開始を確認する』である。肘屈曲と前腕回外では上腕二頭筋が強く活動し、腱固定部へ負荷が加わる。併施術式がある場合は腱板修復単独の手順だけで進めない。","t":""},{"n":440,"c":8,"s":"腱板修復術後の可動域練習における基本的な考え方はどれか。","o":["可動域低下があれば疼痛を無視して強制する","再断裂不安があればすべての肩運動を長期間中止する","修復保護と拘縮予防の両方を踏まえ調整する","左右差があれば高負荷伸張だけで急いで戻す"],"a":2,"e":"正解は『修復保護と拘縮予防の両方を踏まえ調整する』である。過度に強い伸張は修復部へ負荷を加える一方、必要以上の不動は拘縮を助長する。許可範囲、疼痛反応、修復条件を基に運動量を決める。","t":""},{"n":441,"c":8,"s":"ACL再建術後早期に重視する目標はどれか。","o":["完全伸展・腫脹管理・大腿四頭筋活動を重視する","深屈曲・高負荷跳躍・方向転換動作を重視する","最大走行・急停止・片脚着地動作を重視する","終末伸展抵抗・接触練習・競技復帰を重視する"],"a":0,"e":"正解は『完全伸展・腫脹管理・大腿四頭筋活動を重視する』である。早期の伸展制限、関節腫脹、大腿四頭筋抑制は歩行やその後の機能回復を妨げる。Aspetarガイドラインでも症状、可動域、筋機能に基づく段階的進行が重視されている。","t":""},{"n":442,"c":8,"s":"ACL再建術後早期の高負荷な開放性膝伸展運動で、特に慎重に扱う範囲はどれか。","o":["膝屈曲120度から90度の範囲を特に警戒する","膝屈曲90度から60度の範囲を特に警戒する","膝屈曲40度から0度の範囲を特に警戒する","膝屈曲60度から40度の範囲を特に警戒する"],"a":2,"e":"正解は『膝屈曲40度から0度の範囲を特に警戒する』である。開放性膝伸展運動の終末域では脛骨前方剪断力が増え、再建ACLへの張力が高まりやすい。開放性運動を全面禁止するのではなく、角度、抵抗、時期を調整する。","t":""},{"n":443,"c":8,"s":"ハムストリング腱を用いたACL再建術後に特に配慮する運動はどれか。","o":["膝伸展筋の採取部を守るため伸展抵抗を遅らせる","膝屈曲筋の採取部を守るため屈曲抵抗を調整する","足背屈筋の採取部を守るため背屈抵抗を遅らせる","股外転筋の採取部を守るため外転抵抗を遅らせる"],"a":1,"e":"正解は『膝屈曲筋の採取部を守るため屈曲抵抗を調整する』である。半腱様筋腱などを採取した場合、早期の強い膝屈曲抵抗は採取部へ負荷を加える。開始時期は術式と術者の手順に従う。","t":""},{"n":444,"c":8,"s":"孤立性の初回ACL再建術後における機能的膝装具の使用はどれか。","o":["移植腱の成熟促進を目的に機能装具を全例で用いる","筋力左右差の解消を目的に機能装具を全例で用いる","可動域の早期獲得を目的に機能装具を全例で用いる","孤立性初回再建では機能装具をルーチンに用いない"],"a":3,"e":"正解は『孤立性初回再建では機能装具をルーチンに用いない』である。機能的膝装具のルーチン使用による臨床的利益は確立していない。半月板修復などの併施術式や個別の不安定性がある場合は別に検討する。","t":"【修正】「一律に」→「ルーチンに」。"},{"n":445,"c":8,"s":"ACL再建術後にランニング開始を判断する方法として適切なのはどれか。","o":["術後週数だけが基準で腫脹や筋力は問わない","医師許可だけが基準で走行動作は評価しない","腫脹・可動域・筋力・走行準備性を評価する","本人希望だけが基準で片脚機能は評価しない"],"a":2,"e":"正解は『腫脹・可動域・筋力・走行準備性を評価する』である。ランニングは術後期間だけでなく、疼痛や腫脹、完全伸展、筋力、片脚制御などの基準に基づいて開始する。開始後も膝反応を確認して走行量を段階的に増やす。","t":""},{"n":446,"c":8,"s":"ACL再建術後の片脚ホップでLSIが90パーセントでも注意すべき点はどれか。","o":["移植腱が画像上で完全成熟したと判断できる可能性が高い","両脚の機能低下や着地不良が隠れる可能性がある","心理的準備性が十分に整った可能性が高い","膝関節の回旋安定性が正常な可能性が高い"],"a":1,"e":"正解は『両脚の機能低下や着地不良が隠れる可能性がある』である。LSIは非手術側も低下していると良好に見えることがあり、着地動作の質も表さない。絶対値、複数のホップ課題、筋力、動作観察を併用する。","t":""},{"n":447,"c":8,"s":"ACL再建術後の競技復帰を判断する方法として適切なのはどれか。","o":["疼痛・発熱・食欲・睡眠・術後月数だけで判断する","医師許可・本人希望・年齢・性別・競技歴で判断する","ホップ1種・歩数・体重・身長・利き脚で判断する","症状・可動域・安定性・筋力・心理面で判断する"],"a":3,"e":"正解は『症状・可動域・安定性・筋力・心理面で判断する』である。競技復帰には疼痛と腫脹の消失、十分な可動域、膝安定性、筋力、跳躍能力、動作品質、心理的準備性を確認する。単一検査や術後期間だけでは判断しない。","t":""},{"n":448,"c":8,"s":"ACL再建術後に膝伸展制限と終末域痛が持続する場合の対応はどれか。","o":["サイクロプス病変などを疑い術者へ情報共有する","大腿四頭筋強化だけを増やして長期間の観察を続ける","深屈曲ストレッチだけを増やして長期間の観察を続ける","走行練習量だけを増やして長期間の観察を続ける"],"a":0,"e":"正解は『サイクロプス病変などを疑い術者へ情報共有する』である。伸展終末域の機械的制限や疼痛が続く場合は、サイクロプス病変などの関節内要因を考慮する。強制的な運動を続けず、早期に術者と連携する。","t":""},{"n":449,"c":8,"s":"ACL再建術後の運動負荷に対する膝関節反応の扱いとして適切なのはどれか。","o":["運動後から翌日に腫脹が増せば負荷を調整する","運動後から翌日に腫脹が増しても同じ負荷を維持する","運動後から翌日に疼痛が増しても反復回数を増加する","運動後から翌日に跛行が増しても走行速度を増加する"],"a":0,"e":"正解は『運動後から翌日に腫脹が増せば負荷を調整する』である。翌日まで残る腫脹、疼痛、可動域低下は、関節が負荷へ十分に適応していない指標となる。運動量、強度、頻度を見直して反応を再評価する。","t":""},{"n":450,"c":8,"s":"ACL再建術後に方向転換練習を開始する方法として適切なのはどれか。","o":["予定日になれば筋力評価なしで開始する","片脚制御と筋力を確認し段階的に開始する","腫脹が残っていても方向転換から開始する","伸展制限があっても接触練習から開始する"],"a":1,"e":"正解は『片脚制御と筋力を確認し段階的に開始する』である。方向転換では減速、片脚支持、回旋制御が必要となるため、基礎筋力と動作品質を先に確認する。予測可能な低速課題から、速度や反応要素を段階的に加える。","t":""},{"n":451,"c":9,"s":"骨粗鬆症の概念として適切なのはどれか。","o":["関節軟骨の摩耗を特徴とし、関節痛が増大する骨格疾患","滑膜炎の持続を特徴とし、関節破壊が進行する骨格疾患","骨強度の低下を特徴とし、骨折リスクが増大する骨格疾患","骨格筋量の低下を特徴とし、身体機能が低下する筋疾患"],"a":2,"e":"正解は『骨強度の低下を特徴とし、骨折リスクが増大する骨格疾患』である。骨強度には骨密度と骨質が関与し、その低下によって軽微な外力でも骨折しやすくなる（骨粗鬆症財団）。","t":""},{"n":452,"c":9,"s":"脆弱性骨折の説明として適切なのはどれか。","o":["立位からの転倒程度の軽微な外力で生じる骨折","交通事故のような強い外力によって生じる骨折","スポーツの反復動作による疲労蓄積で生じる骨折","悪性腫瘍の骨転移による骨破壊によって生じる骨折"],"a":0,"e":"正解は『立位からの転倒程度の軽微な外力で生じる骨折』である。脆弱性骨折は、健常な骨では通常骨折しない程度の外力で発生し、骨強度低下を示す重要な所見である。","t":""},{"n":453,"c":9,"s":"原発性骨粗鬆症の診断で、骨密度値にかかわらず診断基準を満たす所見はどれか。","o":["橈骨遠位端の脆弱性骨折だけがある","脆弱性骨折がなくYAMが80%以上である","強い外傷による椎体骨折だけがある","大腿骨近位部の脆弱性骨折がある"],"a":3,"e":"正解は『大腿骨近位部の脆弱性骨折がある』である。低骨量を来す他疾患が除外され、大腿骨近位部または椎体の脆弱性骨折があれば、骨密度値によらず原発性骨粗鬆症の診断基準を満たす（日本骨代謝学会・日本骨粗鬆症学会「原発性骨粗鬆症の診断基準2012年度改訂版」）。","t":"【出典修正】診断基準の出典を学会合同基準に修正。"},{"n":454,"c":9,"s":"大腿骨近位部または椎体以外の脆弱性骨折がある場合、原発性骨粗鬆症の診断基準となる骨密度はどれか。","o":["YAMの90%未満","YAMの80%未満","YAMの70%未満","YAMの60%未満"],"a":1,"e":"正解は『YAMの80%未満』である。橈骨遠位端骨折など大腿骨近位部・椎体以外の脆弱性骨折がある場合は、骨密度がYAMの80%未満で診断基準を満たす（日本骨代謝学会・日本骨粗鬆症学会「原発性骨粗鬆症の診断基準2012年度改訂版」）。","t":"【出典修正】診断基準の出典を学会合同基準に修正。"},{"n":455,"c":9,"s":"脆弱性骨折がない場合、原発性骨粗鬆症の診断基準となるYAM値はどれか。","o":["YAMの60%以下","YAMの70%以下","YAMの80%以下","YAMの90%以下"],"a":1,"e":"正解は『YAMの70%以下』である。脆弱性骨折がない場合は、骨密度がYAMの70%以下または若年成人平均値から2.5標準偏差以下で診断基準を満たす（日本骨代謝学会・日本骨粗鬆症学会「原発性骨粗鬆症の診断基準2012年度改訂版」）。","t":"【出典修正】診断基準の出典を学会合同基準に修正。"},{"n":456,"c":9,"s":"DXAによる骨密度測定で、評価が推奨される部位の組合せはどれか。","o":["頭蓋骨と上腕骨近位部","胸椎と肋骨近位部","橈骨と踵骨後方部","腰椎と大腿骨近位部"],"a":3,"e":"正解は『腰椎と大腿骨近位部』である。骨粗鬆症性骨折が生じやすい腰椎と大腿骨近位部の両方をDXAで測定することが推奨される（骨粗鬆症財団）。","t":""},{"n":457,"c":9,"s":"高齢者で既存の椎体骨折を疑う手掛かりとして適切なのはどれか。","o":["身長低下と円背の進行","手指腫脹と朝のこわばり","動悸出現と下腿の浮腫","振戦出現と動作の緩慢"],"a":0,"e":"正解は『身長低下と円背の進行』である。椎体圧潰が重なると身長低下や脊柱後弯が生じ、明確な外傷や強い疼痛がなくても椎体骨折が存在することがある。","t":""},{"n":458,"c":9,"s":"骨粗鬆症高齢者の骨折予防を目的とする運動として適切なのはどれか。","o":["長期臥床と完全免荷の運動を組み合わせる","上肢体操と呼吸訓練の運動を組み合わせる","荷重動作と筋力・平衡練習を組み合わせる","全力跳躍と高速走行の運動を組み合わせる"],"a":2,"e":"正解は『荷重動作と筋力・平衡練習を組み合わせる』である。荷重刺激は骨の維持に役立ち、筋力・平衡練習は転倒リスクの低減に寄与するため、身体機能に応じて安全に実施する。","t":""},{"n":459,"c":9,"s":"小腸におけるカルシウム吸収を促進する栄養素はどれか。","o":["ビタミンD","ビタミンA","ビタミンC","ビタミンB12"],"a":0,"e":"正解は『ビタミンD』である。ビタミンDは小腸でのカルシウム吸収に関与し、骨の健康維持に重要である（骨粗鬆症財団）。","t":""},{"n":460,"c":9,"s":"続発性骨粗鬆症の危険因子として、特に確認すべき薬剤使用歴はどれか。","o":["経口抗菌薬を短期間継続して使用している","消化管運動薬を必要時継続して使用している","糖質コルチコイドを長期間使用している","外用保湿薬を毎日継続して使用している"],"a":2,"e":"正解は『糖質コルチコイドを長期間使用している』である。糖質コルチコイドの長期使用は骨形成低下などを通じて骨折リスクを高めるため、投与量や期間を確認する必要がある。","t":""},{"n":461,"c":9,"s":"ロコモティブシンドロームの説明として適切なのはどれか。","o":["血管機能の低下により循環障害の危険が高い状態","運動器の障害により移動機能が低下した状態","認知機能の低下により見当識障害の危険が高い状態","呼吸機能の低下により換気障害の危険が高い状態"],"a":1,"e":"正解は『運動器の障害により移動機能が低下した状態』である。骨、関節、筋肉、神経などの運動器の障害によって、立つ、歩くといった移動機能が低下した状態を指す（日本整形外科学会）。進行すると介護が必要になるリスクが高まる。","t":"【要修正】解説の引用文が選択肢と不一致で、旧定義（危険が高い状態）が混在していたため修正。"},{"n":462,"c":9,"s":"ロコモ度テストを構成する三つの評価はどれか。","o":["握力テスト、通常歩行テスト、下腿周囲長","片脚立位テスト、TUG、10m歩行テスト","骨密度テスト、脊椎画像、姿勢観察テスト","立ち上がりテスト、2ステップテスト、ロコモ25"],"a":3,"e":"正解は『立ち上がりテスト、2ステップテスト、ロコモ25』である。これらはそれぞれ下肢筋力、歩幅、身体状態・生活状況を評価する（日本整形外科学会）。","t":""},{"n":463,"c":9,"s":"2ステップ値の求め方として適切なのはどれか。","o":["通常10m歩行距離を身長で除して求める","片脚立位時間を年齢で除して求める","最大1歩幅を下肢長で除して求める","最大2歩幅を身長で除して求める"],"a":3,"e":"正解は『最大2歩幅を身長で除して求める』である。できる限り大きく踏み出した連続2歩の距離を身長で補正し、歩幅を中心とした移動機能を評価する。","t":""},{"n":464,"c":9,"s":"ロコモ度テストの立ち上がりテストが主に評価する機能はどれか。","o":["上肢の巧緻性","下肢の筋力","体幹の柔軟性","呼吸の持久力"],"a":1,"e":"正解は『下肢の筋力』である。高さの異なる台から片脚または両脚で立ち上がれるかを調べ、体重を支えて立ち上がる下肢筋力を評価する。","t":""},{"n":465,"c":9,"s":"ロコモ25で評価する内容として適切なのはどれか。","o":["過去1週間の食事摂取と体重変化","過去6か月の認知変化と睡眠状況","過去1か月の身体状態と生活状況","過去1年間の転倒回数と服薬状況"],"a":2,"e":"正解は『過去1か月の身体状態と生活状況』である。ロコモ25は痛み、移動、身の回りの動作、社会参加などを25項目で評価する質問票である（日本整形外科学会）。","t":""},{"n":466,"c":9,"s":"三つのロコモ度テストで異なる段階に該当した場合の判定方法はどれか。","o":["最も進行したロコモ度を全体判定とする","三つのロコモ度の平均を全体判定とする","最も軽いロコモ度を全体判定とする","ロコモ25だけの結果を全体判定とする"],"a":0,"e":"正解は『最も進行したロコモ度を全体判定とする』である。三つの評価のうち一つでも該当すれば、その中で移動機能低下が最も進行した段階を採用する（日本整形外科学会）。","t":""},{"n":467,"c":9,"s":"ロコモ度3の状態として適切なのはどれか。","o":["移動機能低下の兆候がまだみられない状態","移動機能低下が始まり運動習慣を要する状態","移動機能低下が進み社会参加に支障がある状態","移動機能低下が進み室内歩行が必ず不能な状態"],"a":2,"e":"正解は『移動機能低下が進み社会参加に支障がある状態』である。ロコモ度3では自立生活が困難となるリスクが非常に高く、運動器疾患に対する診療が必要な可能性もある（日本整形外科学会）。","t":""},{"n":468,"c":9,"s":"基本的なロコモーショントレーニングの組合せはどれか。","o":["腕立て伏せと上体起こし","深呼吸と頸部回旋運動","速歩運動と全力跳躍","片脚立ちとスクワット"],"a":3,"e":"正解は『片脚立ちとスクワット』である。片脚立ちはバランス能力、スクワットは下肢筋力を主に高める運動であり、安全確保と能力に応じた負荷調整が必要である。","t":""},{"n":469,"c":9,"s":"サルコペニアの説明として適切なのはどれか。","o":["骨格筋量が減少し筋力か身体機能も低下した状態","骨密度が減少し骨折危険性だけが上昇した状態","関節軟骨が摩耗し関節可動域だけが低下した状態","体脂肪量が増加し代謝指標だけが悪化した状態"],"a":0,"e":"正解は『骨格筋量が減少し筋力か身体機能も低下した状態』である。サルコペニアは骨格筋量の低下に加え、筋力または歩行などの身体機能の低下を伴う状態である（日本サルコペニア・フレイル学会）。","t":""},{"n":470,"c":9,"s":"二次性サルコペニアの分類として適切なのはどれか。","o":["加齢だけが明らかなものを二次性とする","疾患や低栄養が関与するものを二次性とする","筋量低下を伴わないものを二次性とする","若年者に発生したものを二次性とする"],"a":1,"e":"正解は『疾患や低栄養が関与するものを二次性とする』である。加齢以外に活動低下、臓器疾患、炎症、悪性腫瘍、低栄養などが関与する場合は二次性に分類される。","t":""},{"n":471,"c":9,"s":"AWGS2019における握力低下の基準はどれか。","o":["男性26kg未満、女性16kg未満","男性28kg未満、女性18kg未満","男性30kg未満、女性20kg未満","男性32kg未満、女性22kg未満"],"a":1,"e":"正解は『男性28kg未満、女性18kg未満』である。握力は筋力評価に用いられ、AWGS2019では男女別の基準値が設定されている（日本サルコペニア・フレイル学会）。","t":""},{"n":472,"c":9,"s":"AWGS2019で症例抽出に用いる下腿周囲長の基準はどれか。","o":["男性34cm未満、女性33cm未満","男性35cm未満、女性34cm未満","男性36cm未満、女性35cm未満","男性37cm未満、女性36cm未満"],"a":0,"e":"正解は『男性34cm未満、女性33cm未満』である。下腿周囲長は地域や診療所で利用できる簡便な症例抽出法であり、確定診断には筋量、筋力、身体機能の評価が必要となる。","t":""},{"n":473,"c":9,"s":"SARC-Fを構成する評価項目の組合せはどれか。","o":["食欲、体重減少、咀嚼、嚥下、便通","疼痛、腫脹、熱感、発赤、関節拘縮","記憶、見当識、注意、言語、計算","筋力、歩行補助、椅子立ち、階段、転倒"],"a":3,"e":"正解は『筋力、歩行補助、椅子立ち、階段、転倒』である。SARC-Fは五つの質問からなる簡便なサルコペニアのスクリーニング尺度である。","t":""},{"n":474,"c":9,"s":"AWGS2019で四肢骨格筋量の測定に用いる方法はどれか。","o":["単純X線による測定と心電図による測定","超音波による測定と肺活量による測定","DXAによる測定とBIAによる測定","血圧計による測定と体温計による測定"],"a":2,"e":"正解は『DXAによる測定とBIAによる測定』である。DXAとBIAは四肢骨格筋量の評価に用いられ、身長の2乗で補正した骨格筋量指数などによって判定する。","t":""},{"n":475,"c":9,"s":"AWGS2019でサルコペニアの確定診断に該当する組合せはどれか。","o":["筋量低下に筋力低下または身体機能低下を伴う","筋量正常に筋力低下または身体機能低下を伴う","筋量低下に体脂肪低下または骨密度低下を伴う","筋量正常に体脂肪増加または骨密度低下を伴う"],"a":0,"e":"正解は『筋量低下に筋力低下または身体機能低下を伴う』である。低筋量が必須であり、低筋力または低身体機能の少なくとも一方を伴う場合にサルコペニアと判定する。","t":""},{"n":476,"c":9,"s":"AWGS2019における重度サルコペニアの状態はどれか。","o":["筋量だけが低下し筋力と身体機能は保たれる状態","筋力だけが低下し筋量と身体機能は保たれる状態","身体機能だけが低下し筋量と筋力は保たれる状態","筋量と筋力が低下し身体機能も低下している状態"],"a":3,"e":"正解は『筋量と筋力が低下し身体機能も低下している状態』である。低筋量、低筋力、低身体機能の三要素をすべて認める場合に重度サルコペニアと判定する。","t":""},{"n":477,"c":9,"s":"AWGS2019の「サルコペニアの可能性あり」を用いる主な目的はどれか。","o":["骨密度測定が困難な地域で骨粗鬆症を確定する枠組み","筋量測定が困難な地域で早期介入につなげる枠組み","画像検査が困難な地域で重症度を確定する枠組み","体脂肪測定が困難な地域で低栄養を確定する枠組み"],"a":1,"e":"正解は『筋量測定が困難な地域で早期介入につなげる枠組み』である。地域や診療所で低筋力などを捉えて早期対策を開始し、必要に応じて設備のある施設で筋量を含む確定診断を行う（国立長寿医療研究センター）。","t":""},{"n":478,"c":9,"s":"AWGS2019で身体機能低下と判定する通常歩行速度はどれか。","o":["通常歩行速度が0.6m/秒未満","通常歩行速度が0.8m/秒未満","通常歩行速度が1.0m/秒未満","通常歩行速度が1.2m/秒未満"],"a":2,"e":"正解は『通常歩行速度が1.0m/秒未満』である。通常歩行速度は身体機能の評価指標であり、AWGS2019では1.0m/秒未満を低下と判定する（国立長寿医療研究センター）。","t":""},{"n":479,"c":9,"s":"サルコペニアへの基本的な介入として適切なのはどれか。","o":["関節固定と活動制限だけを組み合わせる","有酸素運動と水分制限だけを組み合わせる","筋力運動と適切な栄養摂取を組み合わせる","安静臥床とエネルギー制限を組み合わせる"],"a":2,"e":"正解は『筋力運動と適切な栄養摂取を組み合わせる』である。レジスタンス運動と十分なたんぱく質・エネルギー摂取を組み合わせ、筋力や筋量の維持・改善を図る（日本サルコペニア・フレイル学会）。","t":""},{"n":480,"c":9,"s":"高齢者の転倒発生に関する理解として適切なのはどれか。","o":["転倒は床面などの環境要因だけで生じる","転倒は身体要因と環境要因が重なって生じる","転倒は筋力などの身体要因だけで生じる","転倒は暦年齢という単一要因だけで生じる"],"a":1,"e":"正解は『転倒は身体要因と環境要因が重なって生じる』である。筋力、歩行、感覚、疾患、服薬などの内的要因と、段差、照明、床面などの外的要因が複合して発生する（国立長寿医療研究センター）。","t":""},{"n":481,"c":9,"s":"地域在住高齢者の転倒リスク評価で、初めに確認すべき情報はどれか。","o":["過去1年間の転倒歴を確認する","過去1年間の予防接種歴を確認する","過去1年間の旅行歴を確認する","過去1年間の歯科受診歴を確認する"],"a":0,"e":"正解は『過去1年間の転倒歴を確認する』である。転倒歴はその後の転倒を予測する重要な情報であり、回数、状況、受傷、前駆症状まで具体的に確認する。","t":""},{"n":482,"c":9,"s":"Timed Up and Go testが主に評価する機能はどれか。","o":["把持・操作・書字動作の巧緻性","吸気・呼気・咳嗽動作の呼吸性","骨量・骨質・骨折歴の骨脆弱性","起立・歩行・方向転換の機動性"],"a":3,"e":"正解は『起立・歩行・方向転換の機動性』である。椅子から立ち、歩行、方向転換、着座までを行うため、基本的移動能力や動的バランスを総合的に評価できる。","t":""},{"n":483,"c":9,"s":"在宅高齢者の転倒予防に適した住環境調整はどれか。","o":["夜間の動線を暗くして段差を残す","床面の小物を増やして通路を狭める","滑りやすい敷物を重ねて固定せず使う","動線の障害物を除いて照明を確保する"],"a":3,"e":"正解は『動線の障害物を除いて照明を確保する』である。床の小物や電気コード、固定されていない敷物を整理し、夜間のトイレ動線にも十分な照明を設ける。","t":""},{"n":484,"c":9,"s":"転倒予防の観点から推奨される履物はどれか。","o":["踵が固定され足に合う靴を選ぶ","踵が開放され緩い履物を選ぶ","靴底が滑りやすい履物を選ぶ","爪先が余る大きな靴を選ぶ"],"a":0,"e":"正解は『踵が固定され足に合う靴を選ぶ』である。足に適合し、踵が保持され、靴底に適度な摩擦がある履物は、つまずきや脱げによる転倒を防ぎやすい。","t":""},{"n":485,"c":9,"s":"服薬に関連する転倒リスクへの対応として適切なのはどれか。","o":["服薬数だけを数えて薬効や副作用は確認しない","本人判断で向精神薬をすべて直ちに中止する","眠気や血圧低下を招く薬を医師・薬剤師と見直す","転倒後も処方内容を確認せず同じ薬を継続する"],"a":2,"e":"正解は『眠気や血圧低下を招く薬を医師・薬剤師と見直す』である。向精神薬や降圧薬などは眠気、ふらつき、起立性低血圧に関与することがあり、自己中止せず処方者や薬剤師と調整する。","t":""},{"n":486,"c":9,"s":"起立性低血圧が転倒に関与しているかを評価する方法はどれか。","o":["座位一回の脈拍および発汗を確認する","臥位と立位の血圧および症状を確認する","運動直後の体温および食欲を確認する","就寝前の呼吸数および疼痛を確認する"],"a":1,"e":"正解は『臥位と立位の血圧および症状を確認する』である。体位変換前後の血圧変化と、めまい、眼前暗黒感、ふらつきなどの症状を併せて確認する。","t":""},{"n":487,"c":9,"s":"視覚機能低下がある高齢者への転倒予防支援として適切なのはどれか。","o":["眼鏡を外して歩くよう一律に勧める","視力と眼鏡の適合を確認し受診につなぐ","室内照明を減らして眩しさを避ける","視覚障害があっても環境調整を省く"],"a":1,"e":"正解は『視力と眼鏡の適合を確認し受診につなぐ』である。視力低下や不適切な眼鏡は障害物や段差の認識を妨げるため、眼科的評価と照明・コントラストの調整を行う。","t":""},{"n":488,"c":9,"s":"高齢者の転倒予防に有効な運動構成として適切なのはどれか。","o":["柔軟運動と呼吸運動だけを組み合わせる","上肢運動と巧緻運動だけを組み合わせる","平衡運動と筋力運動を組み合わせる","安静臥床と完全免荷だけを組み合わせる"],"a":2,"e":"正解は『平衡運動と筋力運動を組み合わせる』である。筋力、バランス、柔軟性などを含む多要素運動は、転倒と転倒関連骨折の予防に有効である（Cochraneレビュー Sherrington 2019 など）。","t":"【出典修正】"},{"n":489,"c":9,"s":"転倒リスクが高い在宅高齢者への多因子介入として適切なのはどれか。","o":["年齢だけで対象を選び同じ運動を提供する","転倒回数だけで判断し外出を一律に止める","住環境だけを確認し他の要因は評価しない","個別の危険因子を評価し介入内容を組み合わせる"],"a":3,"e":"正解は『個別の危険因子を評価し介入内容を組み合わせる』である。運動機能、疾患、服薬、視覚、足部、住環境などを評価し、本人に認められた危険因子に対応する介入を選択する（World Falls Guidelines 2022 など）。","t":"【出典修正】"},{"n":490,"c":9,"s":"フレイルの概念として適切なのはどれか。","o":["加齢で予備能力が低下しストレスから回復しにくい状態","運動器障害だけが進行し日常生活が完全に不能な状態","骨格筋量だけが低下し診断が必ず確定している状態","基礎疾患がない高齢者には決して生じることがない状態"],"a":0,"e":"正解は『加齢で予備能力が低下しストレスから回復しにくい状態』である。フレイルは要介護状態に至る前段階として位置付けられ、適切な介入により改善する可能性がある（日本サルコペニア・フレイル学会）。","t":""},{"n":491,"c":9,"s":"改訂J-CHS基準を構成する五つの項目はどれか。","o":["体重減少、疲労感、筋力低下、歩行速度低下、活動低下","食欲低下、嚥下障害、口渇、便秘、腹部膨満","疼痛増加、関節腫脹、熱感、発赤、可動域低下","記憶低下、見当識低下、注意低下、失語、失行"],"a":0,"e":"正解は『体重減少、疲労感、筋力低下、歩行速度低下、活動低下』である。改訂J-CHS基準は身体的フレイルの表現型をこの五項目で評価する（Satake & Arai 2020、国立長寿医療研究センター）。","t":"【出典修正】"},{"n":492,"c":9,"s":"改訂J-CHS基準によるフレイルの判定方法はどれか。","o":["2項目以上をフレイル、1項目をプレフレイルとする","3項目以上をフレイル、1から2項目をプレフレイルとする","4項目以上をフレイル、2から3項目をプレフレイルとする","5項目以上をフレイル、3から4項目をプレフレイルとする"],"a":1,"e":"正解は『3項目以上をフレイル、1から2項目をプレフレイルとする』である。五項目のいずれにも該当しない場合は健常と判定し、該当数に応じて段階を区分する。","t":""},{"n":493,"c":9,"s":"フレイルを包括的に捉える際に評価する側面はどれか。","o":["骨密度、骨代謝、骨折歴の側面だけを含む","筋力、歩幅、関節可動域の側面だけを含む","身体的、精神・心理的、社会的側面を含む","血圧、脈拍、体温の生理的側面だけを含む"],"a":2,"e":"正解は『身体的、精神・心理的、社会的側面を含む』である。フレイルは身体機能だけでなく、認知・抑うつ、孤立、経済状況、社会参加などを含む多面的な概念である。","t":""},{"n":494,"c":9,"s":"基本チェックリストの説明として適切なのはどれか。","o":["5項目からなる骨折危険度の評価票","10項目からなる疼痛強度の評価票","15項目からなる認知機能だけの評価票","25項目からなる生活機能全般の質問票"],"a":3,"e":"正解は『25項目からなる生活機能全般の質問票』である。基本チェックリストは生活機能、運動、栄養、口腔、閉じこもり、認知、抑うつなどを幅広く確認する。","t":""},{"n":495,"c":9,"s":"高齢者総合機能評価の考え方として適切なのはどれか。","o":["画像・検査・処方内容だけをまとめて評価する","筋力・歩行・関節可動域だけをまとめて評価する","家族・支援者・担当者の希望だけをまとめて評価する","身体・心理・社会・生活機能をまとめて評価する"],"a":3,"e":"正解は『身体・心理・社会・生活機能をまとめて評価する』である。疾患や身体機能だけでなく、認知、気分、栄養、服薬、生活環境、支援体制を評価し、個別の支援計画に反映する。","t":""},{"n":496,"c":9,"s":"地域ケア会議の機能として適切なのはどれか。","o":["保険請求を審査して給付額だけを決定する","単一事業所の収支と勤務体制だけを検討する","個別事例を多職種で検討し地域課題にもつなげる","医師だけで治療内容と退院日だけを決定する"],"a":2,"e":"正解は『個別事例を多職種で検討し地域課題にもつなげる』である。個別課題の解決、自立支援型ケアマネジメントの支援、地域に共通する課題の把握や社会資源の開発につなげる役割がある。","t":""},{"n":497,"c":9,"s":"地域包括支援センターの主な業務として適切なのはどれか。","o":["救急搬送、入院判定、手術適応の決定","総合相談、権利擁護、介護予防の支援","障害認定、年金裁定、税額決定の代行","薬剤承認、医療監査、診療報酬の審査"],"a":1,"e":"正解は『総合相談、権利擁護、介護予防の支援』である。地域包括支援センターは高齢者を包括的に支援する地域の中核機関であり、包括的・継続的ケアマネジメント支援も担う（厚生労働省）。","t":""},{"n":498,"c":9,"s":"フレイル高齢者に対する多職種連携の進め方として適切なのはどれか。","o":["本人の生活目標を共有し各職種が専門性を生かす","職種ごとに別の目標を立て情報共有を行わない","身体機能だけを目標とし本人の希望を確認しない","支援内容を家族だけで決め本人への説明を省く"],"a":0,"e":"正解は『本人の生活目標を共有し各職種が専門性を生かす』である。本人が望む生活や社会参加を共通目標とし、医療、介護、栄養、薬剤、リハビリテーションなどの役割を調整する。","t":""},{"n":499,"c":9,"s":"訪問理学療法で在宅生活を評価する際に重視すべき内容はどれか。","o":["実際の生活動線と介護者の支援状況を確認する","診察室での歩行速度だけで生活能力を判断する","筋力測定の数値だけで住宅改修を決定する","本人の動作を見ず家屋図面だけで支援を決定する"],"a":0,"e":"正解は『実際の生活動線と介護者の支援状況を確認する』である。玄関、寝室、トイレ、浴室などで実際の動作を観察し、環境、福祉用具、介助方法、本人と家族の希望を統合して支援する。","t":""},{"n":500,"c":9,"s":"高齢者が病院から在宅へ移行する際の連携として適切なのはどれか。","o":["退院時の検査値だけを在宅担当者へ伝達する","動作能力、危険因子、目標、支援方法を共有する","入院前の生活状況を確認せず訓練結果だけを伝える","退院後の変化を確認せず病院の計画だけを継続する"],"a":1,"e":"正解は『動作能力、危険因子、目標、支援方法を共有する』である。転倒・再骨折リスク、移動やセルフケアの方法、福祉用具、服薬、栄養、本人の目標を関係者間で共有し、退院後も継続的に見直す。","t":""}]</script>
<script>
(function(){
const Q=JSON.parse(document.getElementById('qdata').textContent);
const CH=["運動器の解剖と運動学の基礎","骨・軟骨・靭帯・腱の損傷と組織治癒","関節疾患の病態と理学療法","脊椎疾患の病態と理学療法","骨折・外傷とその理学療法","スポーツ外傷・障害と競技復帰","運動器の理学療法評価","運動療法・物理療法・装具療法","術後理学療法の実際","高齢者運動器疾患と地域連携"];
const KANA=["ア","イ","ウ","エ"];
const byN={};Q.forEach(q=>byN[q.n]=q);
const KEY="pt-msk500-v1";
let S={rec:{},star:{},set:{shuffle:true,instant:true}};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S.rec=o.rec||{};S.star=o.star||{};S.set=Object.assign(S.set,o.set||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();
const $=id=>document.getElementById(id);
const app=$('app'),bar=$('bar'),barIn=$('barIn'),homeBtn=$('homeBtn');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1600);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// rec[n] = {c: correct count, w: wrong count, last: 1|0}
function stats(list){let done=0,ok=0;list.forEach(q=>{const r=S.rec[q.n];if(r){done++;if(r.last)ok++;}});return{done,ok,total:list.length};}
const wrongList=()=>Q.filter(q=>S.rec[q.n]&&!S.rec[q.n].last);
const starList=()=>Q.filter(q=>S.star[q.n]);
const noteList=()=>Q.filter(q=>q.t);
const unseen=()=>Q.filter(q=>!S.rec[q.n]);

let run=null; // {items:[n], i, ans:{n:{pick,correct}}, order:{n:[idx]}, title, exam}

function home(){
  run=null;bar.hidden=true;homeBtn.hidden=true;window.scrollTo(0,0);
  const st=stats(Q);const rate=st.done?Math.round(st.ok/st.done*100):0;
  const w=wrongList().length,s=starList().length,u=unseen().length;
  let h=`<div class="summary">
    <div><b>${st.done}<span class="num" style="font-size:13px">/500</span></b><span>解答済み</span></div>
    <div><b>${rate}%</b><span>直近正答率</span></div>
    <div><b>${w}</b><span>要復習</span></div>
    <div class="bar"><i style="width:${st.done/5}%"></i></div></div>
  <h2>学習モード</h2><div class="modes">
    <button class="mode primary" type="button" data-m="rand10"><strong>ランダム10問</strong><span>全範囲からすき間時間に</span></button>
    <button class="mode" type="button" data-m="unseen" ${u?'':'disabled'}><strong>未解答から20問</strong><span>残り ${u}問</span></button>
    <button class="mode" type="button" data-m="wrong" ${w?'':'disabled'}><strong>間違えた問題</strong><span>${w}問・正解するまで残ります</span></button>
    <button class="mode" type="button" data-m="star" ${s?'':'disabled'}><strong>ブックマーク</strong><span>${s}問</span></button>
    <button class="mode" type="button" data-m="exam"><strong>模擬試験 50問</strong><span>全章から5問ずつ・最後に採点</span></button>
    <button class="mode" type="button" data-m="notes"><strong>修正・補足した問題</strong><span>${noteList().length}問・原本との差分を確認</span></button>
  </div>
  <h2>章別に解く（各50問）</h2><ul class="chapters">`;
  CH.forEach((c,i)=>{const l=Q.filter(q=>q.c===i);const t=stats(l);
    h+=`<li><button type="button" data-ch="${i}"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="nm">${esc(c)}<span class="mini"><i style="width:${t.done*2}%"></i></span></span><span class="st num">${t.done}/50<br>${t.done?Math.round(t.ok/t.done*100)+'%':'—'}</span></button></li>`;});
  h+=`</ul><h2>設定</h2><div class="settings">
    <div class="row"><label for="setShuffle">選択肢の順番を入れ替える<small>原本は章1・章7で正解がア→イ→ウ→エの順に並ぶため、オン推奨</small></label><input type="checkbox" id="setShuffle" ${S.set.shuffle?'checked':''}></div>
    <div class="row"><label for="chOrder">章別の出題順</label><select id="chOrder"><option value="seq">問題番号順</option><option value="rand">ランダム</option></select></div>
    <div class="row"><label for="jumpN">問題番号で開く<small>1〜500</small></label><div class="jump"><input type="number" id="jumpN" min="1" max="500" inputmode="numeric" placeholder="例 254"><button class="iconbtn" id="jumpGo" type="button">開く</button></div></div>
    <div class="row"><label>学習記録を消去<small>この端末のブラウザに保存された記録です</small></label><button class="iconbtn danger" id="resetBtn" type="button">消去</button></div>
    <div id="resetArea"></div>
  </div>
  <p class="fine">原本「500問 認定理学療法士_運動器 完全対策問題集（2026年度版・非公式）」を全問精査し、正解の誤りは確認されませんでした。不正確な表現・旧名称・出典の誤りなど34問を修正または補足しています（「修正・補足した問題」で一覧できます）。学習記録はこの端末のブラウザにのみ保存されます。</p>`;
  app.innerHTML=h;
  try{$('chOrder').value=S.set.chOrder||'seq';}catch(e){}
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ch;let l=Q.filter(q=>q.c===i).map(q=>q.n);if(S.set.chOrder==='rand')l=shuffle(l);start(l,CH[i]);});
  $('setShuffle').onchange=e=>{S.set.shuffle=e.target.checked;save();};
  $('chOrder').onchange=e=>{S.set.chOrder=e.target.value;save();};
  $('jumpGo').onclick=()=>{const n=parseInt($('jumpN').value,10);if(byN[n])start([n],'問'+n);else toast('1〜500の番号を入力してください');};
  $('resetBtn').onclick=()=>{$('resetArea').innerHTML=`<div class="confirm">全ての解答記録とブックマークを消去しますか？<button class="iconbtn danger" id="resetYes" type="button">消去する</button><button class="iconbtn" id="resetNo" type="button">やめる</button></div>`;
    $('resetYes').onclick=()=>{S.rec={};S.star={};save();home();toast('記録を消去しました');};$('resetNo').onclick=()=>$('resetArea').innerHTML='';};
}
function startMode(m){
  if(m==='rand10')start(shuffle(Q).slice(0,10).map(q=>q.n),'ランダム10問');
  if(m==='unseen')start(shuffle(unseen()).slice(0,20).map(q=>q.n),'未解答から20問');
  if(m==='wrong')start(shuffle(wrongList()).map(q=>q.n),'間違えた問題');
  if(m==='star')start(starList().map(q=>q.n),'ブックマーク');
  if(m==='notes')start(noteList().map(q=>q.n),'修正・補足した問題');
  if(m==='exam'){let l=[];for(let i=0;i<10;i++)l=l.concat(shuffle(Q.filter(q=>q.c===i)).slice(0,5).map(q=>q.n));start(shuffle(l),'模擬試験 50問',true);}
}
function start(items,title,exam){
  if(!items.length){toast('対象の問題がありません');return;}
  const order={};items.forEach(n=>order[n]=S.set.shuffle?shuffle([0,1,2,3]):[0,1,2,3]);
  run={items,i:0,ans:{},order,title,exam:!!exam};homeBtn.hidden=false;show();
}
function record(n,correct){const r=S.rec[n]||{c:0,w:0};if(correct)r.c++;else r.w++;r.last=correct?1:0;S.rec[n]=r;save();}
function show(){
  const n=run.items[run.i],q=byN[n],a=run.ans[n],ord=run.order[n];
  const answered=!!a,reveal=answered&&(!run.exam||run.done);
  window.scrollTo(0,0);
  let h=`<div class="qhead"><span class="pill num">問${n}</span><span class="ch">${esc(CH[q.c])}</span><span class="num">${run.i+1}/${run.items.length}</span></div>
  <div class="progress"><i style="width:${(run.i+1)/run.items.length*100}%"></i></div>
  <p class="stem">${esc(q.s)}</p><div class="opts" role="group" aria-label="選択肢">`;
  ord.forEach((oi,pos)=>{let cls='';
    if(reveal){if(oi===q.a)cls='ok';else if(a.pick===oi)cls='ng';}
    else if(answered&&a.pick===oi)cls='sel';
    h+=`<button class="opt ${cls}" type="button" data-oi="${oi}" ${reveal?'disabled':''}><span class="k">${KANA[pos]}</span><span>${esc(q.o[oi])}</span></button>`;});
  h+=`</div>`;
  if(reveal){const ok=a.pick===q.a;const cpos=ord.indexOf(q.a);
    h+=`<div class="verdict ${ok?'ok':'ng'}" role="status">${ok?'○ 正解':'× 不正解'}<span style="font-weight:400;color:var(--muted);font-size:14px">正解は ${KANA[cpos]}</span></div>
    <div class="exp">${esc(q.e)}</div>`;
    if(q.t)h+=`<div class="note"><b>検証メモ</b>　${esc(q.t)}</div>`;}
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.oi));
  const last=run.i===run.items.length-1;
  let nextLabel=last?(run.exam&&!run.done?'採点する':'結果を見る'):'次へ';
  barIn.innerHTML=`<button class="btn" id="prev" type="button" ${run.i?'':'disabled'}>前へ</button>
  <button class="btn star" id="star" type="button" aria-pressed="${S.star[n]?'true':'false'}">${S.star[n]?'★ 保存済':'☆ 保存'}</button>
  <button class="btn main" id="next" type="button" ${answered||run.exam?'':'disabled'}>${nextLabel}</button>`;
  bar.hidden=false;
  $('prev').onclick=()=>{run.i--;show();};
  $('star').onclick=()=>{if(S.star[n])delete S.star[n];else S.star[n]=1;save();show();toast(S.star[n]?'ブックマークしました':'ブックマークを外しました');};
  $('next').onclick=()=>{if(!last){run.i++;show();}else if(run.exam&&!run.done){finishExam();}else result();};
}
function pick(oi){
  const n=run.items[run.i],q=byN[n];
  if(run.exam&&!run.done){run.ans[n]={pick:oi};show();return;}
  if(run.ans[n])return;
  run.ans[n]={pick:oi};record(n,oi===q.a);show();
}
function finishExam(){
  run.items.forEach(n=>{const a=run.ans[n];if(a)record(n,a.pick===byN[n].a);});
  run.done=true;result();
}
function result(){
  bar.hidden=true;window.scrollTo(0,0);
  const tot=run.items.length;let ok=0,ans=0;
  run.items.forEach(n=>{const a=run.ans[n];if(a){ans++;if(a.pick===byN[n].a)ok++;}});
  let h=`<div class="score"><b>${ok}<span style="font-size:24px">/${tot}</span></b><span>${esc(run.title)}　正答率 ${tot?Math.round(ok/tot*100):0}%${ans<tot?`（未解答 ${tot-ans}問）`:''}</span></div>`;
  // chapter breakdown for exam
  if(run.exam){h+=`<h2>章別の正答数</h2><ul class="list">`;
    CH.forEach((c,i)=>{const l=run.items.filter(n=>byN[n].c===i);const k=l.filter(n=>run.ans[n]&&run.ans[n].pick===byN[n].a).length;
      h+=`<li><button type="button" disabled style="cursor:default"><span class="m num">${i+1}</span><span class="num">${k}/${l.length}</span><span class="t">${esc(c)}</span></button></li>`;});
    h+=`</ul>`;}
  h+=`<h2>問題ごとの結果（タップで解説）</h2><ul class="list">`;
  run.items.forEach((n,idx)=>{const a=run.ans[n];const k=a?(a.pick===byN[n].a?'ok':'ng'):'';
    h+=`<li><button type="button" data-idx="${idx}"><span class="m ${k}">${a?(k==='ok'?'○':'×'):'–'}</span><span class="num">問${n}</span><span class="t">${esc(byN[n].s)}</span></button></li>`;});
  h+=`</ul><div class="modes" style="margin-top:16px;grid-template-columns:1fr 1fr">
    <button class="mode primary" type="button" id="again"><strong>もう一度</strong><span>同じ問題を解き直す</span></button>
    <button class="mode" type="button" id="backHome"><strong>ホームへ</strong><span>記録は保存済み</span></button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{run.i=+b.dataset.idx;run.done=true;run.exam=run.exam;show();});
  $('again').onclick=()=>start(run.items.slice(),run.title,run.exam);
  $('backHome').onclick=home;
}
homeBtn.onclick=home;
home();
})();
</script>

</body></html>
