<style>
/* Layout: single-column phone-first study tool; sticky top bar, tappable answer slabs, fixed bottom action bar during drills */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#17302c; --muted:#5d716d; --line:#d5e0dd;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --ok:#1d7a46; --ok-soft:#e1f3e8; --ng:#b23a2e; --ng-soft:#fbe6e3; --note:#8a5a00; --note-soft:#fff3d6;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --ink:#e3efec; --muted:#93aaa5; --line:#2a3a37;
  --accent:#4cc3a8; --accent-ink:#06201b; --accent-soft:#163631;
  --ok:#5fd08f; --ok-soft:#15301f; --ng:#ff8a7c; --ng-soft:#3a1d1a; --note:#f2c45a; --note-soft:#332a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e3efec; --muted:#93aaa5; --line:#2a3a37;
  --accent:#4cc3a8; --accent-ink:#06201b; --accent-soft:#163631;
  --ok:#5fd08f; --ok-soft:#15301f; --ng:#ff8a7c; --ng-soft:#3a1d1a; --note:#f2c45a; --note-soft:#332a12; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.iconbtn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h2{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-block:24px 10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* home */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.summary div{min-width:0}
.summary b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.2}
.summary span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.mode strong{font-size:15px}
.mode span{font-size:12px;color:var(--muted);line-height:1.5}
.mode.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.primary span{color:inherit;opacity:.85}
.mode:disabled{opacity:.45;cursor:default}
.chapters{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chapters li+li{border-top:1px solid var(--line)}
.chapters button{width:100%;background:none;border:0;text-align:left;padding:12px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.chapters .no{font-family:var(--f-num);color:var(--accent);font-size:14px}
.chapters .nm{min-width:0;font-size:15px;line-height:1.45}
.chapters .st{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.chapters .mini{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.chapters .mini i{display:block;height:100%;background:var(--accent)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;min-height:48px}
.row+.row{border-top:1px solid var(--line)}
.row label{flex:1;min-width:0;font-size:15px}
.row small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
select,input[type=number]{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:38px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.jump{display:flex;gap:8px}
.jump input{width:96px}
.fine{font-size:12px;color:var(--muted);line-height:1.6;margin-top:24px}
.danger{color:var(--ng);border-color:var(--ng)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.qhead .pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:700;white-space:nowrap}
.qhead .ch{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stem{font-size:18px;font-weight:700;line-height:1.65;margin-block:16px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;min-height:56px;font-size:16px;line-height:1.6}
.opt .k{font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px}
.opt span:last-child{min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng .k{background:var(--ng);color:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default;color:inherit}
.verdict{font-weight:700;font-size:17px;margin-top:18px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;font-size:15px;line-height:1.8}
.note{background:var(--note-soft);color:var(--ink);border-left:4px solid var(--note);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7}
.note b{color:var(--note)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px}
.btn{flex:1;min-height:50px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}
.btn:disabled{opacity:.4;cursor:default}
.btn.star[aria-pressed="true"]{background:var(--note-soft);border-color:var(--note);color:var(--note)}
/* result */
.score{text-align:center;padding-block:28px 12px}
.score b{font-family:var(--f-num);font-size:56px;line-height:1;display:block}
.score span{color:var(--muted)}
.list{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list button{width:100%;text-align:left;background:none;border:0;padding:11px 14px;display:grid;grid-template-columns:20px 58px 1fr;gap:8px;font-size:14px;line-height:1.5}
.list .m{font-weight:700}
.list .m.ok{color:var(--ok)} .list .m.ng{color:var(--ng)}
.list .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20}
.confirm{background:var(--ng-soft);border:1px solid var(--ng);border-radius:var(--r);padding:12px;margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:560px){.modes{grid-template-columns:repeat(3,1fr)}}
</style>

<script type="application/json" id="qdata">[{"n":1,"c":0,"s":"成人の皮質骨で、中心管を同心円状の骨層板が囲む基本構造はどれか。","o":["骨単位を形成する同心円状の構造","骨梁を形成する網目状の構造","骨端線を形成する板状の構造","関節円板を形成する線維性の構造"],"a":0,"e":"正解は『骨単位を形成する同心円状の構造』である。骨単位はオステオンとも呼ばれ、中心管とその周囲を囲む同心円状の骨層板から構成される。","t":""},{"n":2,"c":0,"s":"海綿骨の骨梁にみられる一般的な配列の特徴はどれか。","o":["長軸と無関係に一定方向へ配列する","主な荷重方向に沿うように配列する","骨髄腔を閉鎖するよう密に配列する","関節面に平行となるよう一様に配列する"],"a":1,"e":"正解は『主な荷重方向に沿うように配列する』である。骨梁は力学的負荷に適応して配列され、比較的少ない骨量で荷重を効率よく支持する。","t":""},{"n":3,"c":0,"s":"骨形成を直接担い、骨基質を産生する細胞はどれか。","o":["破骨細胞が骨基質を産生する","骨細胞が骨基質を吸収する","骨芽細胞が骨基質を産生する","軟骨細胞が骨基質を吸収する"],"a":2,"e":"正解は『骨芽細胞が骨基質を産生する』である。骨芽細胞は類骨を分泌して石灰化を促し、破骨細胞は骨吸収を担う。","t":""},{"n":4,"c":0,"s":"骨膜の構造と機能に関する説明で適切なのはどれか。","o":["関節軟骨面を覆い、知覚神経をほぼ欠く","骨髄腔面を覆い、造血細胞を多く含む","骨端軟骨を覆い、軟骨細胞を多く含む","骨外表面を覆い、知覚神経を多く含む"],"a":3,"e":"正解は『骨外表面を覆い、知覚神経を多く含む』である。骨膜は関節軟骨で覆われる部分を除く骨外表面に存在し、血管と知覚神経に富む。","t":""},{"n":5,"c":0,"s":"長骨の骨端軟骨は成長終了後にどのような構造となるか。","o":["骨端線として骨内に残る","関節裂隙として骨外に残る","骨膜線維として腱内に残る","骨単位として髄腔内に残る"],"a":0,"e":"正解は『骨端線として骨内に残る』である。骨端軟骨は長軸方向の成長に関与し、成長終了後には骨化して骨端線となる。","t":""},{"n":6,"c":0,"s":"膝蓋骨が膝関節伸展機構にもたらす主な力学的効果はどれか。","o":["膝関節液を産生して軟骨を潤滑する","伸展機構の作用線を前方へ移動する","膝関節包を緊張させて屈曲を制限する","脛骨粗面を近位へ移動して荷重を減らす"],"a":1,"e":"正解は『伸展機構の作用線を前方へ移動する』である。膝蓋骨は大腿四頭筋の作用線を膝関節軸から離し、膝伸展のモーメントアームを増大させる。","t":""},{"n":7,"c":0,"s":"ウォルフの法則が示す骨の性質はどれか。","o":["神経刺激に応じて骨長が即時に変化する","関節運動に応じて骨髄量だけが変化する","長期荷重に応じて骨形態が変化する","筋収縮に応じて関節軟骨だけが骨化する"],"a":2,"e":"正解は『長期荷重に応じて骨形態が変化する』である。骨は加わる力学的負荷に適応し、骨量や内部構造を再構築する。","t":""},{"n":8,"c":0,"s":"頭蓋骨の縫合を構造的に分類したものはどれか。","o":["滑膜性関節として連結される","軟骨性関節として連結される","骨性結合として連結される","線維性関節として連結される"],"a":3,"e":"正解は『線維性関節として連結される』である。縫合では骨同士が線維性結合組織で連結され、通常は滑膜性関節のような関節腔をもたない。","t":""},{"n":9,"c":0,"s":"成人の関節軟骨における栄養供給の特徴はどれか。","o":["血管を欠き、滑液から栄養される","血管に富み、骨膜から栄養される","神経に富み、滑膜から栄養される","リンパ管に富み、腱から栄養される"],"a":0,"e":"正解は『血管を欠き、滑液から栄養される』である。関節軟骨には血管がなく、軟骨細胞への栄養供給には滑液からの拡散が重要となる。","t":""},{"n":10,"c":0,"s":"滑膜の主な機能として適切なのはどれか。","o":["関節軟骨を骨端部へ固定する","滑液を産生して関節腔へ供給する","靭帯線維を骨膜へ直接連結する","骨髄細胞を関節腔へ放出する"],"a":1,"e":"正解は『滑液を産生して関節腔へ供給する』である。滑膜は関節包の内面を覆い、関節の潤滑や軟骨の栄養に関与する滑液を産生する。","t":""},{"n":11,"c":0,"s":"靭帯の基本的な構造と役割を示すものはどれか。","o":["筋腹同士を結び、張力を蓄える組織","軟骨同士を結び、圧力を伝える組織","骨同士を結び、関節を安定させる組織","神経同士を結び、刺激を伝える組織"],"a":2,"e":"正解は『骨同士を結び、関節を安定させる組織』である。靭帯は主に密性結合組織からなり、過剰な関節運動を制動して受動的安定性に寄与する。","t":""},{"n":12,"c":0,"s":"腱の基本的な構造と役割を示すものはどれか。","o":["骨と骨を結び、関節運動を制動する","軟骨と骨を結び、圧縮力を吸収する","筋と筋を結び、神経刺激を伝達する","筋と骨を結び、筋張力を伝達する"],"a":3,"e":"正解は『筋と骨を結び、筋張力を伝達する』である。腱は筋が発生した張力を骨へ伝え、関節運動を生じさせる。","t":""},{"n":13,"c":0,"s":"腱や靭帯の付着部がもつ主な力学的役割はどれか。","o":["硬さの異なる組織間で応力を分散する","関節液を貯留して軟骨面を潤滑する","骨髄細胞を供給して造血量を調節する","神経刺激を増幅して筋出力を調節する"],"a":0,"e":"正解は『硬さの異なる組織間で応力を分散する』である。付着部には軟部組織から骨へ段階的に移行する構造があり、境界部への応力集中を軽減する。","t":""},{"n":14,"c":0,"s":"前十字靭帯の主要な制動作用はどれか。","o":["脛骨の後方移動を主に制動する","脛骨の前方移動を主に制動する","脛骨の外反移動を主に制動する","脛骨の内反移動を主に制動する"],"a":1,"e":"正解は『脛骨の前方移動を主に制動する』である。前十字靭帯は大腿骨に対する脛骨の前方移動を制動し、膝関節の回旋安定性にも寄与する。","t":""},{"n":15,"c":0,"s":"後十字靭帯の主要な制動作用はどれか。","o":["脛骨の前方移動を主に制動する","脛骨の外方移動を主に制動する","脛骨の後方移動を主に制動する","脛骨の内方移動を主に制動する"],"a":2,"e":"正解は『脛骨の後方移動を主に制動する』である。後十字靭帯は大腿骨に対する脛骨の後方移動を制動し、特に膝屈曲位で重要となる。","t":""},{"n":16,"c":0,"s":"膝内側側副靭帯の主要な制動作用はどれか。","o":["膝関節の前方引き出しを制動する","膝関節の後方引き出しを制動する","膝関節の内反方向の動揺を制動する","膝関節の外反方向の動揺を制動する"],"a":3,"e":"正解は『膝関節の外反方向の動揺を制動する』である。内側側副靭帯は膝関節に加わる外反ストレスに抵抗し、内側の安定性を保つ。","t":""},{"n":17,"c":0,"s":"固定された凹面上を凸面が動く場合、凹凸の法則に従う転がりと滑りの関係はどれか。","o":["転がりと滑りが反対方向に生じる","転がりと滑りが同じ方向に生じる","転がりだけが生じて滑りは生じない","滑りだけが生じて転がりは生じない"],"a":0,"e":"正解は『転がりと滑りが反対方向に生じる』である。凸面側が動く場合は、転がりと反対方向の滑りが生じることで関節面の適合性が保たれる。","t":"【修正】原文「凸面が固定された凹面上を…」は固定側を逆に読める曖昧な表現のため語順を修正。"},{"n":18,"c":0,"s":"固定された凸面上を凹面が動く場合、凹凸の法則に従う転がりと滑りの関係はどれか。","o":["転がりと滑りが反対方向に生じる","転がりと滑りが同じ方向に生じる","転がりだけが生じて滑りは生じない","滑りだけが生じて転がりは生じない"],"a":1,"e":"正解は『転がりと滑りが同じ方向に生じる』である。凹面側が動く場合は、凹面の移動方向と転がりおよび滑りの方向が一致する。","t":"【修正】問17と同様、固定側が明確になるよう語順を修正。"},{"n":19,"c":0,"s":"関節包内運動に該当する現象はどれか。","o":["骨全体の屈曲と伸展を表す運動","身体重心の移動と加速度を表す運動","関節面の転がりと滑りを表す運動","筋線維の短縮と伸張を表す運動"],"a":2,"e":"正解は『関節面の転がりと滑りを表す運動』である。関節包内運動には転がり、滑り、軸回旋などの関節面相互の微細な運動が含まれる。","t":""},{"n":20,"c":0,"s":"関節面における軸回旋の特徴はどれか。","o":["接触点を連続的に変える転がり運動","関節面を平行移動させる滑り運動","二つの運動軸を交互に使う複合運動","ほぼ同じ接触点で回る回旋運動"],"a":3,"e":"正解は『ほぼ同じ接触点で回る回旋運動』である。軸回旋では、一方の関節面が相手側のほぼ同じ接触点を中心として回転する。","t":""},{"n":21,"c":0,"s":"屈曲と伸展が生じる基本的な運動面と運動軸の組合せはどれか。","o":["矢状面内で前額軸周りに生じる","前額面内で矢状軸周りに生じる","水平面内で垂直軸周りに生じる","矢状面内で垂直軸周りに生じる"],"a":0,"e":"正解は『矢状面内で前額軸周りに生じる』である。屈曲と伸展は矢状面上の運動であり、その面に直交する左右方向の前額軸を中心に生じる。","t":""},{"n":22,"c":0,"s":"外転と内転が生じる基本的な運動面と運動軸の組合せはどれか。","o":["矢状面内で前額軸周りに生じる","前額面内で矢状軸周りに生じる","水平面内で垂直軸周りに生じる","前額面内で垂直軸周りに生じる"],"a":1,"e":"正解は『前額面内で矢状軸周りに生じる』である。外転と内転は前額面上の運動であり、その面に直交する前後方向の矢状軸を中心に生じる。","t":""},{"n":23,"c":0,"s":"内旋と外旋が生じる基本的な運動面と運動軸の組合せはどれか。","o":["矢状面内で前額軸周りに生じる","前額面内で矢状軸周りに生じる","水平面内で垂直軸周りに生じる","水平面内で前額軸周りに生じる"],"a":2,"e":"正解は『水平面内で垂直軸周りに生じる』である。内旋と外旋は水平面上の運動であり、長軸方向に相当する垂直軸を中心に生じる。","t":""},{"n":24,"c":0,"s":"上腕骨頭が関節窩上を動く肩関節外転時の関節包内運動はどれか。","o":["上方へ転がり、上方へ滑る","下方へ転がり、下方へ滑る","下方へ転がり、上方へ滑る","上方へ転がり、下方へ滑る"],"a":3,"e":"正解は『上方へ転がり、下方へ滑る』である。凸面である上腕骨頭が凹面である関節窩上を動くため、転がりと滑りは反対方向に生じる。","t":""},{"n":25,"c":0,"s":"足部を非荷重位で背屈するとき、距腿関節における距骨の運動はどれか。","o":["前方へ転がり、後方へ滑る","後方へ転がり、前方へ滑る","前方へ転がり、前方へ滑る","後方へ転がり、後方へ滑る"],"a":0,"e":"正解は『前方へ転がり、後方へ滑る』である。非荷重位の背屈では凸面である距骨滑車が関節窩内を動き、前方への転がりと後方への滑りが生じる。","t":""},{"n":26,"c":0,"s":"求心性収縮の特徴はどれか。","o":["張力を出しながら筋長が伸びる収縮","張力を出しながら筋長が短くなる収縮","筋長を保ちながら張力が消える収縮","角速度を変えながら張力が一定の収縮"],"a":1,"e":"正解は『張力を出しながら筋長が短くなる収縮』である。求心性収縮では筋が発揮する力が外力を上回り、筋腱複合体が短縮して関節運動を生じる。","t":""},{"n":27,"c":0,"s":"遠心性収縮の特徴はどれか。","o":["張力を出しながら筋長が短くなる収縮","筋長を保ちながら張力を出し続ける収縮","張力を出しながら筋長が伸びる収縮","角速度を保ちながら筋長が変わる収縮"],"a":2,"e":"正解は『張力を出しながら筋長が伸びる収縮』である。遠心性収縮では外力を制動しながら筋腱複合体が伸張され、運動速度の調節や衝撃吸収に働く。","t":""},{"n":28,"c":0,"s":"等尺性収縮の特徴はどれか。","o":["筋長が短くなりながら張力を出す収縮","筋長が伸びながら張力を出す収縮","関節角速度を一定に保って行う収縮","筋長をほぼ保ちながら張力を出す収縮"],"a":3,"e":"正解は『筋長をほぼ保ちながら張力を出す収縮』である。等尺性収縮では筋張力が発生しても筋腱複合体の長さと関節角度に大きな変化が生じない。","t":""},{"n":29,"c":0,"s":"等速性運動の特徴はどれか。","o":["関節角速度を一定に保つ収縮様式","関節角度を一定に保つ収縮様式","筋張力だけを一定に保つ収縮様式","筋線維長だけを一定に保つ収縮様式"],"a":0,"e":"正解は『関節角速度を一定に保つ収縮様式』である。等速性運動では専用機器が抵抗を調節し、設定された角速度を超えないように運動が行われる。","t":""},{"n":30,"c":0,"s":"棘上筋の代表的な作用はどれか。","o":["肩関節の内旋に作用する","肩関節の外転に作用する","肩関節の伸展に作用する","肩関節の内転に作用する"],"a":1,"e":"正解は『肩関節の外転に作用する』である。棘上筋は上腕骨頭を関節窩へ安定させながら、三角筋とともに肩関節外転に関与する。","t":""},{"n":31,"c":0,"s":"片脚立位で反対側の骨盤下制を抑えるために主に働く筋はどれか。","o":["支持側の大殿筋が主に働く","支持側の内転筋群が主に働く","支持側の中殿筋が主に働く","遊脚側の中殿筋が主に働く"],"a":2,"e":"正解は『支持側の中殿筋が主に働く』である。支持側の中殿筋は股関節外転モーメントを発生させ、遊脚側への骨盤下制を抑制する。","t":""},{"n":32,"c":0,"s":"肩関節の腱板筋に共通する主要な機能はどれか。","o":["肩甲骨を胸郭から離す作用","上腕骨を肩甲骨から引く作用","鎖骨を胸骨から挙上する作用","上腕骨頭を関節窩へ求心する作用"],"a":3,"e":"正解は『上腕骨頭を関節窩へ求心する作用』である。腱板筋は上腕骨頭を関節窩へ圧着し、肩関節運動中の動的安定性を高める。","t":""},{"n":33,"c":0,"s":"多関節筋に生じる活動性不足の説明はどれか。","o":["多関節筋が短縮しすぎて張力を出しにくい状態","多関節筋が伸張されすぎて可動域を制限する状態","単関節筋が疲労して収縮速度を失った状態","腱組織が弛緩して反射活動を失った状態"],"a":0,"e":"正解は『多関節筋が短縮しすぎて張力を出しにくい状態』である。活動性不足は多関節筋が複数の関節で同時に短縮され、十分な活動張力を発揮しにくくなった状態を指す。","t":""},{"n":34,"c":0,"s":"多関節筋に生じる他動性不足の説明はどれか。","o":["多関節筋が短縮しすぎて張力を失う状態","多関節筋が伸張されて可動域を制限する状態","単関節筋が短縮されて腱反射を失う状態","単関節筋が伸張されて筋力を増す状態"],"a":1,"e":"正解は『多関節筋が伸張されて可動域を制限する状態』である。他動性不足は多関節筋が複数の関節で伸張され、十分に伸びきれないため運動範囲を制限する状態を指す。","t":""},{"n":35,"c":0,"s":"筋の長さと活動張力の関係で、活動張力が最大になりやすい条件はどれか。","o":["筋節が最短となり、重なりが最大になる長さ","筋節が最長となり、重なりが消失する長さ","適度な重なりで架橋を作りやすい長さ","腱が完全に弛緩し、受動張力がない長さ"],"a":2,"e":"正解は『適度な重なりで架橋を作りやすい長さ』である。アクチンとミオシンが適度に重なる筋節長では形成可能な架橋数が多くなり、活動張力が大きくなる。","t":""},{"n":36,"c":0,"s":"短縮性収縮における力と速度の関係はどれか。","o":["短縮速度が高いほど発揮張力は高くなる","短縮速度が変わっても発揮張力は一定となる","短縮速度が低いほど発揮張力は低くなる","短縮速度が高いほど発揮張力は低くなる"],"a":3,"e":"正解は『短縮速度が高いほど発揮張力は低くなる』である。短縮性収縮では短縮速度が増すと同時に結合しているクロスブリッジ数が減少し（Hillの力–速度関係）、発揮可能な筋張力が低下する。","t":"【解説修正】機序の説明を精緻化。"},{"n":37,"c":0,"s":"平行筋と比べた羽状筋の一般的な特徴はどれか。","o":["生理学的筋横断面積を大きくしやすい","筋線維の短縮距離を大きくしやすい","関節運動の可動範囲を大きくしやすい","筋全体の収縮速度を大きくしやすい"],"a":0,"e":"正解は『生理学的筋横断面積を大きくしやすい』である。羽状筋は限られた体積に多くの筋線維を配置できるため、大きな筋力を発揮しやすい。","t":""},{"n":38,"c":0,"s":"タイプI（I型）筋線維の特徴はどれか。","o":["収縮が速く、解糖系が優位で疲労しやすい","収縮が遅く、酸化系が優位で疲労しにくい","収縮が速く、酸化系が乏しく疲労しにくい","収縮が遅く、解糖系が優位で疲労しやすい"],"a":1,"e":"正解は『収縮が遅く、酸化系が優位で疲労しにくい』である。1型筋線維はミトコンドリアや毛細血管に富み、姿勢保持や持久的活動に適している。","t":"【表記修正】「1型」→「タイプI」。"},{"n":39,"c":0,"s":"関節軸まわりに生じるトルクを表すものはどれか。","o":["力と物体が移動した直線距離の積である","仕事とその仕事に要した経過時間の積である","力と、関節軸から力の作用線までの垂直距離の積である","物体の質量とその移動速度の積である"],"a":2,"e":"正解は『力と、関節軸から力の作用線までの垂直距離の積である』である。トルクは力の大きさと、関節軸から力の作用線までの垂直距離であるモーメントアームによって決まる。","t":"【修正】距離の起点（関節軸）を明記。"},{"n":40,"c":0,"s":"第1のてこの支点、力点、抵抗点の位置関係はどれか。","o":["力点が支点と抵抗点の間にある配置","抵抗点が支点と力点の間にある配置","支点と力点が同じ位置にある配置","支点が力点と抵抗点の間にある配置"],"a":3,"e":"正解は『支点が力点と抵抗点の間にある配置』である。第1のてこでは中央に支点が位置し、力点と抵抗点がその両側に配置される。","t":""},{"n":41,"c":0,"s":"加える力を変えずにモーメントアームだけを長くした場合、関節トルクはどうなるか。","o":["同じ力でも関節トルクは大きくなる","同じ力でも関節トルクは小さくなる","同じ力でも関節速度は必ず一定となる","同じ力でも関節角度は必ずゼロとなる"],"a":0,"e":"正解は『同じ力でも関節トルクは大きくなる』である。トルクは力とモーメントアームの積であるため、力が同じなら垂直距離が長いほど大きくなる。","t":""},{"n":42,"c":0,"s":"てこの力学的有利が1より大きくなる条件はどれか。","o":["力点の腕が抵抗点の腕より短い","力点の腕が抵抗点の腕より長い","力点と支点が常に同じ位置にある","抵抗点と支点が常に同じ位置にある"],"a":1,"e":"正解は『力点の腕が抵抗点の腕より長い』である。力点側のモーメントアームが抵抗点側より長いと、抵抗に対してより小さな力でつり合うことができる。","t":""},{"n":43,"c":0,"s":"物体の重心を力学的に説明したものはどれか。","o":["物体の面積が均等に分布するとみなす点","物体の体積が最大となる部位を示す点","物体の質量が集中するとみなせる点","物体の支持力が最小となる部位を示す点"],"a":2,"e":"正解は『物体の質量が集中するとみなせる点』である。重心は重力が物体全体に及ぼす作用を一点にまとめて考えられる位置であり、均一な重力場では質量中心と一致する。","t":""},{"n":44,"c":0,"s":"立位姿勢の力学的安定性を高める条件はどれか。","o":["支持基底面が狭く、重心位置が高い","支持基底面が広く、重心位置が高い","支持基底面が狭く、重心位置が低い","支持基底面が広く、重心位置が低い"],"a":3,"e":"正解は『支持基底面が広く、重心位置が低い』である。支持基底面を広げて重心を低くすると、重心線が支持基底面外へ移動しにくくなり安定性が高まる。","t":""},{"n":45,"c":0,"s":"床反力の説明として適切なのはどれか。","o":["身体が床に加えた力と等大で反対向きの力","身体が床に加えた力と等大で同じ向きの力","身体が床に加えた力より小さく反対向きの力","身体が床に加えた力より大きく同じ向きの力"],"a":0,"e":"正解は『身体が床に加えた力と等大で反対向きの力』である。床反力は作用反作用の法則により、身体が床へ及ぼす力に対して床から身体へ作用する。","t":""},{"n":46,"c":0,"s":"閉鎖性運動連鎖の特徴はどれか。","o":["遠位体節が自由で、単一関節が主に動く","遠位体節が固定され、複数関節が連動する","近位体節が固定され、遠位体節だけが回る","全体節が固定され、関節運動が起こらない"],"a":1,"e":"正解は『遠位体節が固定され、複数関節が連動する』である。閉鎖性運動連鎖では末端が床などに固定され、一つの関節運動が隣接関節へ影響する。","t":""},{"n":47,"c":0,"s":"開放性運動連鎖の特徴はどれか。","o":["遠位体節が固定され、複数関節が連動する","近位体節と遠位体節がともに固定される","遠位体節が自由で、個別関節を動かしやすい","全体節が床面に接触し、荷重を分散する"],"a":2,"e":"正解は『遠位体節が自由で、個別関節を動かしやすい』である。開放性運動連鎖では末端が固定されず、特定の関節や筋群を選択的に運動させやすい。","t":""},{"n":48,"c":0,"s":"材料内部に生じる応力の定義はどれか。","o":["変形量を元の長さで除した量","力と変位距離を掛け合わせた量","仕事量を経過時間で除した量","物体に加わる力を断面積で除した量"],"a":3,"e":"正解は『物体に加わる力を断面積で除した量』である。応力は材料内部に生じる単位面積当たりの力を表し、引張応力や圧縮応力などに分類される。","t":""},{"n":49,"c":0,"s":"材料に生じるひずみの定義はどれか。","o":["変形量を元の長さで除した比","加えた力を断面積で除した比","物体の質量を体積で除した比","発生した仕事を時間で除した比"],"a":0,"e":"正解は『変形量を元の長さで除した比』である。ひずみは元の寸法に対する変形量の割合であり、材料の相対的な変形の程度を示す。","t":""},{"n":50,"c":0,"s":"力学的な仕事が生じる状態はどれか。","o":["力が作用しても物体が静止している状態","力の作用方向に物体が変位した状態","力を断面積で除して物体に加えた状態","仕事を経過時間で除して物体に加えた状態"],"a":1,"e":"正解は『力の作用方向に物体が変位した状態』である。力学的仕事は力の変位方向成分と変位距離によって決まり、変位がなければ仕事は生じない。","t":""},{"n":51,"c":1,"s":"結合組織損傷後の炎症期初期に起こる反応はどれか。","o":["成熟骨梁の荷重方向への配列","I型コラーゲンの強固な架橋形成","血小板凝集とフィブリン形成","瘢痕組織の水分量低下と収縮"],"a":2,"e":"正解は『血小板凝集とフィブリン形成』である。損傷直後は止血反応によって血腫と一時的な足場が作られ、その後に炎症細胞が集まる。","t":""},{"n":52,"c":1,"s":"炎症期早期に損傷部へ集まる細胞として適切なのはどれか。","o":["好中球が侵入して異物を貪食する","骨芽細胞が集まり骨基質を形成する","軟骨細胞が集まり軟骨基質を形成する","筋芽細胞が集まり筋線維を再生する"],"a":0,"e":"正解は『好中球が侵入して異物を貪食する』である。好中球は炎症期早期に集まり、細菌や壊死組織の除去に関与する。その後はマクロファージの働きが中心となる。","t":""},{"n":53,"c":1,"s":"組織治癒におけるマクロファージの役割はどれか。","o":["血小板凝集を抑えて血腫を除去する","成熟コラーゲンを固定して吸収を止める","軟骨細胞を骨細胞へ直接変換する","壊死組織を貪食して増殖因子を放出する"],"a":3,"e":"正解は『壊死組織を貪食して増殖因子を放出する』である。マクロファージは損傷組織を除去するとともに、血管新生や線維芽細胞の活動を調節する因子を放出する。","t":""},{"n":54,"c":1,"s":"結合組織の増殖期にみられる代表的な変化はどれか。","o":["好中球が増殖し異物処理だけを継続する","線維芽細胞が増殖し細胞外基質を産生する","破骨細胞が増殖し石灰化基質を吸収する","成熟骨細胞が増殖し骨梁配列を完成する"],"a":1,"e":"正解は『線維芽細胞が増殖し細胞外基質を産生する』である。増殖期には線維芽細胞の増殖、コラーゲン産生、血管新生などが進み、損傷部が肉芽組織で満たされる。","t":""},{"n":55,"c":1,"s":"増殖期に形成される肉芽組織の特徴はどれか。","o":["新生毛細血管と線維芽細胞に富む組織","成熟した骨梁と造血細胞に富む組織","硝子軟骨の基質と軟骨細胞に富む組織","脂肪組織の小葉と末梢神経に富む組織"],"a":0,"e":"正解は『新生毛細血管と線維芽細胞に富む組織』である。肉芽組織は新生血管、線維芽細胞、炎症細胞および未成熟な細胞外基質から構成される。","t":""},{"n":56,"c":1,"s":"修復過程における血管新生の主な役割はどれか。","o":["修復組織の温度だけを一定に保つ","損傷部の神経伝導だけを回復させる","修復組織へ酸素と栄養を供給する","瘢痕組織の石灰化だけを促進する"],"a":2,"e":"正解は『修復組織へ酸素と栄養を供給する』である。新生血管は代謝要求の高い修復細胞へ酸素と栄養を届け、老廃物の除去にも寄与する。","t":""},{"n":57,"c":1,"s":"結合組織修復の早期に増加しやすいコラーゲンはどれか。","o":["I型コラーゲンが早期に増える","III型コラーゲンが早期に増える","II型コラーゲンが早期に増える","IV型コラーゲンが早期に増える"],"a":1,"e":"正解は『III型コラーゲンが早期に増える』である。III型コラーゲンは早期の修復基質を形成し、成熟に伴って力学的に強いI型コラーゲンの割合が増加する。","t":""},{"n":58,"c":1,"s":"結合組織の成熟期にみられるコラーゲンの変化はどれか。","o":["I型コラーゲンがIII型へ置換される","II型コラーゲンがIV型へ置換される","IV型コラーゲンがII型へ置換される","III型コラーゲンがI型へ置換される"],"a":3,"e":"正解は『III型コラーゲンがI型へ置換される』である。成熟期にはI型コラーゲンの割合、線維の配向および架橋が増し、修復組織の引張強度が向上する。","t":""},{"n":59,"c":1,"s":"組織修復における筋線維芽細胞の主な働きはどれか。","o":["骨基質を吸収して骨梁を細くする","軟骨基質を合成して関節面を作る","収縮力を生じて創縁を近づける","血小板を産生して血腫を大きくする"],"a":2,"e":"正解は『収縮力を生じて創縁を近づける』である。筋線維芽細胞は収縮性蛋白をもち、創収縮と細胞外基質の再構築に関与する。","t":""},{"n":60,"c":1,"s":"炎症期、増殖期、成熟期の時間的関係として適切なのはどれか。","o":["各期は必ず同じ長さで順番に続く","各期は時間的に重なりながら進む","各期は損傷組織に関係なく一定である","各期は成熟期から炎症期へ逆行する"],"a":1,"e":"正解は『各期は時間的に重なりながら進む』である。治癒段階の境界は明確に分かれるものではなく、炎症が残る間にも増殖や基質形成が始まる。","t":""},{"n":61,"c":1,"s":"成熟期に修復組織の引張強度を高める変化はどれか。","o":["コラーゲン線維の配向と架橋が進む","毛細血管の透過性と浮腫が増える","好中球の浸潤と貪食だけが続く","プロテオグリカンの流出だけが進む"],"a":0,"e":"正解は『コラーゲン線維の配向と架橋が進む』である。線維が加わる張力の方向へ再配列し、分子間架橋が増えることで力学的強度が向上する。","t":""},{"n":62,"c":1,"s":"組織リモデリングにおけるマトリックス分解酵素の役割はどれか。","o":["血小板を凝集させ血腫を拡大する","骨芽細胞を破壊し骨形成を止める","軟骨細胞だけを選択的に増殖させる","細胞外基質を分解し再構築を助ける"],"a":3,"e":"正解は『細胞外基質を分解し再構築を助ける』である。マトリックス分解酵素は不要な基質を除去し、新たな基質への置換や線維配列の調整を可能にする。","t":""},{"n":63,"c":1,"s":"損傷部に形成される一時的な基質の主な役割はどれか。","o":["成熟組織の力学強度を直ちに回復する","修復細胞が移動する足場として働く","損傷部への血流を長期間遮断する","炎症細胞の侵入を完全に防止する"],"a":1,"e":"正解は『修復細胞が移動する足場として働く』である。フィブリンなどからなる一時的基質は、炎症細胞、線維芽細胞および血管内皮細胞の移動を支える。","t":""},{"n":64,"c":1,"s":"炎症反応が過剰に持続した場合に起こりやすい変化はどれか。","o":["架橋形成が早まり瘢痕が直ちに成熟する","血管新生が整い組織強度が直ちに戻る","蛋白分解が増えて組織損傷が長引く","線維配向が整い再断裂の危険が消える"],"a":2,"e":"正解は『蛋白分解が増えて組織損傷が長引く』である。炎症性サイトカインや分解酵素が過剰に働くと、形成された基質も障害されて治癒が遅延する。","t":""},{"n":65,"c":1,"s":"二次性骨折治癒の初期に起こる変化はどれか。","o":["硬性仮骨が形成され骨梁が配列する","軟性仮骨が形成され骨端を固定する","層板骨が形成され骨髄腔が再開する","骨折血腫が形成され炎症が始まる"],"a":3,"e":"正解は『骨折血腫が形成され炎症が始まる』である。骨折に伴う血管損傷から血腫が形成され、炎症細胞と各種修復因子が集まる場となる。","t":""},{"n":66,"c":1,"s":"二次性骨折治癒における軟性仮骨の構成として適切なのはどれか。","o":["線維性組織と軟骨性組織が主体となる","層板骨組織と成熟骨梁が主体となる","黄色骨髄と脂肪細胞が主体となる","石灰化軟骨と層板骨だけが主体となる"],"a":0,"e":"正解は『線維性組織と軟骨性組織が主体となる』である。軟性仮骨は骨折部を一時的に安定させるが、石灰化した硬性仮骨より力学的強度が低い。","t":""},{"n":67,"c":1,"s":"軟性仮骨から硬性仮骨へ移行する際の変化はどれか。","o":["肉芽組織が増え血腫だけを保持する","線維軟骨が増え可動性だけを高める","編み目状骨が増え骨片間を架橋する","層板骨が増え直ちに元の形へ戻る"],"a":2,"e":"正解は『編み目状骨が増え骨片間を架橋する』である。軟骨性基質の石灰化と新生骨形成が進み、硬性仮骨による骨性架橋が形成される。","t":""},{"n":68,"c":1,"s":"骨折治癒のリモデリング期に生じる変化はどれか。","o":["編み目状骨が層板骨へ置換される","層板骨が線維軟骨へ置換される","海綿骨が血腫組織へ置換される","皮質骨が肉芽組織へ置換される"],"a":0,"e":"正解は『編み目状骨が層板骨へ置換される』である。破骨細胞による吸収と骨芽細胞による形成が協調し、荷重環境に適応した骨構造へ再編される。","t":""},{"n":69,"c":1,"s":"直接骨癒合を生じやすい固定環境はどれか。","o":["広い骨折間隙を伴う相対的安定性","解剖学的整復を伴う絶対的安定性","持続的牽引を伴う大きな可動性","回旋変形を伴う不十分な固定性"],"a":1,"e":"正解は『解剖学的整復を伴う絶対的安定性』である。直接骨癒合には骨片間の動きがほとんどない低ひずみ環境が必要となる。","t":""},{"n":70,"c":1,"s":"直接骨癒合の形態的特徴はどれか。","o":["豊富な軟性仮骨を経て硬性仮骨へ移る","大きな外仮骨を形成して骨片間を架橋する","線維軟骨を介して骨折部の間隙を結合する","目立つ仮骨を作らず骨単位が架橋する"],"a":3,"e":"正解は『目立つ仮骨を作らず骨単位が架橋する』である。破骨細胞を先頭とする切削円錐が骨折線を越え、後方で骨芽細胞が新たな骨単位を形成する。なお、これは接触癒合の説明であり、わずかな間隙がある場合（間隙癒合）は先に層板骨が骨折線に沿って沈着した後に骨単位による再構築が進む。","t":"【解説補足】間隙癒合を追記。"},{"n":71,"c":1,"s":"二次性骨折治癒を生じやすい力学環境はどれか。","o":["制御された微小運動を許す相対的安定性","骨片間運動を消失させる絶対的安定性","回旋転位を反復させる著しい不安定性","血流遮断を持続させる強固な圧迫固定"],"a":0,"e":"正解は『制御された微小運動を許す相対的安定性』である。相対的安定性では仮骨を介した治癒が進むが、過剰な運動は骨性架橋を妨げる。","t":""},{"n":72,"c":1,"s":"骨折治癒における軟骨内骨化を表すものはどれか。","o":["線維組織が直接に層板骨へ変化する過程","軟骨性基質が骨組織へ置換される過程","骨髄脂肪が直接に骨膜へ変化する過程","成熟骨梁が血腫組織へ置換される過程"],"a":1,"e":"正解は『軟骨性基質が骨組織へ置換される過程』である。軟性仮骨の軟骨が石灰化し、血管侵入と骨形成を経て硬性仮骨へ移行する。","t":""},{"n":73,"c":1,"s":"骨折治癒における膜性骨化を表すものはどれか。","o":["軟骨鋳型を作ってから骨へ置換する","血腫を残したまま骨髄腔だけを作る","線維軟骨を介して関節面を再生する","骨芽細胞が軟骨を介さず骨を形成する"],"a":3,"e":"正解は『骨芽細胞が軟骨を介さず骨を形成する』である。膜性骨化では間葉系前駆細胞が骨芽細胞へ分化し、軟骨性の中間段階を経ずに骨基質を産生する。","t":""},{"n":74,"c":1,"s":"骨折部のリモデリングにおける破骨細胞の働きはどれか。","o":["骨折血腫を作り炎症反応を開始する","軟骨細胞を増やし軟性仮骨を作る","不要な骨を吸収し骨形態を整える","膠原線維を作り腱組織を架橋する"],"a":2,"e":"正解は『不要な骨を吸収し骨形態を整える』である。破骨細胞は余剰仮骨や編み目状骨を吸収し、骨芽細胞による層板骨形成と協調して形態を再構築する。","t":""},{"n":75,"c":1,"s":"骨折治癒における骨芽細胞の働きはどれか。","o":["骨基質を吸収して骨髄腔を広げる","類骨を産生して新生骨を形成する","血小板を凝集して血腫を形成する","軟骨基質を分解して血管を閉塞する"],"a":1,"e":"正解は『類骨を産生して新生骨を形成する』である。骨芽細胞が産生した類骨はその後に石灰化し、仮骨やリモデリング後の骨を構成する。","t":""},{"n":76,"c":1,"s":"骨折部の血流障害が治癒へ及ぼす影響はどれか。","o":["細胞供給と酸素供給が減り骨形成が遅れる","骨片間の安定性が増して直接骨癒合が進む","仮骨の石灰化が早まり骨強度が増加する","破骨細胞の働きが止まり骨髄腔が拡大する"],"a":0,"e":"正解は『細胞供給と酸素供給が減り骨形成が遅れる』である。良好な血流は炎症細胞、骨形成細胞、酸素および栄養の供給に必要であり、虚血は遷延癒合や偽関節の要因となる。","t":""},{"n":77,"c":1,"s":"喫煙が骨折治癒へ及ぼす影響はどれか。","o":["骨折部の血流を増やし骨形成を促進する","骨芽細胞を増やし仮骨成熟を促進する","血流と細胞機能を損ない癒合を遅らせる","骨片間の安定性を高め癒合を促進する"],"a":2,"e":"正解は『血流と細胞機能を損ない癒合を遅らせる』である。喫煙は局所灌流や骨形成に関わる細胞の機能を障害し、遷延癒合や偽関節の危険を高める。","t":""},{"n":78,"c":1,"s":"肥厚性偽関節の病態として適切なのはどれか。","o":["修復反応が乏しく血流障害が主体の状態","骨形成がなく感染だけが主体となる状態","仮骨が乏しく骨欠損だけが主体の状態","仮骨形成はあるが固定不足が主体の状態"],"a":3,"e":"正解は『仮骨形成はあるが固定不足が主体の状態』である。肥厚性偽関節では生物学的な修復反応は保たれているが、過剰な骨片間運動によって骨性架橋が成立しない。","t":""},{"n":79,"c":1,"s":"骨折部の過剰な骨片間運動によって生じやすい変化はどれか。","o":["軟骨基質の石灰化と骨架橋が早く進む","骨単位の直接架橋と層板化が早く進む","骨片間の血流と骨強度が直ちに増える","線維性組織が残り骨性架橋が遅くなる"],"a":3,"e":"正解は『線維性組織が残り骨性架橋が遅くなる』である。過剰な骨片間ひずみは軟骨や骨による架橋を妨げ、力学的に弱い線維性組織を残存させる。","t":""},{"n":80,"c":1,"s":"成人の関節軟骨が自然修復しにくい主な理由はどれか。","o":["血管が豊富で細胞移動が速いため","血管がなく細胞密度も低いため","神経が豊富で炎症反応が強いため","骨膜が厚く仮骨形成が多いため"],"a":1,"e":"正解は『血管がなく細胞密度も低いため』である。関節軟骨は無血管性で、軟骨細胞の増殖能も限られるため、損傷部への修復細胞の供給が乏しい。","t":""},{"n":81,"c":1,"s":"成人の関節軟骨における主要な栄養経路はどれか。","o":["滑液からの拡散により栄養される","軟骨内血管の灌流により栄養される","末梢神経の軸索輸送により栄養される","骨膜血管の直接灌流により栄養される"],"a":0,"e":"正解は『滑液からの拡散により栄養される』である。関節軟骨には血管がないため、軟骨細胞への酸素や栄養の供給は主として滑液からの拡散に依存する。","t":""},{"n":82,"c":1,"s":"関節軟骨の部分層損傷が修復されにくい理由はどれか。","o":["骨髄細胞が流入して硝子軟骨を再生する","血管が侵入して層板骨を直接形成する","骨髄に達せず修復細胞が集まりにくい","骨膜が増殖して外仮骨を豊富に形成する"],"a":2,"e":"正解は『骨髄に達せず修復細胞が集まりにくい』である。軟骨下骨へ達しない損傷では血腫や骨髄由来細胞の流入が起こりにくく、内在性修復が限定される。","t":""},{"n":83,"c":1,"s":"軟骨下骨に達する関節軟骨損傷で起こり得る反応はどれか。","o":["関節包から骨芽細胞だけが侵入する","骨髄由来細胞が侵入し修復組織を作る","滑液中の赤血球だけが軟骨細胞になる","軟骨細胞が増殖し正常構造を完全再生する"],"a":1,"e":"正解は『骨髄由来細胞が侵入し修復組織を作る』である。軟骨下骨から出血と骨髄細胞の流入が起こるが、形成される組織は正常な硝子軟骨ではなく線維軟骨様となりやすい。","t":""},{"n":84,"c":1,"s":"骨髄刺激後に形成される修復軟骨の一般的な特徴はどれか。","o":["弾性線維が多く曲げに強い弾性軟骨である","II型コラーゲンだけからなる硝子軟骨である","骨単位が整列した層板骨様の組織である","I型コラーゲンが多い線維軟骨様の組織である"],"a":3,"e":"正解は『I型コラーゲンが多い線維軟骨様の組織である』である。線維軟骨様修復組織は正常関節軟骨よりI型コラーゲンが多く、摩擦や反復荷重に対する耐久性が劣る。","t":""},{"n":85,"c":1,"s":"正常な関節軟骨の細胞外基質を代表する成分はどれか。","o":["I型コラーゲンとエラスチンが主体である","III型コラーゲンとフィブリンが主体である","II型コラーゲンとアグリカンが主体である","IV型コラーゲンとケラチンが主体である"],"a":2,"e":"正解は『II型コラーゲンとアグリカンが主体である』である。II型コラーゲンは線維性骨格を形成し、アグリカンなどのプロテオグリカンは水分保持と圧縮抵抗に寄与する。","t":""},{"n":86,"c":1,"s":"関節軟骨におけるアグリカンの主な機能はどれか。","o":["水分を保持して圧縮荷重への抵抗を支える","骨塩を保持して引張荷重への抵抗を支える","血管を形成してせん断荷重への抵抗を支える","神経を形成して回旋荷重への抵抗を支える"],"a":0,"e":"正解は『水分を保持して圧縮荷重への抵抗を支える』である。アグリカンの糖鎖は負の電荷をもち、水分を組織内に保持することで圧縮時の弾性を生み出す。","t":""},{"n":87,"c":1,"s":"長期不動が関節軟骨へ及ぼす影響はどれか。","o":["プロテオグリカンが減少し軟骨が薄くなる","II型コラーゲンが増加し軟骨が厚くなる","軟骨内血管が増加し軟骨が硬くなる","軟骨細胞が増加し軟骨が完全再生する"],"a":0,"e":"正解は『プロテオグリカンが減少し軟骨が薄くなる』である。不動による生理的荷重の欠如は軟骨基質の合成を低下させ、組織の軟化や菲薄化を招く。","t":""},{"n":88,"c":1,"s":"不動後の関節軟骨に対する再負荷の方法として適切なのはどれか。","o":["衝撃荷重から開始して短期間で増量する","疼痛の有無に関係なく最大荷重を加える","低い荷重から開始して段階的に増量する","長期不動を続けて荷重刺激を完全に避ける"],"a":2,"e":"正解は『低い荷重から開始して段階的に増量する』である。不動後の軟骨は力学的特性が低下しているため、急激な高負荷を避けて組織反応を確認しながら進める。","t":""},{"n":89,"c":1,"s":"関節軟骨へ過剰な衝撃荷重が加わった場合の反応はどれか。","o":["基質合成が増えて軟骨厚が均一に増す","軟骨細胞が増えて硝子軟骨が完全再生する","水分移動が止まり軟骨弾性が一定に保たれる","分解酵素が増えて基質損傷が進行する"],"a":3,"e":"正解は『分解酵素が増えて基質損傷が進行する』である。過大な衝撃や高いひずみ速度は分解系の反応を促し、コラーゲン損傷やプロテオグリカン喪失を引き起こす。","t":""},{"n":90,"c":1,"s":"生理的範囲の動的荷重が関節軟骨へ及ぼす作用はどれか。","o":["軟骨細胞の代謝を止め基質合成を抑える","軟骨細胞を刺激し基質合成を支える","軟骨内の血管を増やし直接灌流を作る","軟骨表面の骨化を進め摩擦を減らす"],"a":1,"e":"正解は『軟骨細胞を刺激し基質合成を支える』である。適度な動的圧縮は軟骨細胞の機械受容を介して、プロテオグリカンやコラーゲンの代謝を維持する。","t":""},{"n":91,"c":1,"s":"靭帯修復の早期に形成されるコラーゲンの特徴はどれか。","o":["I型コラーゲンが密に平行配列する","II型コラーゲンが軟骨様に配列する","III型コラーゲンが疎に不規則配列する","IV型コラーゲンが基底膜様に配列する"],"a":2,"e":"正解は『III型コラーゲンが疎に不規則配列する』である。修復早期の靭帯ではIII型コラーゲンが多く、正常靭帯より線維径が細く配列も不規則である。","t":""},{"n":92,"c":1,"s":"靭帯修復のリモデリング期にみられる変化はどれか。","o":["III型が増えて線維配列が乱れていく","I型が増えて線維配列が荷重方向へ整う","II型が増えて靭帯全体が軟骨へ変わる","IV型が増えて靭帯全体が基底膜へ変わる"],"a":1,"e":"正解は『I型が増えて線維配列が荷重方向へ整う』である。リモデリングではI型コラーゲンの割合と架橋が増加し、適切な張力に応じて線維配列が再編される。","t":""},{"n":93,"c":1,"s":"前十字靭帯が内側側副靭帯より自然治癒しにくい理由はどれか。","o":["関節内では血腫の足場が保たれにくい","関節内では血管が過剰で瘢痕が厚くなる","関節内では骨膜が増殖し仮骨が多くなる","関節内では軟骨細胞が増え骨化が進む"],"a":0,"e":"正解は『関節内では血腫の足場が保たれにくい』である。前十字靭帯では滑液環境によって断端間のフィブリン血餅が維持されにくく、修復細胞が移動する足場が形成されにくい。","t":""},{"n":94,"c":1,"s":"長期不動が治癒中の靭帯へ及ぼす影響はどれか。","o":["線維配向が整って破断強度が高くなる","架橋が増えて正常靭帯より強固になる","細胞外基質が増えて弾性が一定になる","線維配向が乱れて力学強度が低下する"],"a":3,"e":"正解は『線維配向が乱れて力学強度が低下する』である。長期不動はコラーゲン線維の配列や架橋を損ない、靭帯の剛性や破断強度を低下させる。","t":""},{"n":95,"c":1,"s":"治癒後の靭帯組織にみられやすい特徴はどれか。","o":["正常靭帯より細胞が少なく強度が高い","瘢痕性組織が残り力学特性が劣りやすい","正常靭帯と同じ構造へ短期間で戻る","硝子軟骨へ置換され圧縮強度が増す"],"a":1,"e":"正解は『瘢痕性組織が残り力学特性が劣りやすい』である。治癒した靭帯ではコラーゲン径、配列、架橋などが正常組織と異なり、強度や剛性の低下が長期間残り得る。","t":""},{"n":96,"c":1,"s":"腱の内因性治癒を表すものはどれか。","o":["腱内の細胞が増殖し基質を産生する","周囲の滑膜細胞だけが腱内へ侵入する","骨髄由来細胞だけが腱束を形成する","軟骨由来細胞だけが腱表面を覆う"],"a":0,"e":"正解は『腱内の細胞が増殖し基質を産生する』である。内因性治癒では腱内部や腱表面の細胞が増殖してコラーゲンを産生し、断端間の修復に関与する。","t":""},{"n":97,"c":1,"s":"腱の外因性治癒を表すものはどれか。","o":["腱内にある細胞だけで修復し周囲癒着を減らす","軟骨由来の細胞だけで修復し腱滑走を増やす","骨髄由来の細胞だけで修復し石灰化を防ぐ","周囲組織の細胞が侵入し癒着を生じやすい"],"a":3,"e":"正解は『周囲組織の細胞が侵入し癒着を生じやすい』である。外因性治癒では腱周囲組織から炎症細胞や線維芽細胞が侵入するため、修復に寄与する一方で腱周囲癒着の原因となる。","t":""},{"n":98,"c":1,"s":"治癒中の腱に対する保護された運動の作用はどれか。","o":["修復部を反復伸張して間隙形成を促す","腱滑走を止めて周囲との癒着を促す","保護下で腱を滑走させ配向を促す","最大抵抗を加えて早期の再断裂を防ぐ"],"a":2,"e":"正解は『保護下で腱を滑走させ配向を促す』である。修復強度に配慮した運動はコラーゲン配向と腱滑走を促し、長期不動による癒着や力学特性低下を抑える。","t":""},{"n":99,"c":1,"s":"腱修復のリモデリング期にみられる変化はどれか。","o":["III型が減少しI型線維の配向が進む","I型が減少しIII型線維の乱れが進む","II型が増加し軟骨基質の形成が進む","IV型が増加し基底膜構造の形成が進む"],"a":0,"e":"正解は『III型が減少しI型線維の配向が進む』である。腱の成熟に伴ってI型コラーゲンの割合と線維径が増し、荷重方向への配列と架橋が進む。","t":""},{"n":100,"c":1,"s":"治癒組織への再負荷を進める基本原則はどれか。","o":["疼痛と腫脹を無視して負荷を急増させる","疼痛と腫脹を確認して負荷を漸増させる","組織の時期を問わず最大負荷を維持する","組織の反応を問わず不動を長期継続する"],"a":1,"e":"正解は『疼痛と腫脹を確認して負荷を漸増させる』である。再負荷は組織の治癒段階と力学的能力に合わせ、負荷後の疼痛、腫脹、熱感や機能低下を確認しながら段階的に進める。","t":""},{"n":101,"c":2,"s":"変形性膝関節症の病態として最も適切なのはどれか。","o":["関節軟骨の変性と軟骨下骨の変化","滑膜のみの炎症と骨びらんの形成","半月板のみの断裂と関節血腫の形成","関節包のみの肥厚と骨萎縮の進行"],"a":0,"e":"正解は『関節軟骨の変性と軟骨下骨の変化』である。変形性膝関節症は軟骨だけでなく、軟骨下骨、滑膜、半月板などにも変化が生じる関節全体の疾患である。","t":""},{"n":102,"c":2,"s":"変形性膝関節症の単純X線像で、関節軟骨の減少を間接的に示す所見はどれか。","o":["骨幹部の骨皮質菲薄化","荷重部の関節裂隙狭小化","膝蓋骨の骨髄腔拡大","脛骨近位の骨端線開大"],"a":1,"e":"正解は『荷重部の関節裂隙狭小化』である。関節軟骨は単純X線には直接写らないため、その減少は関節裂隙の狭小化として評価される。","t":""},{"n":103,"c":2,"s":"内側型変形性膝関節症で生じやすい下肢アライメントはどれか。","o":["膝関節が外反したアライメント","股関節が内旋したアライメント","膝関節が内反したアライメント","足関節が底屈したアライメント"],"a":2,"e":"正解は『膝関節が内反したアライメント』である。内側関節裂隙の狭小化に伴って内反変形が進み、膝関節内側への荷重が増大しやすい。","t":""},{"n":104,"c":2,"s":"変形性膝関節症にみられる疼痛の特徴として適切なのはどれか。","o":["長期安静で増悪する炎症性疼痛","早朝だけに限定される関節痛","皮膚刺激だけで生じる表在痛","荷重動作で増悪しやすい関節痛"],"a":3,"e":"正解は『荷重動作で増悪しやすい関節痛』である。歩行、階段昇降、立ち上がりなどの荷重動作で疼痛が生じやすく、進行すると安静時痛を伴うこともある。","t":""},{"n":105,"c":2,"s":"変形性膝関節症患者の立ち上がり能力低下に関係しやすい機能障害はどれか。","o":["足趾伸筋群の筋力低下","大腿四頭筋の筋力低下","肩関節外旋筋の筋力低下","頸部屈筋群の筋力低下"],"a":1,"e":"正解は『大腿四頭筋の筋力低下』である。大腿四頭筋は膝関節を伸展させ、立ち上がりや階段昇降で身体を支持するため、その筋力低下は動作能力を低下させる。","t":""},{"n":106,"c":2,"s":"変形性膝関節症における画像所見と疼痛との関係を評価する考え方はどれか。","o":["両者は常に一致すると判断する","画像所見だけで疼痛を判断する","両者の乖離を考慮して判断する","疼痛だけで病期を確定判断する"],"a":2,"e":"正解は『両者の乖離を考慮して判断する』である。画像上の変化が強くても疼痛が軽い場合や、その反対の場合があるため、症状と身体機能を個別に評価する。","t":""},{"n":107,"c":2,"s":"変形性膝関節症の発症または進行に関係する修正可能な因子はどれか。","o":["低身長と上肢への荷重","低体温と頸部への荷重","低視力と体幹への荷重","肥満と膝関節への荷重"],"a":3,"e":"正解は『肥満と膝関節への荷重』である。体重増加は歩行などで膝関節に加わる力を増大させるため、体重管理は保存療法の重要な要素となる。","t":""},{"n":108,"c":2,"s":"変形性膝関節症に対する運動療法で期待される主な効果はどれか。","o":["疼痛軽減と身体機能の改善","骨棘消失と関節形態の正常化","軟骨再生と関節裂隙の完全回復","炎症消失と薬物療法の完全中止"],"a":0,"e":"正解は『疼痛軽減と身体機能の改善』である。筋力運動、有酸素運動、柔軟性運動などは、症状と活動能力の改善を目的として個別に処方される。","t":""},{"n":109,"c":2,"s":"変形性膝関節症に対して水中運動を用いる主な利点はどれか。","o":["水圧により骨棘を縮小できる","水温により軟骨を再生できる","浮力により関節荷重を軽減できる","抵抗により疼痛を消失できる"],"a":2,"e":"正解は『浮力により関節荷重を軽減できる』である。水中では浮力によって下肢への荷重が減るため、陸上運動で疼痛が強い患者でも運動しやすい。","t":""},{"n":110,"c":2,"s":"片側の変形性膝関節症患者がT字杖を使用する場合、一般的な使用方法はどれか。","o":["患側と同じ手で杖を操作する","両手で一本の杖を操作する","体幹の後方で杖を操作する","患側と反対の手で杖を操作する"],"a":3,"e":"正解は『患側と反対の手で杖を操作する』である。反対側の上肢で杖を使用すると、患側膝関節に加わる荷重や内反方向のモーメントを軽減しやすい。","t":""},{"n":111,"c":2,"s":"変形性膝関節症の運動療法で負荷量の再検討が必要となる反応はどれか。","o":["翌日まで関節痛や腫脹が増加する","運動中に軽い疲労感が出現する","休憩後に呼吸数が安静値へ戻る","運動後に身体が温かく感じられる"],"a":0,"e":"正解は『翌日まで関節痛や腫脹が増加する』である。運動による症状の増悪が長く残る場合は負荷が過大である可能性があり、強度、回数、種目などを調整する。","t":""},{"n":112,"c":2,"s":"変形性膝関節症に対する閉鎖性運動連鎖の運動はどれか。","o":["座位で行う膝関節伸展運動","椅子から行う立ち上がり運動","背臥位で行う下肢伸展挙上運動","背臥位で行う足関節背屈運動"],"a":1,"e":"正解は『椅子から行う立ち上がり運動』である。足部が床面に固定された状態で複数の関節が協調して動くため、閉鎖性運動連鎖に分類される。","t":""},{"n":113,"c":2,"s":"臼蓋形成不全が変形性股関節症の発症につながる主な機序はどれか。","o":["骨頭被覆が増えて荷重面が拡大する","大転子が下がって関節包が弛緩する","関節裂隙が広がって骨密度が低下する","骨頭被覆が減って荷重が集中する"],"a":3,"e":"正解は『骨頭被覆が減って荷重が集中する』である。臼蓋による大腿骨頭の被覆が不足すると単位面積当たりの負荷が増し、関節軟骨の変性を招きやすい。","t":""},{"n":114,"c":2,"s":"変形性股関節症で疼痛が現れやすい部位はどれか。","o":["鼠径部から大腿前面の周辺","後頭部から頸部後面の周辺","前腕部から手掌面の周辺","下腿部から足背面の周辺"],"a":0,"e":"正解は『鼠径部から大腿前面の周辺』である。股関節由来の疼痛は鼠径部に生じることが多く、大腿前面や膝周辺へ関連痛として広がる場合もある。","t":""},{"n":115,"c":2,"s":"変形性股関節症で比較的早期から制限されやすい関節運動はどれか。","o":["股関節の外旋運動","股関節の内旋運動","足関節の背屈運動","膝関節の伸展運動"],"a":1,"e":"正解は『股関節の内旋運動』である。股関節内旋の減少は変形性股関節症でみられやすく、屈曲や外転などの制限を伴うこともある。","t":""},{"n":116,"c":2,"s":"右股関節外転筋の機能低下によるTrendelenburg徴候はどれか。","o":["右立脚期に右骨盤が下制する","左立脚期に右骨盤が下制する","右立脚期に左骨盤が下制する","左立脚期に左骨盤が下制する"],"a":2,"e":"正解は『右立脚期に左骨盤が下制する』である。右股関節外転筋が右立脚期に骨盤を水平に保持できないため、遊脚側である左側の骨盤が下制する。","t":""},{"n":117,"c":2,"s":"変形性股関節症患者が患側立脚期に体幹を患側へ傾ける力学的な目的はどれか。","o":["外転筋に必要な力を減少させる","内転筋に必要な力を増加させる","膝伸筋に必要な力を増加させる","足底屈筋に必要な力を減少させる"],"a":0,"e":"正解は『外転筋に必要な力を減少させる』である。体幹を患側へ傾けると身体重心が股関節中心へ近づき、外部股関節内転モーメントが減少する。","t":""},{"n":118,"c":2,"s":"右変形性股関節症患者がT字杖を使用する場合、杖を持つ側はどれか。","o":["右手で杖を保持する","両手で杖を保持する","左手で杖を保持する","体幹後方で杖を保持する"],"a":2,"e":"正解は『左手で杖を保持する』である。患側と反対の手で杖を使用すると、股関節外転筋を補助し、患側股関節に必要な筋力と関節反力を軽減できる。","t":""},{"n":119,"c":2,"s":"変形性股関節症患者の骨盤安定性を高めるために重視する筋はどれか。","o":["上腕二頭筋","中殿筋","前脛骨筋","僧帽筋"],"a":1,"e":"正解は『中殿筋』である。中殿筋は立脚期に股関節外転筋として働き、反対側の骨盤が下制することを防ぐ。","t":""},{"n":120,"c":2,"s":"股関節伸展制限を代償して立位を保つ際に生じやすい姿勢変化はどれか。","o":["骨盤後傾と腰椎後弯の増加","骨盤側方移動と胸椎後弯の減少","骨盤回旋と頸椎前弯の減少","骨盤前傾と腰椎前弯の増加"],"a":3,"e":"正解は『骨盤前傾と腰椎前弯の増加』である。股関節を十分に伸展できない場合、骨盤前傾と腰椎伸展によって体幹を起こす代償が生じやすい。","t":""},{"n":121,"c":2,"s":"変形性股関節症患者が疼痛増悪を避けながら活動を維持する方法はどれか。","o":["疼痛の有無にかかわらず終日安静にする","活動と休息を組み合わせて負荷を調整する","疼痛が生じても運動強度を毎日増加する","日常活動を中止して関節運動を避け続ける"],"a":1,"e":"正解は『活動と休息を組み合わせて負荷を調整する』である。活動量を分散させるペーシングにより、過剰な負荷を避けながら必要な身体活動を継続しやすくなる。","t":""},{"n":122,"c":2,"s":"変形性股関節症に対して等尺性の股関節外転筋運動を用いる利点はどれか。","o":["関節運動を大きくして骨棘を除去できる","関節運動を反復して軟骨を再生できる","関節運動を強制して拘縮を解除できる","関節運動を抑えて筋収縮を促せる"],"a":3,"e":"正解は『関節運動を抑えて筋収縮を促せる』である。等尺性運動では関節角度を大きく変えずに筋力を発揮できるため、動作時痛がある場合にも導入しやすい。","t":""},{"n":123,"c":2,"s":"関節リウマチで炎症の主座となる組織はどれか。","o":["関節軟骨","骨膜","滑膜","腱実質"],"a":2,"e":"正解は『滑膜』である。関節リウマチでは持続性滑膜炎が生じ、滑膜増殖や炎症性物質の作用によって軟骨と骨が障害される。","t":""},{"n":124,"c":2,"s":"関節リウマチにおけるパンヌスの作用として適切なのはどれか。","o":["軟骨と骨へ侵入して関節を破壊する","軟骨表面を被覆して関節を保護する","骨髄腔を拡張して造血を促進する","靱帯組織を再生して関節を安定させる"],"a":0,"e":"正解は『軟骨と骨へ侵入して関節を破壊する』である。パンヌスは増殖した炎症性滑膜組織であり、関節軟骨の破壊や骨びらんの形成に関与する。","t":""},{"n":125,"c":2,"s":"関節リウマチで典型的にみられる関節病変の分布はどれか。","o":["片側の大関節だけに生じる分布","脊椎の椎体間だけに生じる分布","左右の手足の小関節に生じる分布","遠位指節間関節だけに生じる分布"],"a":2,"e":"正解は『左右の手足の小関節に生じる分布』である。関節リウマチは手関節、中手指節関節、近位指節間関節、足趾関節などに対称性の多関節炎を起こしやすい。","t":""},{"n":126,"c":2,"s":"関節リウマチにみられる朝のこわばりの特徴はどれか。","o":["休息後に強くなり活動で軽減しやすい","活動後に強くなり睡眠中だけ持続しやすい","食事後に強くなり絶食で軽減しやすい","入浴後に強くなり冷却で消失しやすい"],"a":0,"e":"正解は『休息後に強くなり活動で軽減しやすい』である。炎症性関節疾患では起床時や長時間の不動後にこわばりが強く、穏やかな活動によって軽減する傾向がある。","t":""},{"n":127,"c":2,"s":"関節リウマチの活動性が高く、関節熱感と腫脹が強い時期の関節可動域運動はどれか。","o":["疼痛を超えて最大可動域まで強制する","高速度の反動を用いて反復伸張する","重い抵抗を加えて最終域まで動かす","疼痛を増やさない範囲で穏やかに行う"],"a":3,"e":"正解は『疼痛を増やさない範囲で穏やかに行う』である。強い炎症がある関節への過大な外力は症状を悪化させるため、保護と安静を組み合わせて慎重に実施する。","t":""},{"n":128,"c":2,"s":"関節リウマチ患者の局所関節炎が強い時期に行う筋力運動の考え方はどれか。","o":["炎症関節へ高負荷運動を集中して行う","炎症関節への負荷を減らして運動する","疼痛に関係なく反復回数を増やして行う","腫脹に関係なく最大筋力で運動する"],"a":1,"e":"正解は『炎症関節への負荷を減らして運動する』である。必要に応じて等尺性運動や軽い負荷を用い、炎症の程度と運動後の反応に合わせて処方する。","t":""},{"n":129,"c":2,"s":"関節リウマチ患者に指導する関節保護の方法はどれか。","o":["小関節だけで重い物を保持する","変形方向へ関節を強く押し続ける","同一姿勢で長時間の作業を続ける","大きな関節を使って負荷を分散する"],"a":3,"e":"正解は『大きな関節を使って負荷を分散する』である。両手や前腕などを利用して負荷を分散し、小関節への局所的な力と変形方向へのストレスを減らす。","t":""},{"n":130,"c":2,"s":"関節リウマチでみられる尺側偏位の説明として適切なのはどれか。","o":["手関節が橈側へ偏位する変形","手指が中手指節関節で尺側へ偏位する変形","母指が指節間関節で掌側へ偏位する変形","手指が遠位指節間関節で橈側へ偏位する変形"],"a":1,"e":"正解は『手指が中手指節関節で尺側へ偏位する変形』である。中手指節関節の炎症と支持組織の障害によって、手指が尺側へ偏位する特徴的な変形である。","t":""},{"n":131,"c":2,"s":"関節リウマチにおけるスワンネック変形の組合せはどれか。","o":["近位指節間関節の過伸展と遠位指節間関節の屈曲","近位指節間関節の屈曲と遠位指節間関節の過伸展","中手指節関節の伸展と手関節の掌屈","中手指節関節の屈曲と手関節の背屈"],"a":0,"e":"正解は『近位指節間関節の過伸展と遠位指節間関節の屈曲』である。伸筋機構と関節支持組織の不均衡によって生じる関節リウマチの代表的な手指変形である。","t":""},{"n":132,"c":2,"s":"関節リウマチにおけるボタン穴変形の組合せはどれか。","o":["近位指節間関節の過伸展と遠位指節間関節の屈曲","中手指節関節の屈曲と手関節の掌屈","近位指節間関節の屈曲と遠位指節間関節の過伸展","中手指節関節の伸展と手関節の背屈"],"a":2,"e":"正解は『近位指節間関節の屈曲と遠位指節間関節の過伸展』である。中央索の障害などにより近位指節間関節が屈曲し、側索の緊張によって遠位指節間関節が過伸展する。","t":""},{"n":133,"c":2,"s":"関節リウマチ患者の頸部運動を行う際に特に注意する病変はどれか。","o":["環軸関節の不安定性","肩鎖関節の不安定性","仙腸関節の不安定性","胸鎖関節の不安定性"],"a":0,"e":"正解は『環軸関節の不安定性』である。関節リウマチでは上位頸椎の靱帯や関節が障害されることがあり、強い頸部操作は神経組織を危険にさらす可能性がある。","t":""},{"n":134,"c":2,"s":"関節リウマチの活動性滑膜炎を示唆する局所所見はどれか。","o":["関節周囲の皮膚乾燥と脱毛","関節周囲の感覚低下と冷感","関節周囲の色素沈着と瘢痕","関節周囲の腫脹と熱感"],"a":3,"e":"正解は『関節周囲の腫脹と熱感』である。活動性滑膜炎では関節の腫脹、熱感、圧痛、疼痛などがみられ、運動負荷を調整する判断材料となる。","t":""},{"n":135,"c":2,"s":"病状が安定した関節リウマチ患者に対する全身運動の考え方はどれか。","o":["関節負荷を避けて運動を全面的に中止する","柔軟性運動だけを行って筋収縮を避ける","有酸素運動と筋力運動を個別に調整する","高衝撃運動だけを最大強度で継続する"],"a":2,"e":"正解は『有酸素運動と筋力運動を個別に調整する』である。病状と関節障害に合わせた運動は、体力、筋力、身体機能の維持と改善に役立つ。","t":""},{"n":136,"c":2,"s":"関節リウマチ患者の疲労に対する活動指導として適切なのはどれか。","o":["全作業を一度に行い休息を避ける","作業を分割して計画的に休息を取る","疲労が増えても作業速度を上げ続ける","睡眠時間を減らして活動時間を増やす"],"a":1,"e":"正解は『作業を分割して計画的に休息を取る』である。優先順位を決めて活動と休息を配置するエネルギー節約は、疲労による活動制限を軽減する。","t":""},{"n":137,"c":2,"s":"関節拘縮の説明として適切なのはどれか。","o":["筋力低下だけで自動運動が制限された状態","軟部組織の変化で関節運動が制限された状態","末梢神経障害だけで感覚が低下した状態","心肺機能低下だけで歩行が制限された状態"],"a":1,"e":"正解は『軟部組織の変化で関節運動が制限された状態』である。関節包、靱帯、筋、腱、皮膚などの短縮や癒着により、他動関節可動域も制限される。","t":""},{"n":138,"c":2,"s":"関節を長期間、短縮位で固定した場合に拘縮が生じる機序はどれか。","o":["結合組織が短縮して伸張性が低下する","関節軟骨が増殖して可動性が増加する","靱帯組織が消失して可動性が増加する","骨端線が再開して関節面が拡大する"],"a":0,"e":"正解は『結合組織が短縮して伸張性が低下する』である。不動によって関節包や筋などのコラーゲン配列と架橋が変化し、組織の伸張性が低下する。","t":""},{"n":139,"c":2,"s":"自動関節可動域と他動関節可動域がともに同程度制限されている場合に考えやすい状態はどれか。","o":["筋力低下だけによる運動障害","運動方法の理解不足による障害","意欲低下だけによる運動障害","関節構成体による構造的制限"],"a":3,"e":"正解は『関節構成体による構造的制限』である。他動運動でも同程度に制限される場合は、関節包や筋などの短縮、関節面の変化、疼痛などを検討する。（補足：疼痛は構造的制限ではなく別要因として区別して考える。）","t":"【解説補足】構造的制限と疼痛の区別。"},{"n":140,"c":2,"s":"自動運動が困難な患者に他動関節可動域運動を行う主な目的はどれか。","o":["最大筋力を増加させること","心肺持久力を増加させること","関節の可動性を維持すること","運動技能を自動化させること"],"a":2,"e":"正解は『関節の可動性を維持すること』である。他動運動は筋収縮を必要とせずに関節を動かし、不動による軟部組織の短縮や癒着を予防するために用いる。","t":""},{"n":141,"c":2,"s":"軟部組織の短縮に対する持続伸張の方法として適切なのはどれか。","o":["高負荷を短時間だけ加える","反動を用いて急速に加える","低負荷を比較的長く加える","疼痛を超えて強制的に加える"],"a":2,"e":"正解は『低負荷を比較的長く加える』である。低負荷持続伸張は軟部組織に穏やかな張力を与え、高負荷の急激な伸張より組織損傷を起こしにくい。","t":""},{"n":142,"c":2,"s":"関節可動域運動の強度を決める際の疼痛への対応はどれか。","o":["強い疼痛が出るまで毎回伸張する","疼痛が長く残らない範囲で調整する","疼痛の変化を確認せず一定負荷にする","疼痛が増えても反復回数を増加する"],"a":1,"e":"正解は『疼痛が長く残らない範囲で調整する』である。運動中だけでなく運動後や翌日の疼痛、腫脹、熱感を確認し、組織の刺激性に応じて負荷を変更する。","t":""},{"n":143,"c":2,"s":"関節可動域検査における骨性のエンドフィールはどれか。","o":["硬い骨同士の接触で運動が止まる感触","軟部組織同士の接触で止まる感触","筋や関節包の伸張で止まる感触","疼痛のため抵抗前に止まる感触"],"a":0,"e":"正解は『硬い骨同士の接触で運動が止まる感触』である。骨性エンドフィールは肘関節伸展などでみられ、明瞭で硬い終末感を示す。","t":""},{"n":144,"c":2,"s":"関節可動域検査における空虚性のエンドフィールはどれか。","o":["骨の接触によって運動が止まる感触","筋の伸張によって運動が止まる感触","軟部組織の接触で運動が止まる感触","疼痛のため抵抗前に運動が止まる感触"],"a":3,"e":"正解は『疼痛のため抵抗前に運動が止まる感触』である。明確な組織抵抗に達する前に疼痛で検査を中止するため、炎症や急性損傷などの可能性を検討する。","t":""},{"n":145,"c":2,"s":"固定された凸面上を凹面の関節面が動くとき、骨運動と関節面の滑りとの関係はどれか。","o":["骨運動と滑りが常に直角方向となる","骨運動だけが生じて滑りは生じない","滑りだけが生じて骨運動は生じない","骨運動と滑りが同じ方向となる"],"a":3,"e":"正解は『骨運動と滑りが同じ方向となる』である。凹面が動く場合は、転がりを含む骨運動と関節面の滑りが同方向に生じるという凹凸の法則を用いる。","t":"【修正】固定側が曖昧な表現を修正。"},{"n":146,"c":2,"s":"脛骨が大腿骨上を動く非荷重位で、膝関節伸展を促す脛骨の滑り方向はどれか。","o":["脛骨を内側へ滑らせる","脛骨を後方へ滑らせる","脛骨を前方へ滑らせる","脛骨を外側へ滑らせる"],"a":2,"e":"正解は『脛骨を前方へ滑らせる』である。凹面である脛骨関節面が凸面である大腿骨顆上を動くため、膝伸展に伴う脛骨の骨運動と滑りは前方となる。","t":""},{"n":147,"c":2,"s":"膝関節屈曲拘縮を予防するためのポジショニングはどれか。","o":["膝窩を厚い枕で常時支持する","膝関節を伸展位に近づけて保つ","股関節を最大屈曲位で固定する","足関節を最大底屈位で固定する"],"a":1,"e":"正解は『膝関節を伸展位に近づけて保つ』である。膝屈曲位を長時間続けると後方組織や屈筋群が短縮しやすいため、皮膚状態にも配慮して伸展方向を確保する。","t":""},{"n":148,"c":2,"s":"modified Thomas testで主に評価する関節拘縮はどれか。","o":["股関節の屈曲拘縮","膝関節の伸展拘縮","足関節の背屈拘縮","肩関節の外旋拘縮"],"a":0,"e":"正解は『股関節の屈曲拘縮』である。一側股関節を十分に屈曲して腰椎前弯を抑え、反対側大腿の挙上から股関節屈筋群の短縮を評価する。","t":""},{"n":149,"c":2,"s":"関節可動域運動で目的外の代償運動を抑える方法はどれか。","o":["近位部を固定して運動軸を合わせる","近位部を自由にして反動を利用する","遠位部を固定して全身を回旋させる","体幹を揺らして運動速度を高める"],"a":0,"e":"正解は『近位部を固定して運動軸を合わせる』である。近位関節や体幹を安定させて運動軸を合わせると、対象関節の可動域をより適切に評価し運動できる。","t":""},{"n":150,"c":2,"s":"長期臥床患者の関節拘縮を予防する基本的な対応はどれか。","o":["同一肢位を維持して関節を保護する","早期離床と体位変換と関節運動を行う","筋緊張を高める肢位で終日固定する","疼痛の有無にかかわらず強制伸張する"],"a":1,"e":"正解は『早期離床と体位変換と関節運動を行う』である。不動時間を減らし、良肢位の保持と定期的な自動または他動運動を組み合わせることが拘縮予防の基本となる。","t":""},{"n":151,"c":3,"s":"非特異的腰痛の説明として適切なのはどれか。","o":["原因となる特定の疾患を同定できない腰痛","神経根圧迫を伴う特定の疾患を同定できる腰痛","椎体骨折を伴う特定の疾患を同定できる腰痛","脊椎感染を伴う特定の疾患を同定できる腰痛"],"a":0,"e":"正解は『原因となる特定の疾患を同定できない腰痛』である。非特異的腰痛は、診察や検査で疼痛の原因となる特定の病態を明確に同定できない腰痛を指す。","t":""},{"n":152,"c":3,"s":"腰痛患者において重篤な疾患を疑う危険徴候はどれか。","o":["体位変換で軽くなる局所性の腰痛","運動した後に生じる一過性の腰痛","発熱と安静時にも続く強い腰痛","起床した時だけに生じる軽い腰痛"],"a":2,"e":"正解は『発熱と安静時にも続く強い腰痛』である。発熱を伴い安静でも軽快しない疼痛は、脊椎感染などを疑う危険徴候であり、速やかな医学的評価が必要となる。","t":""},{"n":153,"c":3,"s":"危険徴候のない急性非特異的腰痛に対する生活指導として適切なのはどれか。","o":["数週間にわたり臥床を続けて疼痛を避ける","許容範囲で活動を保ち臥床を短くする","疼痛が消えるまで体幹運動を禁じる","画像診断が済むまで就労を禁じる"],"a":1,"e":"正解は『許容範囲で活動を保ち臥床を短くする』である。長期の臥床は身体機能低下や活動再開の遅延につながるため、可能な範囲で日常活動を継続する。","t":""},{"n":154,"c":3,"s":"慢性非特異的腰痛に対する運動療法の基本方針はどれか。","o":["受動的物理療法だけを長期間継続する","無症状になるまで日常活動を全面休止する","全員に同一種目と同一負荷を処方する","個別化した運動を段階的に継続する"],"a":3,"e":"正解は『個別化した運動を段階的に継続する』である。身体機能、症状、生活目標および本人の希望を踏まえて運動を選び、反応を確認しながら負荷を調整する。","t":""},{"n":155,"c":3,"s":"腰痛の恐怖回避思考を示す認知はどれか。","o":["画像異常がなければ痛みはないと考える","動くと損傷すると考えて活動を避ける","休むと悪化すると考えて運動を増やす","薬を使うと治ると考えて服薬を続ける"],"a":1,"e":"正解は『動くと損傷すると考えて活動を避ける』である。痛みへの過度な恐怖から活動を避けると、廃用や自己効力感の低下を介して機能障害が長期化しやすい。","t":""},{"n":156,"c":3,"s":"反復運動に伴う症状の中央化現象とはどれか。","o":["末梢の症状が反復運動で近位へ移る現象","近位の症状が反復運動で末梢へ移る現象","局所の症状が安静保持で完全に消える現象","反対側の症状が荷重動作で新たに出る現象"],"a":0,"e":"正解は『末梢の症状が反復運動で近位へ移る現象』である。下肢などの遠位症状が腰部方向へ後退する反応を指し、方向特異的運動を検討する際の所見となる。","t":""},{"n":157,"c":3,"s":"慢性腰痛に対する疼痛教育の内容として適切なのはどれか。","o":["痛みは必ず組織損傷量と比例すると教える","痛みが残る間は全活動を避けると教える","画像異常の除去だけが回復条件と教える","痛みの多因子性と安全な活動再開を教える"],"a":3,"e":"正解は『痛みの多因子性と安全な活動再開を教える』である。慢性痛には身体的要因だけでなく心理・社会的要因も関与するため、理解と能動的対処を促す教育が重要となる。","t":""},{"n":158,"c":3,"s":"重量物を床から持ち上げる際の腰部負担を減らす方法はどれか。","o":["荷物を体から離して膝を伸ばして持つ","荷物を横に置いて体幹をひねって持つ","荷物を体に寄せて股関節と膝を使う","荷物を高く上げて腰を反らして持つ"],"a":2,"e":"正解は『荷物を体に寄せて股関節と膝を使う』である。荷物を体に近づけると腰部に生じる外力のモーメントが小さくなり、股関節と膝の使用により負荷を分散できる。","t":""},{"n":159,"c":3,"s":"腰痛予防を目的とした姿勢指導として適切なのはどれか。","o":["腰椎前弯を常に最大に保つこと","骨盤後傾を常に最大に保つこと","同じ姿勢を続けず適宜変えること","胸椎後弯を常に最小に保つこと"],"a":2,"e":"正解は『同じ姿勢を続けず適宜変えること』である。すべての人に共通する唯一の理想姿勢はなく、長時間の静的姿勢を避けて姿勢を変えることが筋疲労の軽減に役立つ。","t":""},{"n":160,"c":3,"s":"腹部ブレーシングの説明として適切なのはどれか。","o":["腹筋を交互収縮させ体幹屈曲を強める方法","腹壁を同時収縮させ体幹剛性を高める方法","腹部を引き込み胸郭挙上を強め続ける方法","呼吸を止め続け腹圧上昇を保ち続ける方法"],"a":1,"e":"正解は『腹壁を同時収縮させ体幹剛性を高める方法』である。腹筋群を協調的に収縮させることで体幹の安定性を高めるが、過度な息こらえを続ける方法ではない。","t":""},{"n":161,"c":3,"s":"腰椎分節の細かな安定化に関与する筋はどれか。","o":["腰部多裂筋","大腿四頭筋","上腕二頭筋","前脛骨筋"],"a":0,"e":"正解は『腰部多裂筋』である。腰部多裂筋は乳頭突起・椎弓から2〜数分節上位の棘突起へ付着して短い分節をまたぎ、腰椎分節の運動制御と安定化に関与する。","t":"【解説修正】付着の記述を解剖学的に修正。"},{"n":162,"c":3,"s":"体幹安定化における横隔膜の役割はどれか。","o":["腰椎を単独で伸展して椎間孔を広げる","骨盤を単独で後傾して脊柱管を狭める","肩甲帯を挙上して頸部負荷を減らす","呼吸と腹圧調整を通じて体幹を支える"],"a":3,"e":"正解は『呼吸と腹圧調整を通じて体幹を支える』である。横隔膜は腹筋群や骨盤底筋群などと協調し、呼吸を保ちながら腹腔内圧と体幹安定性の調整に関与する。","t":""},{"n":163,"c":3,"s":"腰椎椎間板ヘルニアの病態を示す説明はどれか。","o":["椎間板組織が椎間板腔の外へ局所的に転位した状態","椎体終板が椎間板腔の内へ全体的に移動した状態","黄色靱帯が椎間板腔の外へ局所的に骨化した状態","椎間関節が椎間板腔の内へ全体的に脱臼した状態"],"a":0,"e":"正解は『椎間板組織が椎間板腔の外へ局所的に転位した状態』である。線維輪の損傷などに伴って髄核を含む椎間板組織が後方などへ転位し、神経根を刺激することがある。","t":""},{"n":164,"c":3,"s":"腰椎椎間板ヘルニアが好発する椎間高位の組合せはどれか。","o":["L1-L2とL2-L3","L2-L3とL3-L4","L4-L5とL5-S1","L1-L2とL5-S1"],"a":2,"e":"正解は『L4-L5とL5-S1』である。下位腰椎は可動性と力学的負荷が大きく、腰椎椎間板ヘルニアが生じやすい。","t":""},{"n":165,"c":3,"s":"下肢伸展挙上試験で腰仙部神経根の刺激を示唆する所見はどれか。","o":["膝伸展位の股関節伸展で頸部痛が再現する","膝屈曲位の股関節屈曲で腹部痛が再現する","膝屈曲位の股関節外転で鼠径痛が再現する","膝伸展位の股関節屈曲で下肢痛が再現する"],"a":3,"e":"正解は『膝伸展位の股関節屈曲で下肢痛が再現する』である。膝を伸ばしたまま下肢を挙上すると坐骨神経系が緊張し、腰仙部神経根由来の放散痛が誘発されることがある。","t":""},{"n":166,"c":3,"s":"交差性下肢伸展挙上試験の実施方法はどれか。","o":["患側下肢を挙上して患側下肢痛をみる検査","健側下肢を挙上して患側下肢痛をみる検査","患側下肢を伸展して健側下肢痛をみる検査","健側下肢を屈曲して健側下肢痛をみる検査"],"a":1,"e":"正解は『健側下肢を挙上して患側下肢痛をみる検査』である。交差性下肢伸展挙上試験は感度が高い検査ではないが、陽性所見は椎間板ヘルニアによる神経根障害を比較的強く示唆する。","t":""},{"n":167,"c":3,"s":"L5神経根障害で感覚低下が生じやすい領域はどれか。","o":["鼠径部から大腿前面膝上にかけての領域","大腿内側から下腿内側足弓にかけての領域","下腿後面から足外側小趾側にかけての領域","下腿外側から足背母趾側にかけての領域"],"a":3,"e":"正解は『下腿外側から足背母趾側にかけての領域』である。L5神経根障害では下腿外側から足背、特に母趾側に感覚障害が現れやすい。","t":""},{"n":168,"c":3,"s":"S1神経根障害で生じやすい反射所見はどれか。","o":["アキレス腱反射の低下","上腕二頭筋反射の低下","上腕三頭筋反射の低下","橈骨反射の低下"],"a":0,"e":"正解は『アキレス腱反射の低下』である。アキレス腱反射は主にS1神経根を反映するため、その障害では反射の低下または消失がみられる。","t":""},{"n":169,"c":3,"s":"L5神経根障害で生じやすい筋力低下はどれか。","o":["足関節底屈筋力の低下","母趾伸展筋力の低下","膝関節伸展筋力の低下","股関節内転筋力の低下"],"a":1,"e":"正解は『母趾伸展筋力の低下』である。長母趾伸筋はL5髄節の支配を強く受けるため、L5神経根障害を評価する代表的な筋となる。","t":""},{"n":170,"c":3,"s":"腰椎椎間板ヘルニアの一般的な自然経過はどれか。","o":["多くは短期間に完全麻痺への進行が予想される","多くは画像上の突出が徐々に増大すると予想される","多くは保存療法で症状の軽快が期待できる","多くは保存療法で排尿障害の発生が予想される"],"a":2,"e":"正解は『多くは保存療法で症状の軽快が期待できる』である。椎間板ヘルニアは時間とともに縮小することがあり、進行性麻痺などがなければ薬物療法や理学療法などが基本となる。","t":""},{"n":171,"c":3,"s":"腰椎椎間板ヘルニアで緊急評価を要する症状はどれか。","o":["体動時だけ増える軽い腰部痛","新たな尿閉と会陰部の感覚低下","座位後だけ生じる殿部のこわばり","歩行後だけ生じる大腿部の疲労感"],"a":1,"e":"正解は『新たな尿閉と会陰部の感覚低下』である。尿閉や会陰部感覚障害は馬尾症候群を示唆し、神経機能を守るため緊急の医学的評価を要する。","t":""},{"n":172,"c":3,"s":"腰椎MRIで椎間板突出を認めた際の解釈として適切なのはどれか。","o":["画像所見だけで神経障害の重症度まで判断する","画像所見だけで手術適応の必要性まで判断する","画像所見だけで疼痛原因の高位まで判断する","症状と神経所見を画像所見に対応させ判断する"],"a":3,"e":"正解は『症状と神経所見を画像所見に対応させ判断する』である。無症候者にも椎間板の膨隆や突出は認められるため、画像所見だけで症状の原因や治療方針を決定できない。","t":""},{"n":173,"c":3,"s":"腰椎椎間板ヘルニアによる神経根性疼痛の機序はどれか。","o":["神経根の機械的圧迫だけが痛みに関与する","椎体の骨密度低下だけが痛みに関与する","神経根の圧迫と炎症が痛みに関与する","黄色靱帯の骨化だけが痛みに関与する"],"a":2,"e":"正解は『神経根の圧迫と炎症が痛みに関与する』である。突出した椎間板による機械的刺激に加え、椎間板組織に由来する炎症性反応も神経根性疼痛に関与する。","t":""},{"n":174,"c":3,"s":"腰椎椎間板ヘルニアの症状軽快後に行う活動指導はどれか。","o":["症状を確認しながら活動を段階的に戻す","軽いしびれでも活動を恒久的に中止する","症状が消えても臥床時間を段階的に延ばす","再発予防として体幹運動を恒久的に避ける"],"a":0,"e":"正解は『症状を確認しながら活動を段階的に戻す』である。神経症状の変化に注意しつつ日常活動や運動を漸増し、長期的な不活動を避けることが機能回復に重要となる。","t":""},{"n":175,"c":3,"s":"変性性腰部脊柱管狭窄症の病態はどれか。","o":["椎体骨折だけで脊柱管が一時的に広がる","椎間板脱水だけで脊柱管が恒久的に広がる","椎間板膨隆や黄色靱帯肥厚で神経が圧迫される","仙腸関節弛緩や腸腰筋短縮で脊髄が圧迫される"],"a":2,"e":"正解は『椎間板膨隆や黄色靱帯肥厚で神経が圧迫される』である。椎間板、椎間関節および黄色靱帯などの加齢変化により脊柱管が狭くなり、馬尾や神経根が圧迫される。","t":""},{"n":176,"c":3,"s":"神経性間欠跛行の特徴はどれか。","o":["立位や歩行で下肢症状が増え前屈休息で軽くなる","座位や前屈で下肢症状が増え立位保持で軽くなる","臥位や睡眠で下肢症状が増え歩行継続で軽くなる","足関節運動で下肢症状が増え腰椎伸展で軽くなる"],"a":0,"e":"正解は『立位や歩行で下肢症状が増え前屈休息で軽くなる』である。腰椎伸展を伴う立位や歩行で神経圧迫が増し、座位や前屈で脊柱管が広がると症状が軽減しやすい。","t":""},{"n":177,"c":3,"s":"腰椎屈曲が脊柱管に及ぼす影響はどれか。","o":["屈曲で脊柱管が狭くなり神経圧迫が増える","屈曲で脊柱管が広くなり神経圧迫が減る","伸展で脊柱管が広くなり神経圧迫が減る","回旋で脊柱管が広くなり神経圧迫が消える"],"a":1,"e":"正解は『屈曲で脊柱管が広くなり神経圧迫が減る』である。腰椎屈曲では脊柱管や椎間孔の空間が増えるため、腰部脊柱管狭窄症の下肢症状が軽くなることがある。","t":""},{"n":178,"c":3,"s":"腰部脊柱管狭窄症で自転車移動が歩行より容易な理由はどれか。","o":["腰椎伸展位を保ちやすいため歩行より楽である","頸椎伸展位を保ちやすいため歩行より楽である","腰椎回旋位を保つため歩行より楽である","腰椎屈曲位を取りやすく歩行より楽である"],"a":3,"e":"正解は『腰椎屈曲位を取りやすく歩行より楽である』である。自転車では前傾姿勢を取りやすく、脊柱管の狭窄が相対的に軽減されるため運動を継続しやすい。","t":"【修正】誤答ア・イが設問と矛盾する形（「歩行よりつらい」）で機能していなかったため文型を統一。"},{"n":179,"c":3,"s":"血管性間欠跛行を示唆する所見はどれか。","o":["足背動脈の拍動低下が確認される","腰椎前屈で下肢痛が軽くなる","上り坂歩行で下肢痛が軽くなる","自転車駆動で下肢痛が軽くなる"],"a":0,"e":"正解は『足背動脈の拍動低下が確認される』である。末梢動脈疾患では下肢の血流低下により足部の動脈拍動が減弱することがあり、姿勢依存性の神経性間欠跛行との鑑別に役立つ。","t":""},{"n":180,"c":3,"s":"腰部脊柱管狭窄症の馬尾型にみられやすい症状はどれか。","o":["片側の単一神経根領域だけに症状が出る","頸部から片側上肢の根性症状が出る","腰部から片側殿部だけに疼痛が出る","両下肢の多根性症状や会陰部症状が出る"],"a":3,"e":"正解は『両下肢の多根性症状や会陰部症状が出る』である。馬尾型では複数の神経根が障害されるため、両下肢のしびれや脱力、会陰部異常感覚などが生じやすい。","t":""},{"n":181,"c":3,"s":"腰部脊柱管狭窄症で速やかな医学的評価を要する変化はどれか。","o":["短時間の座位で軽い腰痛が出る","長時間の立位で足底が疲れやすい","排尿障害と会陰部感覚低下が新たに出る","前屈休息で下肢痛が速やかに軽くなる"],"a":2,"e":"正解は『排尿障害と会陰部感覚低下が新たに出る』である。膀胱直腸障害や会陰部感覚障害は重度の馬尾障害を示唆し、治療の遅れによって障害が残る可能性がある。","t":""},{"n":182,"c":3,"s":"腰部脊柱管狭窄症患者の有酸素運動として選択しやすいのはどれか。","o":["腰椎伸展を保った連続立位運動","軽度前屈を取りやすい自転車運動","腰椎伸展を反復する背筋運動","頸椎伸展を保った上肢挙上運動"],"a":1,"e":"正解は『軽度前屈を取りやすい自転車運動』である。固定式自転車などは腰椎屈曲位で実施しやすく、神経性間欠跛行がある患者でも運動量を確保しやすい。","t":""},{"n":183,"c":3,"s":"腰部脊柱管狭窄症で歩行器を用いる主な理由はどれか。","o":["体幹伸展を促して脊柱管を狭くするため","体幹回旋を促して椎間孔を狭くするため","骨盤前傾を促して黄色靱帯を厚くするため","体幹前傾を促して神経圧迫を減らすため"],"a":3,"e":"正解は『体幹前傾を促して神経圧迫を減らすため』である。歩行器やシルバーカーへの支持は前傾姿勢を取りやすくし、歩行時の下肢症状を軽減することがある。","t":""},{"n":184,"c":3,"s":"腰部脊柱管狭窄症の画像評価として適切なのはどれか。","o":["MRIの狭窄だけで症状の原因を断定する","画像所見を症状と身体所見に対応させる","単純X線だけで神経圧迫部位を確定する","画像に狭窄があれば全例を手術対象とする"],"a":1,"e":"正解は『画像所見を症状と身体所見に対応させる』である。画像上の狭窄は無症候者にもみられるため、間欠跛行や神経学的所見との整合性を確認する必要がある。","t":""},{"n":185,"c":3,"s":"頸椎症性神経根症の代表的な症状はどれか。","o":["神経根領域に沿う片側上肢痛やしびれ","両下肢の広い領域に生じる痙性麻痺やしびれ","会陰部と両下肢だけに生じる感覚低下やしびれ","胸郭の片側領域に生じる帯状疼痛やしびれ"],"a":0,"e":"正解は『神経根領域に沿う片側上肢痛やしびれ』である。頸椎症によって椎間孔内の神経根が圧迫または刺激されると、その支配領域に疼痛、感覚障害および筋力低下が生じる。","t":""},{"n":186,"c":3,"s":"頸椎症性神経根症で頸椎伸展により症状が増悪しやすい理由はどれか。","o":["頸椎屈曲で椎間孔が狭くなり増悪する","頸椎回旋で脊柱管が広くなり増悪する","頸椎伸展で椎間孔が狭くなり増悪する","胸椎屈曲で椎間孔が広くなり増悪する"],"a":2,"e":"正解は『頸椎伸展で椎間孔が狭くなり増悪する』である。頸椎伸展では椎間孔が狭くなりやすく、骨棘などによる神経根への機械的刺激が増えることがある。","t":""},{"n":187,"c":3,"s":"スパーリングテストの方法と陽性所見の組合せはどれか。","o":["頸椎を屈曲側屈して牽引し腰痛を再現する","頸椎を中間位で圧迫し両下肢痛を再現する","頸椎を伸展・患側へ側屈して圧迫し上肢痛を再現する","頸椎を屈曲回旋して牽引し胸部痛を再現する"],"a":2,"e":"正解は『頸椎を伸展・患側へ側屈して圧迫し上肢痛を再現する』である。椎間孔を狭める方向へ頸椎を動かして軸圧を加え、患側上肢の神経根性症状が再現されるかを確認する。","t":"【修正】側屈方向（患側）を明記。"},{"n":188,"c":3,"s":"C6神経根障害でみられやすい所見の組合せはどれか。","o":["母指側の感覚低下と上腕二頭筋反射低下","中指側の感覚低下と上腕三頭筋反射低下","小指側の感覚低下と膝蓋腱反射低下","足外側の感覚低下とアキレス腱反射低下"],"a":0,"e":"正解は『母指側の感覚低下と上腕二頭筋反射低下』である。C6神経根障害では母指側の感覚障害に加え、上腕二頭筋反射や腕橈骨筋反射の低下がみられることがある。なお上腕二頭筋反射はC5・C6の両方が関与し（国内ではC5として扱うことも多い）、C6をより反映するのは腕橈骨筋反射である。","t":"【解説補足】反射の髄節レベル。"},{"n":189,"c":3,"s":"C7神経根障害でみられやすい所見の組合せはどれか。","o":["母指の感覚低下と上腕二頭筋反射低下","小指の感覚低下と尺側手根屈筋力低下","足背の感覚低下と前脛骨筋力低下","中指の感覚低下と上腕三頭筋反射低下"],"a":3,"e":"正解は『中指の感覚低下と上腕三頭筋反射低下』である。C7神経根障害では中指周辺の感覚障害、上腕三頭筋の筋力低下および同筋反射の低下が生じやすい。","t":""},{"n":190,"c":3,"s":"頸椎症性脊髄症でみられやすい所見はどれか。","o":["患側上肢の腱反射低下と弛緩性歩行がみられる","四肢の腱反射亢進と痙性歩行がみられる","両下肢の腱反射消失と失調性歩行がみられる","片側下肢の腱反射低下と鶏歩がみられる"],"a":1,"e":"正解は『四肢の腱反射亢進と痙性歩行がみられる』である。頸髄の圧迫では上位運動ニューロン徴候が生じ、腱反射亢進、下肢のこわばりおよび痙性歩行が現れる。ただし圧迫高位の反射は低下し、それより下位で亢進することがある（逆転反射）。","t":"【解説補足】逆転反射。"},{"n":191,"c":3,"s":"頸椎症性脊髄症の手指巧緻運動障害を示す訴えはどれか。","o":["ボタン操作や箸操作が不器用になる","片脚立位で殿部痛だけが強くなる","歩行休止で下腿痛だけが軽くなる","食後に季肋部痛だけが強くなる"],"a":0,"e":"正解は『ボタン操作や箸操作が不器用になる』である。頸髄障害では手指の細かな運動が低下し、書字、箸の使用、ボタンの着脱などが難しくなる。","t":""},{"n":192,"c":3,"s":"頸椎症性脊髄症で上位運動ニューロン障害を示唆する所見はどれか。","o":["ティネル徴候","ファレン徴候","ホフマン反射","トンプソン徴候"],"a":2,"e":"正解は『ホフマン反射』である。ホフマン反射は錐体路障害を示唆する病的反射であるが、単独ではなく他の神経学的所見と合わせて解釈する。","t":""},{"n":193,"c":3,"s":"頸椎症性脊髄症に特徴的な歩行の訴えはどれか。","o":["歩隔が広がり下肢が弛緩する歩行","下肢がこわばり脚がもつれる歩行","体幹前傾で下肢痛が消える歩行","足関節底屈で腰痛が消える歩行"],"a":1,"e":"正解は『下肢がこわばり脚がもつれる歩行』である。頸髄圧迫による痙性と運動制御障害により、脚が突っ張る、もつれる、階段で手すりが必要になるなどの変化が生じる。","t":""},{"n":194,"c":3,"s":"頸椎症性脊髄症の診断に関する説明はどれか。","o":["MRIの脊髄圧迫像だけを根拠として診断する","単純X線の骨棘形成だけを根拠として診断する","年齢と頸部痛の程度だけを根拠として診断する","症状と神経所見を画像所見に対応させ診断する"],"a":3,"e":"正解は『症状と神経所見を画像所見に対応させ診断する』である。無症候者にも頸椎の変性や脊髄圧迫像がみられるため、巧緻運動障害、歩行障害、反射所見などとの一致が重要となる。","t":""},{"n":195,"c":3,"s":"理学療法中に頸椎症性脊髄症の症状が進行した場合の対応はどれか。","o":["頸椎への強い徒手操作を反復する","運動を中断して速やかに医師へ相談する","頸椎伸展運動を高負荷で継続する","症状を無視して歩行負荷を増やす"],"a":1,"e":"正解は『運動を中断して速やかに医師へ相談する』である。筋力低下、巧緻運動障害または歩行障害の進行は脊髄障害の悪化を示すため、運動を継続せず医学的評価につなげる。","t":""},{"n":196,"c":3,"s":"深部頸屈筋の運動方法として適切なのはどれか。","o":["頭部を大きく持ち上げ胸鎖乳突筋を強く使う","頸椎を最大伸展して僧帽筋上部を強く使う","軽い頷き動作で深部頸屈筋を穏やかに使う","肩甲帯を最大挙上して肩甲挙筋を強く使う"],"a":2,"e":"正解は『軽い頷き動作で深部頸屈筋を穏やかに使う』である。頭長筋や頸長筋を低負荷で活動させ、胸鎖乳突筋など表層筋の過剰な代償を抑える。","t":""},{"n":197,"c":3,"s":"頸部負担を減らすパソコン作業環境はどれか。","o":["画面を頭上に置き頸椎伸展を保つ","画面を足元に置き頸椎屈曲を保つ","画面を側方に置き頸椎回旋を保つ","画面を正面に置き姿勢を適宜変える"],"a":3,"e":"正解は『画面を正面に置き姿勢を適宜変える』である。画面を見やすい高さの正面に配置し、休憩や姿勢変換を取り入れることで持続的な頸椎屈曲、伸展および回旋を減らせる。","t":""},{"n":198,"c":3,"s":"脊椎疾患に対する運動負荷の進め方として適切なのはどれか。","o":["症状と機能を確認しながら負荷を漸増する","軽い疼痛があれば全運動を永久に中止する","神経症状が増えても同じ負荷を継続する","回復に関係なく毎回最大負荷まで増量する"],"a":0,"e":"正解は『症状と機能を確認しながら負荷を漸増する』である。疼痛、神経症状、運動後の反応および動作能力を評価し、安全な範囲で運動量や難度を段階的に高める。","t":""},{"n":199,"c":3,"s":"慢性腰痛患者に活動のペーシングを指導する内容はどれか。","o":["好調日に活動を一気に増やし翌日は休む","疼痛が出るまで活動を続け長く臥床する","毎日同じ最大負荷で活動し休憩を避ける","活動と休憩を計画し負荷の波を小さくする"],"a":3,"e":"正解は『活動と休憩を計画し負荷の波を小さくする』である。ペーシングは過活動と長い休息を繰り返す状態を避け、持続可能な活動量を計画的に積み上げる方法である。","t":""},{"n":200,"c":3,"s":"脊椎疾患患者の自己管理を促す生活指導はどれか。","o":["再発時は全例で長期臥床を始める","危険徴候を理解し活動を自己調整する","疼痛時は全例で自己牽引を強く行う","画像所見だけを基に活動量を決める"],"a":1,"e":"正解は『危険徴候を理解し活動を自己調整する』である。排尿・排便障害、会陰部感覚低下、進行する筋力低下などを理解させるとともに、通常は症状に応じて安全に活動量を調整できるよう支援する。","t":""},{"n":201,"c":4,"s":"開放骨折の定義として正しいのはどれか。","o":["骨折線が関節面まで達している骨折","骨片同士が互いに食い込んでいる骨折","骨折部が創を介して外界と通じる骨折","骨折線が骨端線に沿って走っている骨折"],"a":2,"e":"正解は『骨折部が創を介して外界と通じる骨折』である。骨が創外に見えなくても、骨折部と外界に交通があれば開放骨折に該当する。感染リスクが高いため、早期の専門的処置を要する。","t":""},{"n":202,"c":4,"s":"疲労骨折の発生機序として正しいのはどれか。","o":["正常な骨に反復負荷が加わって生じる骨折","脆弱な骨に軽微な外力が加わって生じる骨折","骨端部に牽引力が加わって生じる骨折","骨髄内に感染が広がって生じる骨折"],"a":0,"e":"正解は『正常な骨に反復負荷が加わって生じる骨折』である。疲労骨折は、骨の修復能力を上回る反復性の力学的負荷によって生じる。脆弱化した骨に通常の負荷で生じる骨折は脆弱性骨折である。","t":""},{"n":203,"c":4,"s":"病的骨折の説明として正しいのはどれか。","o":["健常骨に一回の非常に強い外力が作用して生じる骨折","健常骨に反復する小外力が作用して生じる骨折","骨端部に筋腱の牽引力が作用して生じる骨折","腫瘍などで弱化した骨に軽微な外力で生じる骨折"],"a":3,"e":"正解は『腫瘍などで弱化した骨に軽微な外力で生じる骨折』である。病的骨折は、腫瘍や感染などの局所病変によって強度が低下した骨に生じる。健常骨への反復負荷による骨折は疲労骨折である。（補足：骨粗鬆症による骨折は通常「脆弱性骨折」として区別するが、教科書により病的骨折に含める記載もある。）","t":"【解説補足】病的骨折と脆弱性骨折の線引き。"},{"n":204,"c":4,"s":"裂離骨折の形態として正しいのはどれか。","o":["骨片同士が軸方向に食い込んだ骨折","筋腱の牽引で付着部が離れた骨折","骨幹部が複数の骨片に砕けた骨折","骨折面が長軸に直角に走った骨折"],"a":1,"e":"正解は『筋腱の牽引で付着部が離れた骨折』である。裂離骨折は、筋や腱、靱帯に加わる牽引力によって付着部の骨片が引き離される骨折である。成長期の骨端部などでみられる。","t":""},{"n":205,"c":4,"s":"らせん骨折の骨折線の特徴として正しいのはどれか。","o":["骨長軸の周囲をらせん状に走る","骨長軸に対してほぼ直角に走る","骨長軸に対して斜め直線状に走る","骨幹部で複数方向へ不規則に走る"],"a":0,"e":"正解は『骨長軸の周囲をらせん状に走る』である。らせん骨折は主にねじり力で生じ、骨折線が骨の周囲を回るように走行する。横骨折は骨長軸にほぼ直角の骨折線を示す。","t":""},{"n":206,"c":4,"s":"粉砕骨折の形態として正しいのはどれか。","o":["骨折線が一本で二骨片に分かれる骨折","骨片が相互に圧入して短縮する骨折","骨が三つ以上の骨片に分かれる骨折","骨皮質の一側だけが折れ曲がる骨折"],"a":2,"e":"正解は『骨が三つ以上の骨片に分かれる骨折』である。粉砕骨折では複数の骨折線によって三つ以上の骨片が形成される。高エネルギー外傷では軟部組織損傷も併せて評価する。なおAO分類では、第3骨片（蝶形骨片）を伴う楔状骨折は多骨片骨折と区別される。","t":"【解説補足】AO分類。"},{"n":207,"c":4,"s":"嵌入骨折の説明として正しいのはどれか。","o":["骨片が関節面から外側へ外れる骨折","一方の骨片が他方の骨片へ入り込む骨折","骨片が筋腱に引かれて遠位へ移動する骨折","骨皮質の連続性を一部残して曲がる骨折"],"a":1,"e":"正解は『一方の骨片が他方の骨片へ入り込む骨折』である。嵌入骨折は軸圧によって骨片同士が食い込み、見かけ上の短縮を伴うことがある。不全骨折とは骨の連続性が一部保たれた骨折をいう。","t":""},{"n":208,"c":4,"s":"関節内骨折の整復で特に重視するのはどれか。","o":["骨幹部の弯曲と短縮の軽減","皮下組織の腫脹と熱感の軽減","隣接筋群の緊張と圧痛の軽減","関節面の適合性と段差の軽減"],"a":3,"e":"正解は『関節面の適合性と段差の軽減』である。関節内骨折では関節面の不整が荷重分布を乱し、外傷後関節症の要因となる。整復では関節面の適合性と関節軸の回復が重要である。","t":""},{"n":209,"c":4,"s":"転位骨折における転位の意味として正しいのはどれか。","o":["骨折部に多量の血腫が形成された状態","骨片の位置関係が正常からずれた状態","骨折線が関節包内に限局した状態","骨皮質の連続性が一部残った状態"],"a":1,"e":"正解は『骨片の位置関係が正常からずれた状態』である。転位には側方移動、角状変形、短縮、回旋などが含まれる。血腫形成の有無を表す用語ではない。","t":""},{"n":210,"c":4,"s":"Salter-Harris分類の2型に該当するのはどれか。","o":["骨端線と骨幹端に骨折線が及ぶ損傷","骨端線と骨端部に骨折線が及ぶ損傷","骨端線だけに骨折線が限局する損傷","骨幹端だけに骨折線が限局する損傷"],"a":0,"e":"正解は『骨端線と骨幹端に骨折線が及ぶ損傷』である。Salter-Harris分類の2型は骨端線から骨幹端へ骨折線が延びる。3型は骨端線から骨端部へ及び、関節面を含む。","t":""},{"n":211,"c":4,"s":"開放骨折の初期治療で感染対策として重要なのはどれか。","o":["早期の温熱療法と持続的な関節運動","早期の徒手整復と長期的な強固な圧迫包帯","早期の局所注射と創部の一次縫合","早期の抗菌薬投与と適切なデブリドマン"],"a":3,"e":"正解は『早期の抗菌薬投与と適切なデブリドマン』である。開放骨折では創が細菌に汚染されているため、静脈内抗菌薬と壊死・汚染組織の除去が感染予防の基本となる。骨折の安定化と軟部組織管理も並行して行う。","t":""},{"n":212,"c":4,"s":"閉鎖整復の説明として正しいのはどれか。","o":["骨折部を切開し骨片を直視下で戻す方法","創外からピンを挿入し骨片を固定する方法","切開せず徒手操作などで骨片を戻す方法","髄腔内に金属釘を入れて骨片を固定する方法"],"a":2,"e":"正解は『切開せず徒手操作などで骨片を戻す方法』である。閉鎖整復は骨折部を外科的に展開せず、徒手操作や牽引によってアライメントを回復させる。整復後は画像と神経血管所見を確認する。","t":""},{"n":213,"c":4,"s":"観血的整復内固定術の説明として正しいのはどれか。","o":["骨折部を展開して整復し体内の器具で固定する方法","骨折部を展開せず持続牽引だけで骨片を整復する方法","骨折部を創外の装具だけで保持する方法","骨折部を運動させながら自然整復を待つ方法"],"a":0,"e":"正解は『骨折部を展開して整復し体内の器具で固定する方法』である。観血的整復内固定術では骨折部を手術で整復し、プレートやスクリューなどで固定する。固定性が得られれば、許容範囲内で早期運動を進めやすい。","t":""},{"n":214,"c":4,"s":"創外固定の特徴として正しいのはどれか。","o":["髄腔内だけに器具を留置して固定する方法","骨に刺入したピンを体外のフレームで連結する方法","骨膜上に置いた長いプレートで骨片を直接圧迫する方法","皮膚の上からギプスだけで全周固定する方法"],"a":1,"e":"正解は『骨に刺入したピンを体外のフレームで連結する方法』である。創外固定は骨に刺入したピンやワイヤーを体外のフレームで連結して安定性を得る。重度の軟部組織損傷や段階的治療で用いられる。","t":""},{"n":215,"c":4,"s":"髄内釘固定の特徴として正しいのはどれか。","o":["関節面を横断するワイヤーだけで骨片を固定する","骨表面を覆う装具だけで骨幹部を固定する","骨髄腔内に金属釘を通して骨幹部を固定する","骨片間を縫合糸だけで直接固定する"],"a":2,"e":"正解は『骨髄腔内に金属釘を通して骨幹部を固定する』である。髄内釘は長管骨の髄腔内に挿入され、骨幹部骨折の安定化に用いられる。横止めスクリューは回旋や短縮の制御に役立つ。","t":""},{"n":216,"c":4,"s":"橋渡しプレート固定の考え方として正しいのはどれか。","o":["全骨片を広く展開し骨折線ごとに直接圧迫する","中間骨片を除去し骨欠損の拡大を図る","関節を横断し永久的な不動化を図る","中間骨片を温存し主要骨片間を橋渡しする"],"a":3,"e":"正解は『中間骨片を温存し主要骨片間を橋渡しする』である。橋渡しプレートは粉砕部を直接整復せず、主要骨片間の長さ・軸・回旋を整えて相対的安定性を得る。中間骨片周囲の血行を温存しやすい。","t":""},{"n":217,"c":4,"s":"一次性骨癒合が生じやすい固定環境はどれか。","o":["大きな骨片間隙と高い可動性が持続する環境","適度な骨片間運動と仮骨形成がある環境","骨片間隙が小さく絶対的安定性がある環境","固定を行わず大きな回旋変位を許す環境"],"a":2,"e":"正解は『骨片間隙が小さく絶対的安定性がある環境』である。一次性骨癒合は骨片間のひずみが小さい絶対的安定性のもとで生じ、目立つ仮骨形成は少ない。圧迫プレートなどがこの環境を目指す。","t":""},{"n":218,"c":4,"s":"二次性骨癒合の特徴として正しいのはどれか。","o":["骨折部に仮骨を形成せず直接再構築する","血腫から軟性仮骨と硬性仮骨を形成する","骨折部の血流を完全に遮断して修復する","関節軟骨だけを介して骨片を連結する"],"a":1,"e":"正解は『血腫から軟性仮骨と硬性仮骨を形成する』である。二次性骨癒合では炎症期を経て軟性仮骨、硬性仮骨が形成され、その後リモデリングが進む。相対的安定性のもとでみられる骨癒合形式である。","t":""},{"n":219,"c":4,"s":"遷延癒合の説明として正しいのはどれか。","o":["骨癒合は進行しているが通常より遅い状態","変形を残して骨癒合が完成した状態","骨癒合後に再び同部位を骨折した状態","骨癒合が得られず関節面の脱臼を伴う状態"],"a":0,"e":"正解は『骨癒合は進行しているが通常より遅い状態』である。遷延癒合では治癒過程は継続しているものの、骨折型や部位から期待される時期より骨癒合が遅れている。偽関節では治癒過程が停止し、追加介入なしの癒合が期待しにくい。","t":""},{"n":220,"c":4,"s":"偽関節の説明として正しいのはどれか。","o":["骨癒合後に関節可動域だけが低下した状態","骨癒合前に筋力と関節可動域が一時的に低下した状態","骨癒合中に骨折部の腫脹だけが残る状態","骨癒合が停止し追加介入なしでは癒合しにくい状態"],"a":3,"e":"正解は『骨癒合が停止し追加介入なしでは癒合しにくい状態』である。偽関節は骨折の治癒過程が停止し、そのままでは骨癒合を期待しにくい状態をいう。遷延癒合では遅くても治癒過程は進行している。","t":""},{"n":221,"c":4,"s":"変形治癒の説明として正しいのはどれか。","o":["短縮や角状変形などを残して癒合した状態","骨片間に仮骨が形成され始めた状態","固定材料の周囲に感染を生じた状態","骨折部の疼痛と腫脹だけが長期間残った状態"],"a":0,"e":"正解は『短縮や角状変形などを残して癒合した状態』である。変形治癒では骨癒合は得られているが、長さ、角度、回旋などのアライメント異常が残る。変形の部位と程度により関節運動や歩行へ影響する。","t":""},{"n":222,"c":4,"s":"Colles骨折の典型的な転位方向はどれか。","o":["橈骨遠位骨片が掌側へ転位する","尺骨遠位骨片が掌側へ転位する","橈骨遠位骨片が背側へ転位する","尺骨遠位骨片が背側へ転位する"],"a":2,"e":"正解は『橈骨遠位骨片が背側へ転位する』である。Colles骨折は橈骨遠位端骨折のうち、遠位骨片が背側へ転位または傾斜する型である。掌側へ転位する型はSmith骨折と呼ばれる。","t":""},{"n":223,"c":4,"s":"Smith骨折の典型的な転位方向はどれか。","o":["橈骨遠位骨片が近位へ転位する","尺骨遠位骨片が遠位へ転位する","尺骨遠位骨片が背側へ転位する","橈骨遠位骨片が掌側へ転位する"],"a":3,"e":"正解は『橈骨遠位骨片が掌側へ転位する』である。Smith骨折は橈骨遠位端骨折のうち、遠位骨片が掌側へ転位する型である。背側転位を示すColles骨折とは転位方向が異なる。","t":""},{"n":224,"c":4,"s":"舟状骨近位部骨折で骨癒合障害が起こりやすい理由はどれか。","o":["近位部が関節包外にあり荷重をほとんど受けないため","近位部が遠位側からの逆行性血流に依存するため","近位部に多数の筋腱が直接付着しているため","近位部が尺骨動脈だけから血流を受けるため"],"a":1,"e":"正解は『近位部が遠位側からの逆行性血流に依存するため』である。舟状骨の主要血流は遠位部から骨内を近位方向へ流れるため、近位骨片では虚血が起こりやすい。近位部骨折では骨壊死、遷延癒合、偽関節に注意する。","t":""},{"n":225,"c":4,"s":"上腕骨骨幹部骨折で特に損傷に注意する神経はどれか。","o":["正中神経の損傷","尺骨神経の損傷","腋窩神経の損傷","橈骨神経の損傷"],"a":3,"e":"正解は『橈骨神経の損傷』である。橈骨神経は上腕骨骨幹部の後面を走行するため、同部の骨折に合併しやすい。手関節や手指の伸展、手背橈側の感覚を確認する。","t":""},{"n":226,"c":4,"s":"小児の上腕骨顆上骨折で特に循環障害に注意する血管はどれか。","o":["上腕動脈の損傷","腋窩動脈の損傷","橈骨動脈の損傷","尺骨動脈の損傷"],"a":0,"e":"正解は『上腕動脈の損傷』である。上腕骨顆上部の前方には上腕動脈が位置し、転位骨折で損傷や圧迫を受けることがある。末梢の脈拍、皮膚色、温度、毛細血管再充満を評価する。","t":""},{"n":227,"c":4,"s":"Garden分類4型の大腿骨頚部骨折の特徴はどれか。","o":["不完全骨折で外反嵌入を示す状態","完全転位し骨頭と頚部の連続性を失う状態","完全骨折だが転位を認めない状態","完全骨折で部分的な転位を示す状態"],"a":1,"e":"正解は『完全転位し骨頭と頚部の連続性を失う状態』である。Garden分類4型は完全骨折かつ完全転位で、骨頭と頚部の連続性を失う。転位した関節包内骨折では骨頭血流の障害が問題となる。","t":"【修正】誤答エが自己矛盾した文であったため修正（Garden 3型に相当）。"},{"n":228,"c":4,"s":"大腿骨転子部骨折の解剖学的な特徴はどれか。","o":["股関節包内に生じる大腿骨頭の骨折","股関節包内に生じる頚部の骨折","股関節包外に生じる転子部の骨折","股関節包外に生じる骨盤の骨折"],"a":2,"e":"正解は『股関節包外に生じる転子部の骨折』である。大腿骨転子部骨折は関節包外骨折で、頚部骨折とは血行や骨癒合の条件が異なる。治療後は固定性と指示された荷重条件に合わせて離床を進める。","t":""},{"n":229,"c":4,"s":"遠位脛腓靱帯結合の主な役割として正しいのはどれか。","o":["膝蓋骨を大腿骨滑車内に保持する","遠位脛腓骨間を保ち足関節窩を安定させる","距骨下関節の内外反運動を強固に固定する","足趾屈筋腱を内果後方に保持する"],"a":1,"e":"正解は『遠位脛腓骨間を保ち足関節窩を安定させる』である。遠位脛腓靱帯結合は脛骨と腓骨の間隔を保ち、距骨を受ける足関節窩の安定性に寄与する。損傷や離開は足関節の不安定性につながる。","t":""},{"n":230,"c":4,"s":"外傷性肩関節脱臼で最も多い方向はどれか。","o":["上方へ脱臼する型","下方へ脱臼する型","後方へ脱臼する型","前方へ脱臼する型"],"a":3,"e":"正解は『前方へ脱臼する型』である。外傷性肩関節脱臼では前方脱臼が大部分を占め、外転・外旋方向の外力などで生じる。整復後は再脱臼を招く肢位と組織治癒を考慮して運動を進める。","t":""},{"n":231,"c":4,"s":"Bankart損傷の説明として正しいのはどれか。","o":["上腕骨頭後外側の圧迫骨折","上腕二頭筋長頭腱の中央部断裂","関節窩前下方の関節唇損傷","肩峰外側端の裂離骨折"],"a":2,"e":"正解は『関節窩前下方の関節唇損傷』である。Bankart損傷は前方脱臼に伴う関節窩前下方の関節唇と関節包の損傷である。反復性前方不安定症の重要な病変となる。","t":""},{"n":232,"c":4,"s":"Hill-Sachs損傷の説明として正しいのはどれか。","o":["上腕骨頭後外側に生じる圧迫骨折","関節窩前下方に生じる関節唇断裂","上腕骨大結節に生じる裂離骨折","肩鎖関節上方に生じる靱帯断裂"],"a":0,"e":"正解は『上腕骨頭後外側に生じる圧迫骨折』である。Hill-Sachs損傷は前方脱臼時に上腕骨頭後外側が関節窩前縁へ衝突して生じる陥凹性骨病変である。病変の大きさや位置は反復不安定性に関係する。","t":""},{"n":233,"c":4,"s":"股関節後方脱臼で典型的にみられる患肢肢位はどれか。","o":["股関節の屈曲・内転・内旋位","股関節の屈曲・外転・外旋位","股関節の伸展・内転・外旋位","股関節の伸展・外転・内旋位"],"a":0,"e":"正解は『股関節の屈曲・内転・内旋位』である。股関節後方脱臼では大腿骨頭が寛骨臼の後方へ外れ、患肢は典型的に屈曲・内転・内旋位をとる。坐骨神経障害の有無も確認する。","t":""},{"n":234,"c":4,"s":"外傷性膝蓋骨脱臼で最も多い方向はどれか。","o":["膝蓋骨が内側へ外れる方向","膝蓋骨が外側へ外れる方向","膝蓋骨が近位へ外れる方向","膝蓋骨が遠位へ外れる方向"],"a":1,"e":"正解は『膝蓋骨が外側へ外れる方向』である。外傷性膝蓋骨脱臼の多くは外側脱臼で、内側膝蓋大腿靱帯などが損傷しうる。整復後は腫脹、可動域、大腿四頭筋機能、再発不安感を評価する。","t":""},{"n":235,"c":4,"s":"亜脱臼の定義として正しいのはどれか。","o":["関節面の接触が完全に失われた状態","骨折部が創を介して外界と通じる状態","関節面が癒合して可動性を失った状態","関節面の接触が一部残ってずれた状態"],"a":3,"e":"正解は『関節面の接触が一部残ってずれた状態』である。亜脱臼では関節面の適合性は低下するが、関節面同士の接触が一部保たれる。脱臼では関節面の接触が完全に失われる。","t":""},{"n":236,"c":4,"s":"骨折や脱臼の整復前後に必ず比較して記録する所見はどれか。","o":["周径と皮下脂肪厚の所見","筋量と骨密度だけの所見","末梢の神経機能と循環の所見","全身持久力と呼吸数だけの所見"],"a":2,"e":"正解は『末梢の神経機能と循環の所見』である。整復操作や固定によって神経血管障害が新たに生じたり悪化したりする可能性がある。運動、感覚、脈拍、皮膚色、温度などを整復前後で比較する。","t":""},{"n":237,"c":4,"s":"急性コンパートメント症候群を疑う早期所見はどれか。","o":["患部を挙上すると完全に消える軽い疼痛","他動的な筋伸張で増悪する強い疼痛","運動後だけに生じる左右対称の筋疲労","安静時に限って改善する軽い皮膚掻痒"],"a":1,"e":"正解は『他動的な筋伸張で増悪する強い疼痛』である。筋区画内圧が上昇すると毛細血管灌流が障害され、筋を他動的に伸張した際の強い疼痛が早期にみられる。末梢動脈の拍動があっても本症は否定できず、緊急対応を要する。","t":""},{"n":238,"c":4,"s":"外傷後の複合性局所疼痛症候群を疑う所見はどれか。","o":["損傷範囲に一致する軽い圧痛と筋痛だけがある","運動時だけに左右対称の筋痛が生じる","不釣り合いな疼痛と浮腫や発汗変化がある","固定部位だけに一過性の圧痕が生じる"],"a":2,"e":"正解は『不釣り合いな疼痛と浮腫や発汗変化がある』である。複合性局所疼痛症候群では、原因事象に不釣り合いな持続痛に加えて感覚、血管運動、発汗・浮腫、運動・栄養の異常がみられる。早期認識と適切な疼痛管理、段階的な運動が重要である。","t":""},{"n":239,"c":4,"s":"免荷の指示を受けた患肢の扱いとして正しいのはどれか。","o":["患肢へ体重をかけずに移動する","患肢へ体重の半分だけをかける","疼痛のない範囲で全体重をかける","立位時だけ患肢へ全体重をかける"],"a":0,"e":"正解は『患肢へ体重をかけずに移動する』である。免荷では患肢に体重を負荷せず、松葉杖や歩行器などで支持する。足を床へ置くことの可否は、接地を含む具体的な指示に従う。","t":""},{"n":240,"c":4,"s":"部分荷重の説明として正しいのはどれか。","o":["患肢を床から完全に離して荷重をゼロにする","患肢へ常に全体重をかけて歩行する","疼痛に関係なく最大荷重を反復する","指示された範囲に患肢荷重量を制限する"],"a":3,"e":"正解は『指示された範囲に患肢荷重量を制限する』である。部分荷重では体重の割合や荷重量など、治療者が定めた上限内で患肢へ荷重する。体重計などを使った練習は荷重量の感覚学習に役立つ。","t":""},{"n":241,"c":4,"s":"疼痛許容荷重の説明として正しいのはどれか。","o":["疼痛があっても規定量まで必ず荷重する","患肢を床へ接触させず完全に免荷する","症状と指示が許す範囲で患肢へ荷重する","健側と同じ床反力になるまで荷重する"],"a":2,"e":"正解は『症状と指示が許す範囲で患肢へ荷重する』である。疼痛許容荷重では、医師の指示を前提に疼痛や反応をみながら患者が許容できる範囲で荷重量を調整する。固定性や骨癒合を無視して自己判断で増量するものではない。","t":""},{"n":242,"c":4,"s":"全荷重の指示が意味する内容として正しいのはどれか。","o":["患肢の足底接地だけが例外的に許可される状態","患肢へ体重の四分の一をかける状態","患肢へ体重の半分までかける状態","患肢へ全体重をかけることが許可される状態"],"a":3,"e":"正解は『患肢へ全体重をかけることが許可される状態』である。全荷重は患肢に全体重を負荷することが許可された段階を表す。ただし、筋力やバランスが不十分なら安全のため歩行補助具を併用する。","t":""},{"n":243,"c":4,"s":"片側下肢痛のある患者が一本杖を使う基本的な持ち方はどれか。","o":["患側上肢で杖を持って使用する","健側上肢で杖を持って使用する","両上肢で一本の杖を持って使用する","左右交互に杖を持ち替えて使用する"],"a":1,"e":"正解は『健側上肢で杖を持って使用する』である。一本杖を健側で持つと、杖の支持力が患側股関節外転筋モーメントを補助し、患側下肢への負担を減らしやすい。歩行では杖と患肢をおおむね同時に前へ出す。","t":""},{"n":244,"c":4,"s":"松葉杖で階段昇降を行う基本手順として正しいのはどれか。","o":["上りは非患肢から、下りは杖と患肢から進む","上りは杖と患肢から、下りは非患肢から進む","上りも下りも患肢だけを先に進める","上りも下りも非患肢だけを先に進める"],"a":0,"e":"正解は『上りは非患肢から、下りは杖と患肢から進む』である。上りでは非患肢で身体を持ち上げ、その後に杖と患肢を同じ段へ運ぶ。下りでは杖と患肢を先に下段へ移し、非患肢を続ける。","t":""},{"n":245,"c":4,"s":"歩行器を用いた部分荷重歩行の基本的な順序はどれか。","o":["非患肢、歩行器、患肢の順に進める","患肢、非患肢、歩行器の順に進める","非患肢、患肢、歩行器の順に進める","歩行器、患肢、非患肢の順に進める"],"a":3,"e":"正解は『歩行器、患肢、非患肢の順に進める』である。まず歩行器で支持基底面を前方へ作り、次に患肢を出して上肢で荷重量を調整する。最後に非患肢を進めることで安定性を保ちやすい。","t":""},{"n":246,"c":4,"s":"等尺性運動の説明として正しいのはどれか。","o":["関節を大きく動かしながら筋を伸張する運動","関節運動を伴わず筋張力を発揮する運動","外力だけで関節可動域を広げる運動","反動を用いて関節終末域まで動かす運動"],"a":1,"e":"正解は『関節運動を伴わず筋張力を発揮する運動』である。等尺性運動は筋長と関節角度の大きな変化を伴わずに筋収縮を行う。関節運動が制限される時期の筋活動維持に利用できるが、実施可否は固定性と組織損傷に従う。","t":""},{"n":247,"c":4,"s":"自動介助運動の説明として正しいのはどれか。","o":["患者の筋収縮に外力の補助を加える運動","患者が力を抜き外力だけで動かす運動","患者が外力なしで全可動域を動かす運動","患者が抵抗に抗して関節を動かす運動"],"a":0,"e":"正解は『患者の筋収縮に外力の補助を加える運動』である。自動介助運動では患者自身の筋収縮に、治療者や健側上肢、器具などの補助を加える。完全な他動運動や抵抗運動とは異なる。","t":""},{"n":248,"c":4,"s":"骨折固定後の関節可動域練習を進める原則として正しいのはどれか。","o":["固定性を確認せず関節終末域まで強制的に動かす","腫脹が増えても同じ強度を維持する","固定性と治療上の制限内で段階的に進める","骨癒合完成まで隣接関節も動かさない"],"a":2,"e":"正解は『固定性と治療上の制限内で段階的に進める』である。可動域練習は骨折型、固定法、軟部組織損傷、医師の制限を踏まえて開始時期と範囲を決める。過度な疼痛や腫脹の増加は負荷を再評価する所見となる。","t":""},{"n":249,"c":4,"s":"外傷後の筋力増強を進める方法として適切なのはどれか。","o":["代償動作が増えても負荷を急増させる","治癒と運動の質を確認して負荷を漸増する","疼痛や腫脹に関係なく最大収縮を反復する","固定部に動揺があっても抵抗運動を続ける"],"a":1,"e":"正解は『治癒と運動の質を確認して負荷を漸増する』である。筋力増強は骨・軟部組織の治癒、固定性、疼痛、腫脹、代償動作を確認しながら段階的に進める。負荷後に症状が持続的に増悪する場合は内容を見直す。","t":""},{"n":250,"c":4,"s":"高齢者の大腿骨近位部骨折術後に早期離床を図る主な目的はどれか。","o":["臥床合併症を減らし移動能力の再獲得を促す","骨折部へ最大負荷を加えて仮骨形成を停止させる","股関節を固定して筋活動を完全に抑える","歩行補助具を使わず独歩だけを練習する"],"a":0,"e":"正解は『臥床合併症を減らし移動能力の再獲得を促す』である。早期離床とリハビリテーションは、肺炎、血栓症、褥瘡、廃用など長期臥床に伴う問題の予防に役立つ。実際の荷重量は術式、固定性、合併症、医師の指示に従う。","t":""},{"n":251,"c":5,"s":"前十字靱帯の非接触損傷が生じやすい典型的な場面はどれか。","o":["接触で膝前面を後方へ押される場面","底屈位の足関節を内反させる場面","減速や着地で膝が内側へ崩れる場面","伸展位の肘に外反力が加わる場面"],"a":2,"e":"正解は『減速や着地で膝が内側へ崩れる場面』である。非接触型の前十字靱帯損傷は、急減速、方向転換、片脚着地などで動的膝外反が生じた際に発生しやすい。","t":""},{"n":252,"c":5,"s":"膝内側側副靱帯の主要な機能はどれか。","o":["膝に加わる外反ストレスを制動する","膝に加わる内反ストレスを制動する","脛骨の後方移動を主に制動する","膝蓋骨の上方移動を主に制動する"],"a":0,"e":"正解は『膝に加わる外反ストレスを制動する』である。膝内側側副靱帯は膝内側の安定性に関与し、外反力に対する主要な制動組織となる。","t":""},{"n":253,"c":5,"s":"足関節外側靱帯損傷で前距腓靱帯を損傷しやすい肢位はどれか。","o":["足関節を背屈して外反した肢位","膝関節を伸展して外反した肢位","股関節を伸展して内転した肢位","足関節を底屈して内反した肢位"],"a":3,"e":"正解は『足関節を底屈して内反した肢位』である。前距腓靱帯は底屈位で緊張しやすく、この肢位に強い内反力が加わると損傷しやすい。","t":""},{"n":254,"c":5,"s":"遠位脛腓靱帯損傷に典型的な受傷外力はどれか。","o":["足関節の底屈と下腿内旋の組合せ","足関節の背屈と足部の外旋の組合せ","膝関節の屈曲と股関節伸展の組合せ","肘関節の伸展と前腕回内の組合せ"],"a":1,"e":"正解は『足関節の背屈と足部の外旋の組合せ』である。遠位脛腓靱帯損傷では、背屈と外旋により脛骨と腓骨の間を開く力が加わる。距骨が足関節窩内で外旋し、腓骨を外側後方へ押し開く。接地下では相対的に下腿が内旋する。","t":"【要修正】原文「下腿外旋」は不正確（外旋するのは下腿に対する足部・距骨）。"},{"n":255,"c":5,"s":"一般的な靱帯損傷の重症度分類で3度損傷の特徴はどれか。","o":["線維の微細損傷で不安定性を認めない状態","靱帯の完全断裂で明らかな不安定性を示す状態","靱帯の部分断裂で軽度の不安定性を示す状態","付着部の圧痛のみで機械的不安定性がない状態"],"a":1,"e":"正解は『靱帯の完全断裂で明らかな不安定性を示す状態』である。3度損傷では靱帯線維の連続性が失われ、ストレステストで終末感の消失や著明な関節弛緩性を認めることがある。","t":""},{"n":256,"c":5,"s":"前十字靱帯の損傷を評価する代表的な徒手検査はどれか。","o":["McMurray testによる関節裂隙痛の評価","Thompson testによる足関節運動の評価","後方引き出しtestによる脛骨移動の評価","Lachman testによる脛骨前方移動の評価"],"a":3,"e":"正解は『Lachman testによる脛骨前方移動の評価』である。Lachman testは膝を軽度屈曲位として脛骨の前方移動量と終末感を調べ、前十字靱帯の機能を評価する。","t":""},{"n":257,"c":5,"s":"後十字靱帯損傷の評価に用いられる代表的な徒手検査はどれか。","o":["後方引き出しtestで脛骨の後方移動を調べる","前方引き出しtestで距骨の前方移動を調べる","外反ストレスtestで膝内側の開大を調べる","内反ストレスtestで膝外側の開大を調べる"],"a":0,"e":"正解は『後方引き出しtestで脛骨の後方移動を調べる』である。後十字靱帯は脛骨の後方移動を制動するため、損傷すると後方移動量が増加する。","t":""},{"n":258,"c":5,"s":"急性足関節外側靱帯損傷に対する初期の運動療法として適切なのはどれか。","o":["冷却だけを用いて腫脹消失まで運動を控える","硬性固定を用いて競技復帰まで完全免荷を続ける","外部支持を用いて疼痛範囲で荷重と運動を進める","徒手療法だけを用いて筋力訓練を長く見送る"],"a":2,"e":"正解は『外部支持を用いて疼痛範囲で荷重と運動を進める』である。重篤な損傷を除き、装具などで保護しながら早期に荷重、可動域運動、神経筋訓練へ進む機能的治療が推奨される。","t":""},{"n":259,"c":5,"s":"慢性足関節不安定症に対する運動療法として適切なのはどれか。","o":["足趾の単純反復運動だけを実施する","足関節の他動可動域訓練だけを実施する","下腿への温熱療法だけを反復実施する","バランス訓練と神経筋訓練を実施する"],"a":3,"e":"正解は『バランス訓練と神経筋訓練を実施する』である。慢性足関節不安定症では固有感覚や姿勢制御の障害を認めることがあり、動的バランスや着地制御の訓練が重要となる。","t":""},{"n":260,"c":5,"s":"前十字靱帯損傷後に大腿四頭筋の活動を回復させる初期対応はどれか。","o":["膝屈曲拘縮を保ち屈筋群だけを強化する","関節腫脹を残し高負荷の跳躍から開始する","関節腫脹を抑え伸展確保と四頭筋活動を促す","膝装具で固定し下肢運動を長期間中止する"],"a":2,"e":"正解は『関節腫脹を抑え伸展確保と四頭筋活動を促す』である。関節液貯留は関節原性筋抑制を起こし、大腿四頭筋の活動を低下させる。腫脹管理と完全伸展の回復を図りながら筋活動を再教育する。","t":""},{"n":261,"c":5,"s":"スポーツにおける筋損傷が生じやすい条件はどれか。","o":["筋腹中央での低負荷な等尺性収縮","筋腱移行部での高負荷な遠心性収縮","腱付着部での低負荷な求心性収縮","関節包周囲での反復的な静的保持"],"a":1,"e":"正解は『筋腱移行部での高負荷な遠心性収縮』である。筋が伸張されながら大きな張力を発揮する局面では筋線維への負担が増え、筋腱移行部を中心に損傷しやすい。","t":""},{"n":262,"c":5,"s":"高速走行型のハムストリングス肉離れで損傷頻度が高い筋はどれか。","o":["大腿二頭筋長頭","半膜様筋","薄筋","大内転筋"],"a":0,"e":"正解は『大腿二頭筋長頭』である。大腿二頭筋長頭は高速走行の遊脚終期に大きな遠心性負荷を受けるため、スプリント型肉離れの好発部位となる。","t":""},{"n":263,"c":5,"s":"急性期の肉離れに対する基本的な臨床評価はどれか。","o":["受傷機転、圧痛、筋力、可動域を評価する","安静時脈拍、血圧、体温、体重を評価する","競技年数、睡眠時間、利き脚、足長を評価する","握力、視力、聴力、身長を評価する"],"a":0,"e":"正解は『受傷機転、圧痛、筋力、可動域を評価する』である。急性筋損傷では受傷時の動作を確認し、圧痛範囲、伸張時痛、抵抗運動時痛、筋力低下などを系統的に評価する。","t":""},{"n":264,"c":5,"s":"肉離れの受傷直後に強い伸張運動を行うことについて適切なのはどれか。","o":["痛みを越えて反復し血流を最大化する","筋出力を高めるため毎回限界まで行う","損傷部を広げる恐れがあり初期は避ける","瘢痕形成を防ぐため受傷直後から続ける"],"a":2,"e":"正解は『損傷部を広げる恐れがあり初期は避ける』である。受傷直後の過度な伸張や強いマッサージは出血や組織損傷を増大させる可能性がある。症状に応じた保護の後、段階的に可動域を回復させる。","t":""},{"n":265,"c":5,"s":"テニスレッグと呼ばれる下腿後面の筋損傷で典型的な損傷部位はどれか。","o":["前脛骨筋の遠位筋腱移行部","腓腹筋内側頭の筋腱移行部","長腓骨筋の近位筋腱移行部","後脛骨筋の遠位筋腱移行部"],"a":1,"e":"正解は『腓腹筋内側頭の筋腱移行部』である。テニスレッグでは、膝伸展位で足関節が急に背屈される場面などで腓腹筋内側頭が損傷しやすい。","t":""},{"n":266,"c":5,"s":"内転筋関連鼠径部痛を示唆する所見はどれか。","o":["腸腰筋部の圧痛と抵抗下股関節屈曲痛","鼠径管部の圧痛と咳による症状増悪","恥骨結合部の圧痛だけを示す状態","内転筋部の圧痛と抵抗下股関節内転痛"],"a":3,"e":"正解は『内転筋部の圧痛と抵抗下股関節内転痛』である。内転筋関連鼠径部痛は内転筋部の圧痛に加え、抵抗下内転運動で同部の痛みが再現されることが特徴となる。","t":""},{"n":267,"c":5,"s":"遅発性筋痛の特徴として適切なのはどれか。","o":["運動中に突然発症し関節不安定性を伴う","安静中に突然発症し著明な腫脹を伴う","不慣れな運動後に遅れて現れ数日で軽快する","軽負荷運動直後に発症し数か月間持続する"],"a":2,"e":"正解は『不慣れな運動後に遅れて現れ数日で軽快する』である。遅発性筋痛は特に遠心性負荷を含む不慣れな運動後に生じ、通常は運動後24時間以降に強くなる。突然の鋭い痛みを伴う急性肉離れとは区別する。","t":""},{"n":268,"c":5,"s":"肉離れ後の早期に等尺性運動を導入する利点はどれか。","o":["筋長を大きく変化させて最大速度を再現できる","筋長変化を抑えつつ筋出力を再導入できる","衝撃負荷を加えながら最大跳躍を再現できる","関節運動を強制しながら柔軟性を改善できる"],"a":1,"e":"正解は『筋長変化を抑えつつ筋出力を再導入できる』である。等尺性運動は筋の長さ変化を小さく保ちながら負荷を調整できるため、症状に配慮した筋活動の再導入に用いられる。","t":""},{"n":269,"c":5,"s":"肉離れ後の後期リハビリテーションで遠心性運動を行う主な目的はどれか。","o":["筋が短縮する負荷だけに適応させる","筋活動を抑えて完全安静を維持する","関節への荷重を避けて持久力を下げる","筋が伸張されながら力を出す能力を高める"],"a":3,"e":"正解は『筋が伸張されながら力を出す能力を高める』である。競技中には筋が長い位置で大きな張力を発揮するため、後期には遠心性筋力と長い筋長での負荷耐性を回復させる必要がある。","t":""},{"n":270,"c":5,"s":"ハムストリングス肉離れの再受傷リスクを高める要因はどれか。","o":["既往歴があり筋力や走能力が不十分である","既往歴がなく十分な高速度走を経験している","痛みが消え競技負荷を段階的に経験している","筋力が回復し疲労下の動作まで確認している"],"a":0,"e":"正解は『既往歴があり筋力や走能力が不十分である』である。過去のハムストリングス損傷は重要な再受傷リスクであり、筋力や高速度走への耐性が不十分な状態での復帰は避ける。","t":""},{"n":271,"c":5,"s":"運動器の腱障害に対する現代的な捉え方はどれか。","o":["滑膜に生じた急性細菌感染と捉える","負荷に対する腱組織の適応不全と捉える","筋腹に生じた完全断裂だけと捉える","末梢神経に生じた絞扼障害だけと捉える"],"a":1,"e":"正解は『負荷に対する腱組織の適応不全と捉える』である。腱障害は単純な急性炎症だけでは説明できず、反復負荷に対する細胞や腱基質の適応不全が関与する。","t":""},{"n":272,"c":5,"s":"膝蓋腱障害に典型的な症状はどれか。","o":["膝蓋骨下極付近で跳躍により増える痛み","膝関節内側部で水泳により増える痛み","大腿外側部で歩行により増えるしびれ","膝窩中央部で安静により増える痛み"],"a":0,"e":"正解は『膝蓋骨下極付近で跳躍により増える痛み』である。膝蓋腱障害では膝蓋骨下極付近に局在する痛みがみられ、跳躍や着地など膝伸展機構への高負荷で増悪する。","t":""},{"n":273,"c":5,"s":"アキレス腱中部腱障害に典型的な疼痛部位はどれか。","o":["踵骨付着部から0から1 cm近位の部位","踵骨付着部から1から2 cm遠位の部位","踵骨付着部から2から6 cm近位の部位","腓腹筋起始部から2から6 cm遠位の部位"],"a":2,"e":"正解は『踵骨付着部から2から6 cm近位の部位』である。アキレス腱中部腱障害では、踵骨付着部より近位の腱中部に荷重時痛や圧痛、腱肥厚を認めることが多い。","t":""},{"n":274,"c":5,"s":"アキレス腱中部腱障害に対する基本的な運動療法はどれか。","o":["症状が消えるまで完全安静だけを続ける","受動的な物理療法だけを長期間反復する","疼痛が残る間は腱への負荷を全て禁止する","症状を監視しながら腱への負荷運動を進める"],"a":3,"e":"正解は『症状を監視しながら腱への負荷運動を進める』である。段階的な腱負荷運動は、アキレス腱中部腱障害に対する中核的な介入である。完全安静では腱と筋の負荷耐性がさらに低下することがある。","t":""},{"n":275,"c":5,"s":"アキレス腱付着部障害の運動導入時に配慮すべき内容はどれか。","o":["台の下まで踵を下げて背屈圧縮を増やす","硬い路面での長距離走を初期から増やす","急な上り坂のダッシュを初期から増やす","深い背屈位での踵下げを初期には控える"],"a":3,"e":"正解は『深い背屈位での踵下げを初期には控える』である。付着部障害では深い足関節背屈によりアキレス腱付着部への圧縮負荷が増えるため、初期は運動範囲を調整する。","t":""},{"n":276,"c":5,"s":"内側脛骨ストレス症候群に典型的な圧痛所見はどれか。","o":["脛骨前縁の一点に限局する圧痛","脛骨後内側縁に5 cm以上広がる圧痛","腓骨頭周囲の一点に限局する圧痛","膝蓋骨下極に5 cm以上広がる圧痛"],"a":1,"e":"正解は『脛骨後内側縁に5 cm以上広がる圧痛』である。内側脛骨ストレス症候群では脛骨後内側縁に沿った比較的広い範囲の圧痛を認める。限局性の強い骨性圧痛では骨疲労損傷を疑う。","t":""},{"n":277,"c":5,"s":"骨疲労損傷を疑う所見として重要なのはどれか。","o":["骨の限局性圧痛と衝撃動作で増える痛み","筋腹の広範な圧痛と温熱で減る痛み","皮膚の表在性発赤と擦過で増える痛み","関節の弾発現象と他動で消える痛み"],"a":0,"e":"正解は『骨の限局性圧痛と衝撃動作で増える痛み』である。走行や跳躍などの衝撃で増悪する骨性疼痛と限局性圧痛は骨疲労損傷を示唆し、負荷中止と医学的評価が必要となる。","t":""},{"n":278,"c":5,"s":"女性アスリートの三主徴を構成する要素はどれか。","o":["低エネルギー利用可能性、貧血、腱の健康","高エネルギー利用可能性、月経機能、筋力","低エネルギー利用可能性、月経機能、骨健康","低エネルギー利用可能性、血圧、神経機能"],"a":2,"e":"正解は『低エネルギー利用可能性、月経機能、骨健康』である。これらは相互に関連する連続体として捉えられ、低エネルギー利用可能性は月経機能や骨健康へ悪影響を及ぼす。","t":""},{"n":279,"c":5,"s":"スポーツにおける相対的エネルギー不足であるREDs（旧称RED-S）の説明はどれか。","o":["低エネルギー利用可能性が多臓器機能へ影響する状態","女性の月経異常だけが骨機能へ影響する状態","男性の筋量増加だけが心機能へ影響する状態","感染性炎症だけが関節機能へ影響する状態"],"a":0,"e":"正解は『低エネルギー利用可能性が多臓器機能へ影響する状態』である。RED-Sは性別を問わず生じ、骨、代謝、免疫、生殖、心理、競技能力など広範な領域へ影響し得る。2023年のIOCコンセンサスで名称がREDsに改められ、心理面を含む健康とパフォーマンスへの影響として整理された。","t":"【更新】IOC 2023でRED-S→REDsへ改称。"},{"n":280,"c":5,"s":"Osgood-Schlatter病の病態として適切なのはどれか。","o":["成長期の踵骨骨端に生じる牽引性障害","成長期の膝蓋骨上極に生じる圧迫性障害","成人の脛骨骨幹に生じる疲労性障害","成長期の脛骨粗面に生じる牽引性障害"],"a":3,"e":"正解は『成長期の脛骨粗面に生じる牽引性障害』である。成長期に膝蓋腱を介した反復牽引力が脛骨粗面へ加わり、運動時痛や局所圧痛を生じる。","t":""},{"n":281,"c":5,"s":"Sever病の病態として適切なのはどれか。","o":["成人の距骨滑車に生じる骨軟骨障害","成長期の舟状骨に生じる無腐性壊死","成長期の踵骨骨端に生じる牽引性障害","成人の踵骨体部に生じる感染性障害"],"a":2,"e":"正解は『成長期の踵骨骨端に生じる牽引性障害』である。Sever病は成長期の踵骨骨端症であり、走行や跳躍に伴うアキレス腱の牽引などで踵部痛が増悪する。","t":""},{"n":282,"c":5,"s":"オーバーユース障害の発生リスクを高める負荷変化はどれか。","o":["練習量を長期にわたり一定に保つこと","練習量や強度を短期間に急増させること","休養日を計画的に設けて回復を促すこと","競技特性に合わせて筋力を高めること"],"a":1,"e":"正解は『練習量や強度を短期間に急増させること』である。組織の適応速度を超える急激な負荷増加は、腱障害や骨疲労損傷などの発生に関与する。","t":""},{"n":283,"c":5,"s":"競技中に意識を失って倒れた競技者への初期対応で最優先することはどれか。","o":["患部の詳細な徒手検査を最初に行う","競技復帰時期の見通しを最初に伝える","一次評価で生命を脅かす異常を確認する","損傷部位の筋力測定を最初に実施する"],"a":2,"e":"正解は『一次評価で生命を脅かす異常を確認する』である。現場の安全を確保したうえで、気道、呼吸、循環、意識状態などを迅速に評価し、必要に応じて救急要請や蘇生を行う。","t":""},{"n":284,"c":5,"s":"スポーツ現場で骨折または脱臼が疑われる場合の対応はどれか。","o":["患部を固定し神経血管所見を確認して搬送する","変形を繰り返し整復して競技継続を促す","疼痛部位を強く揉み腫脹の消退を待つ","荷重歩行を試し症状の再現性を確認する"],"a":0,"e":"正解は『患部を固定し神経血管所見を確認して搬送する』である。末梢の脈拍、皮膚色、感覚、運動を固定の前後に確認し、適切に固定して医療機関へ搬送する。無理な整復や荷重確認は組織損傷を悪化させる。","t":""},{"n":285,"c":5,"s":"急性軟部組織損傷に対して圧迫を行う主な目的はどれか。","o":["組織温を上げて代謝を促進すること","腫脹を抑えながら患部を支持すること","関節可動域を強制的に拡大すること","損傷組織への血流を完全に止めること"],"a":1,"e":"正解は『腫脹を抑えながら患部を支持すること』である。弾性包帯などによる適度な圧迫は腫脹管理に用いられるが、循環や感覚を障害するほど強く巻いてはならない。","t":""},{"n":286,"c":5,"s":"急性軟部組織損傷に対する冷却の用い方として適切なのはどれか。","o":["組織修復の加速を目的に長時間用いる","炎症反応の消失を目的に連続して用いる","感覚消失の維持を目的に反復して用いる","短時間の鎮痛を目的に皮膚を保護して用いる"],"a":3,"e":"正解は『短時間の鎮痛を目的に皮膚を保護して用いる』である。冷却には短期的な鎮痛効果が期待できるが、組織修復を必ず促進するものではない。長時間の使用による凍傷や神経障害に注意する。","t":""},{"n":287,"c":5,"s":"急性軟部組織損傷に用いられるPEACEのProtectが示す内容はどれか。","o":["Protectは早期から最大負荷を加えることを指す","Protectは受傷部への過負荷を避けることを指す","Protectは抗炎症薬を定期使用することを指す","Protectは痛みを無視して運動することを指す"],"a":1,"e":"正解は『Protectは受傷部への過負荷を避けることを指す』である。急性期には損傷を増悪させる動作や負荷を短期間制限し、その後は症状に応じて適切な負荷へ移行する。","t":""},{"n":288,"c":5,"s":"軟部組織損傷後に用いられるLOVEのLoadが示す内容はどれか。","o":["Loadは長期間の完全安静を続けることを指す","Loadは局所冷却を反復して行うことを指す","Loadは症状に応じて負荷を戻すことを指す","Loadは装具で全運動を禁止することを指す"],"a":2,"e":"正解は『Loadは症状に応じて負荷を戻すことを指す』である。適切な機械的負荷は組織修復と機能回復を促すため、疼痛や腫脹などの反応を確認しながら段階的に進める。","t":""},{"n":289,"c":5,"s":"急性コンパートメント症候群を疑い緊急対応すべき所見はどれか。","o":["運動開始時だけの軽いこわばりと圧痛","休息で軽快する広範な筋疲労と張り","動作時だけの軽い関節音と違和感","増悪する激痛と他動伸張痛を伴う緊満"],"a":3,"e":"正解は『増悪する激痛と他動伸張痛を伴う緊満』である。急性コンパートメント症候群は組織灌流を障害する緊急病態であり、強い疼痛や筋区画の緊満を認めた場合は直ちに救急対応する。","t":""},{"n":290,"c":5,"s":"頸椎損傷が疑われる競技者への現場対応として適切なのはどれか。","o":["頭頸部を徒手で保持し不用意な移動を避ける","頸部を反復回旋し可動域を詳しく調べる","座位へ素早く起こし意識状態を確認する","防具を全て外し歩行可能かを確認する"],"a":0,"e":"正解は『頭頸部を徒手で保持し不用意な移動を避ける』である。頸椎損傷が疑われる場合は頭頸部を中間位で安定させ、気道管理に必要な場合を除いて不要な移動を避ける。","t":""},{"n":291,"c":5,"s":"競技復帰を連続的な過程として捉えた場合の段階順序はどれか。","o":["競技復帰、参加復帰、パフォーマンス復帰","パフォーマンス復帰、参加復帰、競技復帰","参加復帰、パフォーマンス復帰、競技復帰","参加復帰、競技復帰、パフォーマンス復帰"],"a":3,"e":"正解は『参加復帰、競技復帰、パフォーマンス復帰』である。参加復帰では修正された練習などへ参加し、競技復帰では競技可能となり、その後に受傷前と同等以上のパフォーマンス回復を目指す。","t":"【解説修正】Ardern 2016の定義は「同等以上」。"},{"n":292,"c":5,"s":"競技復帰の意思決定における共有意思決定として適切なのはどれか。","o":["競技者を中心に医療者と競技関係者が情報を共有する","指導者だけが試合日程を基準に復帰日を決定する","医療者だけが画像所見を基準に復帰日を決定する","競技者だけが痛みの有無を基準に復帰日を決定する"],"a":0,"e":"正解は『競技者を中心に医療者と競技関係者が情報を共有する』である。競技復帰では競技者の価値観を尊重し、医療上のリスク、競技要求、社会的要因などを関係者間で共有して判断する。","t":""},{"n":293,"c":5,"s":"受傷からの経過日数だけで競技復帰を決定することについて適切なのはどれか。","o":["受傷からの日数だけで組織機能を判定できる","日数に加えて機能と競技要求への対応を確認する","画像の正常化だけで競技能力を判定できる","安静時痛の消失だけで再受傷を防止できる"],"a":1,"e":"正解は『日数に加えて機能と競技要求への対応を確認する』である。治癒期間は参考となるが、症状、筋力、動作能力、心理面、競技特異的負荷への耐性も確認する必要がある。","t":""},{"n":294,"c":5,"s":"競技復帰判定で組み合わせて用いる評価項目として適切なのはどれか。","o":["身長、体重、利き脚、競技年数、学年を用いる","体温、血圧、脈拍、睡眠時間、食事回数を用いる","症状、可動域、筋力、動作、競技課題を用いる","画像、術後日数、年齢、希望日、試合数を用いる"],"a":2,"e":"正解は『症状、可動域、筋力、動作、競技課題を用いる』である。競技復帰は単一検査で決めず、身体機能、神経筋制御、競技特異的能力などを含む複数の基準で判断する。","t":""},{"n":295,"c":5,"s":"段階的な負荷増加に用いる疼痛モニタリングとして適切なのはどれか。","o":["運動中の症状と終了後から翌日の反応を確認する","運動直前の安静時痛だけで負荷量を判断する","初回の画像所見だけで毎回の負荷量を判断する","年齢と競技年数だけで毎回の負荷量を判断する"],"a":0,"e":"正解は『運動中の症状と終了後から翌日の反応を確認する』である。負荷への反応は運動中だけでなく、終了後や翌日の疼痛、腫脹、こわばりなども確認し、次の負荷量を調整する。","t":""},{"n":296,"c":5,"s":"競技復帰に向けたトレーニング負荷の進め方として適切なのはどれか。","o":["低強度から試合強度へ一度に引き上げる","強度、量、頻度を段階的に競技水準へ近づける","症状が消えた日に練習量を一度に倍増させる","疲労下の動作確認を行わず試合へ移行する"],"a":1,"e":"正解は『強度、量、頻度を段階的に競技水準へ近づける』である。組織と全身の適応を確認しながら負荷を漸増し、最終的に競技特有の速度、接触、反復回数へ近づける。","t":""},{"n":297,"c":5,"s":"アスレティックリハビリテーションに特徴的な内容はどれか。","o":["日常生活動作だけで訓練内容を完結させる","安静時の関節可動域だけで復帰を決定する","競技特有の技能と環境条件を段階的に再現する","一般的な筋力訓練だけで試合へ直結させる"],"a":2,"e":"正解は『競技特有の技能と環境条件を段階的に再現する』である。筋力や可動域の回復に加え、加速、減速、方向転換、接触、疲労など実際の競技要求への適応を進める。","t":""},{"n":298,"c":5,"s":"前十字靱帯再建術後の競技復帰判定に用いる検査の組合せはどれか。","o":["安静時痛、画像所見、術後日数を組み合わせる","膝周径、身長、競技年数、利き脚を組み合わせる","可動域、体温、血圧、安静時脈拍を組み合わせる","筋力、跳躍、動作品質、心理面を組み合わせる"],"a":3,"e":"正解は『筋力、跳躍、動作品質、心理面を組み合わせる』である。前十字靱帯再建術後は筋力やhop testだけでなく、着地動作の質、症状、競技特異的能力、心理的準備性も含めて評価する。","t":""},{"n":299,"c":5,"s":"ハムストリングス肉離れ後の競技復帰準備として重要なのはどれか。","o":["低速歩行だけを反復して走能力を判定する","高速度走を段階的に導入し反応を確認する","静的伸張だけを反復して走能力を判定する","非荷重運動だけを反復して復帰を判定する"],"a":1,"e":"正解は『高速度走を段階的に導入し反応を確認する』である。高速走行型の肉離れではスプリント負荷への再適応が不可欠であり、速度と走行量を徐々に高めながら症状を監視する。","t":""},{"n":300,"c":5,"s":"公式戦への復帰前に行う最終段階の確認として適切なのはどれか。","o":["制限なしのチーム練習で競技要求を確認する","個別の低強度練習から直接公式戦へ移行する","医療室での筋力測定だけで公式戦へ移行する","安静時の無痛だけを確認して公式戦へ移行する"],"a":0,"e":"正解は『制限なしのチーム練習で競技要求を確認する』である。公式戦前には通常練習へ参加し、競技特有の速度、接触、判断、疲労に耐えられるかを確認する。","t":""},{"n":301,"c":6,"s":"自動ROMと他動ROMの特徴に関する記述で適切なのはどれか。","o":["自動ROMは随意筋収縮の影響を受ける","自動ROMは関節包の硬さだけを反映する","他動ROMは被検者の筋力だけで決定される","他動ROMは常に自動ROMより小さくなる"],"a":0,"e":"正解は『自動ROMは随意筋収縮の影響を受ける』である。自動ROMは筋力、疼痛、神経機能、運動制御などの影響を受け、他動ROMは主に関節や軟部組織の可動性を反映する。","t":""},{"n":302,"c":6,"s":"関節角度計の軸心を合わせる位置として適切なのはどれか。","o":["近位骨の中央部に合わせる","関節運動の軸に合わせる","遠位骨の末端部に合わせる","検査筋の筋腹部に合わせる"],"a":1,"e":"正解は『関節運動の軸に合わせる』である。角度計の軸心はおおむね関節運動の軸に置き、両アームを規定の基本軸・移動軸に合わせる。なお基本軸・移動軸は外見上わかりやすい部位で定められ、運動学上の軸とは必ずしも一致しない。","t":"【解説修正】日本の関節可動域表示ならびに測定法の記載に合わせた。"},{"n":303,"c":6,"s":"骨性終末感の特徴として適切なのはどれか。","o":["筋の伸張による弾性抵抗を感じる","軟部組織同士の圧迫抵抗を感じる","骨同士の接触による停止を感じる","疼痛による防御性収縮だけを感じる"],"a":2,"e":"正解は『骨同士の接触による停止を感じる』である。骨性終末感は硬く急な停止として感じられ、肘関節伸展などでみられる。筋や関節包の伸張では、より弾性のある終末感となる。","t":""},{"n":304,"c":6,"s":"ROM測定で代償運動を防ぐための基本的な操作はどれか。","o":["遠位部を一定の強さで圧迫する","測定中に検査体位を変更する","反対側に同じ関節運動を行わせる","近位部を確実に固定する"],"a":3,"e":"正解は『近位部を確実に固定する』である。近位部の固定は隣接関節や体幹による代償を抑え、対象関節の運動を選択的に測定するために必要である。","t":""},{"n":305,"c":6,"s":"肩関節屈曲のROM測定で腰椎伸展による代償を防ぐ方法はどれか。","o":["体幹を固定して腰椎伸展を抑える","肩甲帯を挙上して屈曲角度を広げる","肘関節を屈曲して体幹運動を促す","骨盤を前傾して屈曲角度を広げる"],"a":0,"e":"正解は『体幹を固定して腰椎伸展を抑える』である。肩関節屈曲時の腰椎伸展や骨盤前傾は、見かけ上の可動域を増大させるため、体幹を安定させて測定する。","t":""},{"n":306,"c":6,"s":"膝関節伸展が屈曲10度の位置で止まる場合の記録はどれか。","o":["伸展10度と記録する","伸展-10度と記録する","屈曲-10度と記録する","屈曲10度と記録する"],"a":1,"e":"正解は『伸展-10度と記録する』である。解剖学的基本肢位の伸展0度に10度届かないため、伸展可動域は-10度と表す。","t":""},{"n":307,"c":6,"s":"他動ROMは保たれているが自動ROMが小さい場合に疑う所見はどれか。","o":["骨
